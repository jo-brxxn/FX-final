name: DIAG Investing.com coverage
# Temporaerer Diagnose-Workflow (Nutzer-Wunsch 2026-07-23): prueft, welche
# unserer Makro-Indikatoren Investing.com ueber ein volles Release-Fenster
# (110 Tage) mit Actual/Forecast/Previous liefert - Grundlage fuer die
# Entscheidung "Investing.com als einzige Quelle". Nur manuell, wird nach der
# Auswertung wieder entfernt.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Investing.com in short windows (all 8 currencies incl. US + CH)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          rm -f inv_all.ndjson
          # 15 Fenster a 8 Tage rueckwaerts (~120 Tage). Investing.com liefert
          # bei zu weiten Bereichen eine leere 3-Byte-Antwort - deshalb kurze
          # Fenster einzeln holen und aggregieren.
          for w in $(seq 0 14); do
            FROM=$(node -e "console.log(new Date(Date.now()-(($w*8)+8)*86400e3).toISOString().slice(0,10))")
            TO=$(node -e "console.log(new Date(Date.now()-($w*8)*86400e3).toISOString().slice(0,10))")
            ok=0
            for try in 1 2 3; do
              curl -sL -A "$UA" \
                -H "X-Requested-With: XMLHttpRequest" \
                -H "Referer: https://www.investing.com/economic-calendar/" \
                -H "Accept: application/json" \
                --data-urlencode "country[]=5"  --data-urlencode "country[]=72" \
                --data-urlencode "country[]=17" --data-urlencode "country[]=22" \
                --data-urlencode "country[]=4"  --data-urlencode "country[]=35" \
                --data-urlencode "country[]=6"  --data-urlencode "country[]=25" \
                --data-urlencode "country[]=43" --data-urlencode "country[]=12" \
                --data-urlencode "dateFrom=$FROM" \
                --data-urlencode "dateTo=$TO" --data-urlencode "timeZone=8" \
                --data-urlencode "timeFilter=timeRemain" --data-urlencode "currentTab=custom" \
                --data-urlencode "submitFilters=1" --data-urlencode "limit_from=0" \
                "https://www.investing.com/economic-calendar/Service/getCalendarFilteredData" -o invcal.json || true
              SIZE=$(wc -c <invcal.json 2>/dev/null | tr -d ' ');SIZE=${SIZE:-0}
              if [ "$SIZE" -gt 5000 ] && head -c 20 invcal.json | grep -q '{'; then ok=1; cat invcal.json >> inv_all.ndjson; echo >> inv_all.ndjson; break; fi
              [ "$try" -lt 3 ] && sleep 10
            done
            echo "[debug] window $FROM..$TO: size=$SIZE ok=$ok"
            sleep 2
          done
          node -e '
            const fs=require("fs");
            const C2C={"united states":"USD","switzerland":"CHF","germany":"EUR","france":"EUR","euro zone":"EUR","united kingdom":"GBP","japan":"JPY","canada":"CAD","australia":"AUD","new zealand":"NZD"};
            let lines=[];try{lines=fs.readFileSync("inv_all.ndjson","utf8").split("\n").filter(Boolean);}catch(e){}
            const byCcy={};let rows=0,htmls=0;
            lines.forEach(line=>{
              let payload=null;try{payload=JSON.parse(line);}catch(e){return;}
              const html=payload&&typeof payload.data==="string"?payload.data:null;if(!html)return;htmls++;
              const rowRe=/<tr([^>]*\bid="eventRowId_\d+"[^>]*)>([\s\S]*?)<\/tr>/g;let rm;
              while((rm=rowRe.exec(html))){
                const attrs=rm[1],body=rm[2];
                const idM=attrs.match(/\bid="eventRowId_(\d+)"/);if(!idM)continue;
                const evId=idM[1];rows++;
                const flagM=body.match(/flagCur[^>]*>[\s\S]*?title="([^"]*)"/);
                const ccy=flagM?C2C[flagM[1].trim().toLowerCase()]:null;if(!ccy)continue;
                const nameM=body.match(/class="left event"[^>]*>([\s\S]*?)<\/td>/);
                const name=nameM?nameM[1].replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim():"";if(!name)continue;
                const grab=f=>{const m=body.match(new RegExp("id=\"event"+f+"_"+evId+"\"[^>]*>([^<]*)<"));return m?m[1].trim():"";};
                const a=grab("Actual"),f=grab("Forecast"),p=grab("Previous");
                if(!a&&!f&&!p)continue;
                const key=ccy+"||"+name;
                const o=byCcy[key]||(byCcy[key]={ccy,name,n:0,wA:0,wF:0,wP:0});
                o.n++;if(a)o.wA++;if(f)o.wF++;if(p)o.wP++;
              }
            });
            console.log("[debug] usable window responses: "+htmls+", event rows: "+rows+", distinct ccy|title: "+Object.keys(byCcy).length);
            const arr=Object.values(byCcy).sort((x,y)=>x.ccy<y.ccy?-1:x.ccy>y.ccy?1:(x.name<y.name?-1:1));
            ["USD","EUR","GBP","CHF","JPY","CAD","AUD","NZD"].forEach(c=>{
              const list=arr.filter(o=>o.ccy===c);
              console.log("===== "+c+" ("+list.length+" distinct titles) =====");
              list.forEach(o=>{console.log("  "+o.name+"  | rel="+o.n+" A="+o.wA+" F="+o.wF+" P="+o.wP+(o.wF===0?"  <<< NO FORECAST":""));});
            });
          '
