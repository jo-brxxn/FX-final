# Holt EIN Sternenhimmel-Bild fuer die Overview-Seite.
#
# Anlass (Nutzer 2026-09-11): "als Hintergrund einen Nacht Sternenhimmel aus
# dem Internet also hohe Qualitaet."
#
# ⚠ WARUM EIN WORKFLOW UND NICHT EINFACH EIN DOWNLOAD: die Arbeitsumgebung,
# in der dieser Code entsteht, darf nicht ins offene Netz - der Egress-Proxy
# beantwortet CONNECT zu nasa.gov, unsplash.com und wikimedia.org mit 403.
# Der GitHub-Runner darf es; ueber ihn laufen ohnehin alle Datenfeeds.
#
# ⚠ WARUM AUSGERECHNET NASA: ein Hintergrundbild wird Teil des Repos und wird
# ausgeliefert. Das schliesst die meisten schoenen Astrofotos aus - bei APOD
# etwa liegt das Urheberrecht fast immer beim einzelnen Fotografen, nicht bei
# der NASA. Von der NASA selbst erstellte Bilder sind dagegen gemeinfrei.
# Deshalb wird ueber die dokumentierte NASA-Bild-API gesucht und der
# Herkunftsnachweis (Titel, nasa_id, Adresse, Zentrum) neben dem Bild
# abgelegt - nicht geraten, sondern belegt.
# ⚠ STAND 2026-09-12: der ausgelieferte Himmel ist NICHT das Ergebnis dieses
# Workflows, sondern gezeichnet (tools/sternenhimmel.py). Sechs Laeufe hier
# haben gezeigt, dass NASAs gemeinfreie Bibliothek keinen duenn besetzten,
# scharfen Nachthimmel hergibt: Teleskopaufnahmen haben rund 10000
# aufloesbare Sterne je Ausschnitt und 5-10 Pixel breite Sternscheiben, die
# duennen Treffer sind Illustrationen. Lauf 6 bricht seitdem ehrlich ab
# ("Kein Kandidat war ein echtes Sternfeld") statt etwas Falsches zu nehmen.
# Dieser Workflow bleibt als Werkzeug bestehen, schreibt aber bewusst nach
# img/starfield-foto.webp und fasst den ausgelieferten Himmel NICHT an -
# sonst wuerde ein Lauf die bessere Fassung still ersetzen.
name: Fetch starfield background

on:
  workflow_dispatch:
    inputs:
      suchbegriff:
        description: "Suchbegriff fuer die NASA-Bild-API"
        required: false
        default: "star field night sky stars"

jobs:
  holen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Kandidaten suchen und den besten holen
        id: suche
        run: |
          set -e
          Q="${{ github.event.inputs.suchbegriff }}"
          [ -z "$Q" ] && Q="milky way starfield night sky"
          echo "## Sternenhimmel-Suche" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Suchbegriff: \`$Q\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ⚠ Die Antwort wird AUSGEGEBEN, nicht nur gezaehlt. Erster Lauf
          # bekam 163 Bytes zurueck und meldete nur "Keine Treffer" - die
          # eigentliche Fehlermeldung der API stand im Koerper und wurde
          # verschluckt. Gleiche Lehre wie bei den Nachrichtenquellen.
          hole(){
            curl -sSL --max-time 40 -A "Mozilla/5.0" -w "%{http_code}" -o suche.json "$1" 2>/dev/null || echo 000
          }
          Q_ENC=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$Q")
          for versuch in \
            "https://images-api.nasa.gov/search?q=${Q_ENC}&media_type=image" \
            "https://images-api.nasa.gov/search?q=${Q_ENC}" \
            "https://images-api.nasa.gov/search?keywords=stars&media_type=image" ; do
            CODE=$(hole "$versuch")
            SZ=$(wc -c < suche.json)
            echo "[debug] HTTP $CODE, $SZ Bytes <- $versuch"
            echo "| \`$(echo "$versuch" | cut -c1-70)\` | $CODE | $SZ |" >> $GITHUB_STEP_SUMMARY
            if [ "$CODE" = "200" ] && [ "$SZ" -gt 2000 ]; then break; fi
            # ⚠ Nie nackt lesen - check/rules.js Regel 10. Genau diese
            # Bauform hat ab dem 2026-09-06 fuenf Tage lang alle
            # Sentiment-Quellen gekippt, weil head auf eine fehlende Datei
            # Exit 1 gibt und "bash -e" den Schritt dort beendet. Der
            # Waechter hat diesen Workflow beim Einbau prompt erwischt.
            if [ -s suche.json ]; then
              echo "[debug] Antwortanfang: $(head -c 300 suche.json)"
            else
              echo "[debug] Antwort leer oder Datei fehlt"
            fi
          done
          echo "[debug] genommen: $(wc -c < suche.json) Bytes"
          if [ "$(wc -c < suche.json)" -lt 2000 ]; then
            echo "::error::Die NASA-Bild-API liefert kein brauchbares Ergebnis. Antwort:"
            if [ -s suche.json ]; then head -c 500 suche.json; else echo "(keine Antwort)"; fi
            exit 1
          fi

          node <<'JS'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('suche.json','utf8'));
          const treffer=(j.collection&&j.collection.items)||[];
          if(!treffer.length){console.error('Keine Treffer');process.exit(1);}
          // Nur NASA-eigenes Material: gemeinfrei. Eintraege mit
          // Copyright-Vermerk fliegen raus - lieber kein Bild als ein
          // rechtlich unklares im Repo.
          const ok=treffer.filter(t=>{
            const d=(t.data&&t.data[0])||{};
            if(d.media_type!=='image')return false;
            const txt=((d.description||'')+' '+(d.title||''));
            if(/copyright|©/i.test(txt))return false;
            // ⚠ GEMESSEN 2026-09-12: der Lauf davor waehlte "SPHEREx's
            // Perspective From Orbit (Artist's Concept)" - eine Zeichnung
            // eines Satelliten vor der Erde. Sterndichte allein kann eine
            // Illustration nicht von einem Sternfeld unterscheiden. Die NASA
            // benennt solche Bilder aber zuverlaessig im Titel.
            if(/artist|concept|illustration|rendering|render|animation|diagram|infographic|chart|logo|patch|poster/i.test(txt))return false;
            return !!d.nasa_id;
          });
          console.log('[debug] '+treffer.length+' Treffer, '+ok.length+' davon brauchbar');
          if(!ok.length){console.error('Nichts eindeutig Gemeinfreies dabei');process.exit(1);}
          fs.writeFileSync('kandidaten.json',JSON.stringify(ok.slice(0,8).map(t=>({
            titel:t.data[0].title, nasa_id:t.data[0].nasa_id, zentrum:t.data[0].center||'',
            beschreibung:(t.data[0].description||'').slice(0,300), sammlung:t.href
          })),null,1));
          JS

          # ⚠ Kandidaten werden GEMESSEN, nicht nach Reihenfolge genommen.
          # Grund (2026-09-12): der erste Lauf nahm den ersten Treffer - einen
          # Kugelsternhaufen. Der hat in JEDEM Ausschnitt rund 10000
          # aufloesbare Sterne; der Nutzer-Wunsch "weniger Sterne" war damit
          # gar nicht erfuellbar, egal wie man nachbearbeitet. Gemessen wird
          # die Sterndichte, gewaehlt wird der duennste Himmel im Zielbereich.
          python3 -m pip install --quiet --upgrade pillow
          for i in 0 1 2 3 4 5; do
            SAM=$(node -e "const k=require('./kandidaten.json');if(!k[$i]){process.exit(1);}console.log(k[$i].sammlung)" 2>/dev/null) || break
            curl -sSL --max-time 40 "$SAM" -o assets_$i.json || continue
            B=$(node -e "
              const a=require('./assets_$i.json');
              const k=a.filter(u=>/\.(jpg|jpeg|png)$/i.test(u));
              const o=k.find(u=>/~orig\./i.test(u))||k.find(u=>/~large\./i.test(u))||k[0];
              if(!o)process.exit(1); console.log(o);" 2>/dev/null) || continue
            curl -sSL --max-time 150 "$B" -o kand_$i || continue
            echo "kand_$i|$B" >> kandidaten.txt
          done
          if [ ! -s kandidaten.txt ]; then echo "::error::Kein Kandidat ladbar"; exit 1; fi

          python3 <<'PY2'
          from PIL import Image
          import json, os
          Image.MAX_IMAGE_PIXELS=None
          zeilen=[l.strip().split('|') for l in open('kandidaten.txt') if l.strip()]
          kand=json.load(open('kandidaten.json'))
          ZIEL=1500          # so viele Sterne hat ein normaler Nachthimmel im Bild
          bericht=[]; bestes=None
          for idx,(datei,url) in enumerate(zeilen):
              try: im=Image.open(datei).convert('RGB')
              except Exception as e: bericht.append((datei,'-','-','nicht lesbar')); continue
              b,h=im.size
              if b<1400 or h<800:
                  bericht.append((kand[idx]['titel'][:40],f'{b}x{h}','-','zu klein')); continue
              klein=im.resize((480,270),Image.LANCZOS)
              pr=klein.convert('L'); px=pr.load()
              n=0
              for y in range(1,269):
                  for x in range(1,479):
                      v=px[x,y]
                      if v>70 and v>=px[x-1,y] and v>=px[x+1,y] and v>=px[x,y-1] and v>=px[x,y+1]: n+=1
              dichte=round(n*(1920*1080)/(480*270))

              # ⚠ BUNTANTEIL - das Mass, das die Satelliten-Zeichnung
              # aussortiert haette. Ein Sternenhimmel ist fast schwarzweiss:
              # Punkte auf Schwarz. Eine Illustration (oder ein Nebel, oder
              # die Erde im Bild) hat grosse, kraeftig farbige FLAECHEN.
              # Gemessen wird der Anteil heller Pixel mit deutlicher
              # Farbsaettigung; ueber ein paar Prozent ist es kein Himmel.
              q=klein.load(); bunt=0; hell=0
              for y in range(0,270,2):
                  for x in range(0,480,2):
                      r,g,bl=q[x,y]
                      mx,mn=max(r,g,bl),min(r,g,bl)
                      if mx>60:
                          hell+=1
                          if mx-mn>40: bunt+=1
              buntanteil=round(100*bunt/max(1,(240*135)),1)
              bericht.append((kand[idx]['titel'][:38],f'{b}x{h}',dichte,f'{buntanteil}% bunt'))
              if dichte<200: continue            # ein schwarzes Bild ist auch kein Himmel
              if buntanteil>3.0: continue        # farbige Flaechen -> Illustration/Nebel/Planet
              abstand=abs(dichte-ZIEL)
              if bestes is None or abstand<bestes[0]: bestes=(abstand,datei,url,idx,dichte)
          if bestes is None:
              raise SystemExit('Kein Kandidat war ein echtes Sternfeld - alle zu bunt, zu leer oder zu dicht. Suchbegriff anpassen.')
          _,datei,url,idx,dichte=bestes
          os.replace(datei,'roh_bild')
          w=dict(kand[idx]); w['gemessene_dichte']=dichte
          json.dump(w,open('wahl.json','w'),indent=1,ensure_ascii=False)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n### Gemessene Kandidaten\n\n| Titel | Masse | Sterne je Bild | |\n|---|---|---|---|\n')
              for t,m,d,note in bericht: f.write(f'| {t} | {m} | {d} | {note} |\n')
              f.write(f'\nGewaehlt: **{w["titel"]}** ({dichte} Sterne, Ziel {ZIEL})\n')
          print(f'[debug] gewaehlt: {w["titel"]} mit {dichte} Sternen')
          open('bild_url.txt','w').write(url)
          PY2
          echo "bild=$(cat bild_url.txt)" >> $GITHUB_OUTPUT

      - name: Auf Webgroesse bringen
        run: |
          python3 -m pip install --quiet --upgrade pillow
          python3 <<'PY'
          from PIL import Image, ImageEnhance
          import json, os

          Image.MAX_IMAGE_PIXELS = None
          im = Image.open('roh_bild').convert('RGB')
          print('[debug] Original:', im.size)
          b, h = im.size

          # ⚠ NACHGESCHAERFT 2026-09-12, Nutzer: "der Himmel mit weniger
          # Sternen und schaerfer". Die erste Fassung hat das Bild von 2506
          # auf 1080 Pixel Hoehe HERUNTERGERECHNET - dabei verschmieren
          # Sterne zwangslaeufig zu Flecken, sie sind ja nur wenige Pixel
          # gross. Und ein Kugelsternhaufen ist per Definition dicht.
          #
          # Beides loest derselbe Griff: einen 1920x1080-Ausschnitt in der
          # ORIGINALAUFLOESUNG nehmen, gar nicht skalieren. Kein Resampling
          # heisst maximale Schaerfe, und ein Ausschnitt vom Rand statt der
          # ganzen Flaeche zeigt weniger, dafuer einzeln stehende Sterne.
          ZB, ZH = 1920, 1080
          if b >= ZB and h >= ZH:
              # Vom Rand, nicht aus der Mitte: dort sitzt der dichte Kern.
              links = 0
              oben = max(0, h - ZH - round(h * 0.04))
              im = im.crop((links, oben, links + ZB, oben + ZH))
              skaliert = False
          else:
              im = im.resize((ZB, ZH), Image.LANCZOS)
              skaliert = True

          # ── Schwaechste Sterne wegnehmen ────────────────────────────────
          # "Weniger Sterne" heisst nicht kleiner rechnen, sondern das
          # Grundrauschen abschneiden: alles unter SCHWELLE wird zu
          # Nachthimmel, der Rest behaelt seine Helligkeit und steht dadurch
          # klarer. Eine reine Abdunklung wuerde die schwachen Sterne nur
          # dunkler machen, nicht entfernen - sie blieben als Schleier.
          SCHWELLE = 42      # von 255; gemessen am Hubble-Haufen
          lut = [0 if i < SCHWELLE else min(255, round((i - SCHWELLE) * 255 / (255 - SCHWELLE))) for i in range(256)]
          im = im.point(lut * 3)
          # Danach leicht abdunkeln: die verbliebenen Sterne sollen Sterne
          # bleiben, der Hintergrund aber zuruecktreten.
          im = ImageEnhance.Brightness(im).enhance(0.72)

          os.makedirs('img', exist_ok=True)
          im.save('img/starfield-foto.webp', 'WEBP', quality=80, method=6)
          im.resize((240, 135), Image.LANCZOS).save('img/starfield-foto-tile.webp', 'WEBP', quality=78, method=6)

          # Sterne zaehlen, damit "weniger" eine Zahl ist und keine Behauptung:
          # lokale Maxima ueber einem Schwellwert.
          g = im.convert('L')
          px = g.load()
          n = 0
          for y in range(2, ZH - 2, 2):
              for x in range(2, ZB - 2, 2):
                  v = px[x, y]
                  if v > 90 and v >= px[x-2, y] and v >= px[x+2, y] and v >= px[x, y-2] and v >= px[x, y+2]:
                      n += 1
          print('[debug] sichtbare Sterne (Stichprobe):', n)

          w = json.load(open('wahl.json'))
          w['quelle'] = os.environ.get('BILD_URL', '')
          w['masse'] = list(im.size)
          w['bytes'] = os.path.getsize('img/starfield-foto.webp')
          w['sterne'] = n
          w['bearbeitung'] = (f'1920x1080 {"Ausschnitt in Originalaufloesung (kein Resampling)" if not skaliert else "skaliert"}, '
                              f'Schwellwert {SCHWELLE}/255 schneidet schwache Sterne weg, Helligkeit 72 Prozent, WebP q80')
          w['lizenz'] = 'NASA-Bildmaterial, gemeinfrei (NASA Media Usage Guidelines)'
          json.dump(w, open('img/starfield-foto-herkunft.json', 'w'), indent=1, ensure_ascii=False)
          print('[debug] geschrieben:', im.size, round(w['bytes']/1024), 'KB,', n, 'Sterne')
          PY
        env:
          BILD_URL: ${{ steps.suche.outputs.bild }}

      - name: Bericht und Commit
        run: |
          {
            echo ""
            echo "### Ausgewaehlt"
            echo ""
            node -e "
              const w=require('./img/starfield-foto-herkunft.json');
              console.log('- **Titel:** '+w.titel);
              console.log('- **nasa_id:** '+w.nasa_id+'  ');
              console.log('- **Zentrum:** '+(w.zentrum||'-'));
              console.log('- **Quelle:** '+w.quelle);
              console.log('- **Masse:** '+w.masse.join(' x ')+' px, '+Math.round(w.bytes/1024)+' KB');
              console.log('- **Lizenz:** '+w.lizenz);
            "
          } >> $GITHUB_STEP_SUMMARY
          # Arbeitsmaterial, kein Ergebnis - raus damit (check/rules.js Regel 4).
          rm -f roh_bild suche.json assets.json assets_*.json wahl.json kandidaten.md kandidaten.json kandidaten.txt kand_* bild_url.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/starfield-foto.webp img/starfield-foto-tile.webp img/starfield-foto-herkunft.json
          if ! git diff --staged --quiet; then
            git commit -m "Sternenhimmel fuer die Overview-Seite (NASA, gemeinfrei)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || true
              sleep 3
            done
          else
            echo "nichts geaendert"
          fi
