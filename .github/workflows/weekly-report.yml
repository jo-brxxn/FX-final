name: Weekly Outlook (Telegram)

on:
  schedule:
    # Sonntag ab 08:00 Berlin-Zeit, ganzjaehrig. GitHub-Cron kennt nur UTC,
    # daher zwei Eintraege (Sommer-/Winterzeit) + Gate-Schritt. Minute
    # bewusst nicht :00 (dort ist GitHubs Cron-Queue am vollsten und
    # Laeufe starten Stunden verspaetet - beobachtet 2026-07-05).
    - cron: '17 6 * * 0'  # 08:17 MESZ (Sommerzeit, UTC+2)
    - cron: '17 7 * * 0'  # 08:17 MEZ (Winterzeit, UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wie beim Morning Report: GitHub-Cron laeuft teils Stunden verspaetet
      # (2026-07-05: Start 11:48/12:04 UTC statt 6/7 UTC), das fruehere
      # "exakt 08 Uhr"-Gate hat diese Laeufe verworfen -> kein Weekly
      # Outlook an dem Sonntag. Neues Gate: senden ab 08 Uhr Berlin am
      # Sonntag (ganztags - der Wochenausblick ist auch nachmittags noch
      # nuetzlich), Dedup ueber committeten Versand-Marker.
      - name: Gate - Sonntag ab 08 Uhr Berlin und diese Woche noch nicht verschickt
        id: gate
        run: |
          DATE="$(TZ="Europe/Berlin" date +%F)"
          HOUR="$(TZ="Europe/Berlin" date +%H)"
          DOW="$(TZ="Europe/Berlin" date +%u)"
          LAST="$(cat .report-state/weekly_last.txt 2>/dev/null || true)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Berlin-Zeit: $DATE ${HOUR}:xx Uhr (Wochentag $DOW), letzter Versand: ${LAST:-nie}"
          if [ "$LAST" = "$DATE" ]; then
            echo "Heute bereits verschickt - ueberspringen."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && { [ "$DOW" != "7" ] || [ "$HOUR" -lt 8 ]; }; then
            echo "Noch nicht Sonntag 08 Uhr Berlin - ueberspringen."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wochenausblick zusammenstellen (Events + COT + Scores)
        if: steps.gate.outputs.proceed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SYNC_ID: ${{ secrets.SUPABASE_SYNC_ID }}
        run: |
          cat > build-weekly.js <<'EOF'
          const fs = require("fs");
          const tz = "Europe/Berlin";
          const now = new Date();
          const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").trim();
          const clean = s => String(s || "").trim();
          const dayKey = d => new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
          const fmtTime = iso => new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
          const fmtDay = d => new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long" }).format(d);
          const weekHdr = new Intl.DateTimeFormat("en-GB", { timeZone: tz, day: "numeric", month: "long", year: "numeric" }).format(now);

          async function main() {
            const lines = ["🗓 <b>Weekly Outlook — week of " + esc(weekHdr) + "</b>", ""];
            const speech = ["Good morning. Here is your weekly outlook."];

            // ── 1. High-Impact-Events der naechsten 7 Tage ──
            const cal = JSON.parse(fs.readFileSync("ff_calendar.json", "utf8"));
            const todayK = dayKey(now);
            const endK = dayKey(new Date(now.getTime() + 7 * 86400000));
            const week = cal
              .filter(e => e.impact === "High")
              .filter(e => { const k = dayKey(new Date(e.date)); return k >= todayK && k <= endK; })
              .sort((a, b) => new Date(a.date) - new Date(b.date));
            lines.push("🔴 <b>High-impact events this week</b>");
            if (week.length) {
              let curDay = "";
              for (const e of week) {
                const dk = fmtDay(new Date(e.date));
                if (dk !== curDay) { curDay = dk; lines.push("", "<b>" + esc(dk) + "</b>"); }
                const fc = esc(e.forecast) ? " (exp. " + esc(e.forecast) + ")" : "";
                lines.push("⏳ " + fmtTime(e.date) + " · " + esc(e.country) + " — " + esc(e.title) + fc);
              }
              speech.push("There " + (week.length === 1 ? "is one high impact event" : "are " + week.length + " high impact events") + " scheduled this week.");
              const byCcy = {};
              week.forEach(e => { byCcy[e.country] = (byCcy[e.country] || 0) + 1; });
              speech.push("Busiest currencies: " + Object.entries(byCcy).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, n]) => c + " with " + n).join(", ") + ".");
            } else {
              lines.push("No high-impact events found for the coming week.");
              speech.push("No high impact events are scheduled this week.");
            }

            // ── 2. COT-Zusammenfassung ──
            try {
              const cot = JSON.parse(fs.readFileSync("cot_data.json", "utf8"));
              const rows = Object.entries(cot.symbols || {}).map(([id, s]) => {
                const L = +s.long || 0, S = +s.short || 0, tot = L + S;
                return tot > 0 ? { id, longPct: L / tot * 100 } : null;
              }).filter(Boolean).sort((a, b) => b.longPct - a.longPct);
              if (rows.length) {
                lines.push("", "📊 <b>COT positioning</b> (report " + esc(cot.report_date || "–") + ")");
                const fmtRow = r => r.id + " " + r.longPct.toFixed(0) + "% long" + (r.longPct >= 80 || r.longPct <= 20 ? " ⚠ crowded" : "");
                lines.push("Most long: " + rows.slice(0, 3).map(fmtRow).join(" · "));
                lines.push("Most short: " + rows.slice(-3).reverse().map(fmtRow).join(" · "));
                const crowded = rows.filter(r => r.longPct >= 80 || r.longPct <= 20);
                if (crowded.length) speech.push("Watch out: " + crowded.map(r => r.id).join(", ") + " " + (crowded.length === 1 ? "is" : "are") + " extremely one-sided in the COT report.");
              }
            } catch (e) { console.log("COT section skipped: " + e.message); }

            // ── 3. Aktuelle Scores aus dem Cloud-Schnappschuss ──
            const { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SYNC_ID } = process.env;
            if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_SYNC_ID) {
              try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/fx_sync?id=eq.${encodeURIComponent(SUPABASE_SYNC_ID)}&select=data`, {
                  headers: { apikey: SUPABASE_ANON_KEY },
                });
                const rows = res.ok ? await res.json() : [];
                const snap = rows[0] && rows[0].data && rows[0].data.scoreSnapshot;
                if (Array.isArray(snap) && snap.length) {
                  const sorted = [...snap].sort((a, b) => b.score - a.score);
                  const fmtS = s => s.id + " " + (s.score > 0 ? "+" : "") + s.score;
                  lines.push("", "🧭 <b>Current fundamental scores</b>");
                  lines.push(sorted.map(fmtS).join(" · "));
                  const top = sorted[0], bottom = sorted[sorted.length - 1];
                  speech.push("Strongest asset by score: " + top.id + " at " + (top.score > 0 ? "plus " : "") + top.score + ". Weakest: " + bottom.id + " at " + bottom.score + ".");
                }
              } catch (e) { console.log("Score section skipped: " + e.message); }
            }

            fs.writeFileSync("weekly-report.txt", lines.join("\n"));
            fs.writeFileSync("weekly-report-speech.txt", speech.join(" "));
            console.log(lines.join("\n"));
            console.log("---SPEECH---");
            console.log(speech.join(" "));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF
          node build-weekly.js

      - name: edge-tts und ffmpeg installieren (kostenlose Neural-TTS)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts

      - name: Sprachnachricht erzeugen
        if: steps.gate.outputs.proceed == 'true'
        run: |
          edge-tts --voice en-US-GuyNeural --file weekly-report-speech.txt --write-media weekly-report.mp3
          ffmpeg -y -i weekly-report.mp3 -c:a libopus -b:a 32k -ar 48000 -ac 1 weekly-report.ogg

      - name: Per Telegram senden (Text + Sprachnachricht)
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM-Secrets nicht gesetzt - Versand uebersprungen."
            exit 0
          fi
          TEXT="$(cat weekly-report.txt)"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "voice=@weekly-report.ogg"

      # Versand-Marker committen (Dedup fuer den zweiten Cron-Eintrag und
      # Nachzuegler-Laeufe desselben Sonntags).
      - name: Versand-Marker committen
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p .report-state
          echo "${{ steps.gate.outputs.date }}" > .report-state/weekly_last.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .report-state/weekly_last.txt
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Weekly outlook sent ${{ steps.gate.outputs.date }}"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase origin main
          done

# Nutzt dieselben Secrets wie morning-report.yml (TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID) und event-alerts.yml (SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SYNC_ID) - keine weitere Einrichtung noetig. Der Score-Abschnitt
# erscheint erst, sobald die App einmal mit der neuen Version gepusht hat
# (scoreSnapshot-Feld im Cloud-Stand).
