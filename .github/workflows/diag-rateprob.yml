# TEMPORAERER Diagnose-Workflow (Nutzer-Wunsch 2026-07-25). Runde 3: pruefen,
# ob die per Symbol-Suche gefundenen 1-Monats-/meeting-datierten Overnight-
# Futures fuer CAD/GBP/EUR tatsaechlich LIVE-PREISE liefern (nicht nur als
# Symbol existieren). AUD (ASX24:IB) ist bereits mit Preisen bestaetigt.
# Wird nach Auswertung wieder geloescht.
name: diag-rateprob
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Price-probe confirmed 1M / meeting-dated overnight futures
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          node -e '
            const fs=require("fs");
            const CODE=["F","G","H","J","K","M","N","Q","U","V","X","Z"];
            const today=new Date();
            // Bestaetigte 1-Monats-Roots (aus symbol_search Runde 2)
            const roots=["ASX24:IB","TMX:COA","ICEEUR:SOA","ICEEUR:EON","CME:ESR"];
            const tickers=[];
            roots.forEach(r=>{for(let i=0;i<8;i++){const d=new Date(today.getFullYear(),today.getMonth()+i,1);tickers.push(r+CODE[d.getMonth()]+d.getFullYear());}});
            // Kontinuierliche + meeting-datierte Kontrakte (nicht-standardisierte
            // Codes -> ueber 1!/2!/3! anfahren, um zu sehen ob Preise da sind).
            ["TMX:COA1!","ICEEUR:SOA1!","ICEEUR:EON1!","CME:ESR1!",
             "ICEEUR:MPC1!","ICEEUR:MPC2!","ICEEUR:MPC3!",
             "ICEEUR:EMP1!","ICEEUR:EMP2!","ICEEUR:EMP3!"].forEach(t=>tickers.push(t));
            fs.writeFileSync("probe_tickers.json",JSON.stringify(tickers));
            console.log("probing "+tickers.length+" tickers");
          '
          TICKERS=$(cat probe_tickers.json)
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data "{\"symbols\":{\"tickers\":${TICKERS},\"query\":{\"types\":[]}},\"columns\":[\"close\",\"expiration\"]}" \
            -w "[debug] scanner curl: http=%{http_code} size=%{size_download}\n" \
            "https://scanner.tradingview.com/global/scan" -o probe_tv.json
          echo "=== ALL returned symbols (OK=has price, NULL=exists but no close) ==="
          node -e '
            const fs=require("fs");
            let d;try{d=JSON.parse(fs.readFileSync("probe_tv.json","utf8"));}catch(e){console.log("unparseable");process.exit(0);}
            const rows=(d&&d.data)||[];
            if(!rows.length){console.log("NONE - data[] empty");process.exit(0);}
            rows.forEach(r=>{const c=r.d?r.d[0]:null;console.log((c!=null?"  OK  ":" NULL ")+r.s+"  close="+c+(r.d&&r.d[1]?"  exp="+r.d[1]:""));});
            console.log("--- totalCount="+d.totalCount+", returned="+rows.length);
          '
          echo "############ DONE ############"
