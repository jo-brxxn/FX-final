name: Probe FXStreet Calendar API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe USD events (today + yesterday)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          START="2026-06-10T00:00:00.000Z"
          END="2026-06-12T00:00:00.000Z"
          curl -sL -A "$UA" -H "Referer: https://www.fxstreet.com/economic-calendar" \
            "https://calendar-api.fxstreet.com/en/api/v1/eventDates/${START}/${END}?volatilities=NONE,LOW,MEDIUM,HIGH&countries=&categories=" -o resp.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("resp.json","utf8"));
            console.log("total events:", d.length);
            const us = d.filter(e=>e.currencyCode==="USD");
            us.forEach(e=>console.log(JSON.stringify({name:e.name,dateUtc:e.dateUtc,actual:e.actual,consensus:e.consensus,previous:e.previous,unit:e.unit,potency:e.potency,volatility:e.volatility})));
          '
