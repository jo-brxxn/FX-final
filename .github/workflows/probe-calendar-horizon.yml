# Reicht der TradingView-Wirtschaftskalender 3 Monate in die Zukunft, und wie
# gross wird die Datei? Nutzer 2026-10-06: "ich will das immer der Kalender
# schon fuer die kommenden 3 Monate geladen wird" (per Rueckfrage: High/Medium
# + jeder Termin eines Score-Indikators). update-ff-calendar.yml holt heute
# nur heute-3d .. heute+11d. Aus der Sandbox ist TradingView gesperrt
# (Proxy 403), deshalb wird hier auf dem Runner gemessen.
# Schreibt NICHTS in die Daten.
name: Probe calendar horizon (TradingView 3 months)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch TradingView calendar in 30-day slices up to +92 days
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          for i in 0 1 2 3; do
            FROM=$(node -e "console.log(new Date(Date.now()+($i*30-3)*86400e3).toISOString())")
            TO=$(node -e "console.log(new Date(Date.now()+Math.min(($i+1)*30,93)*86400e3).toISOString())")
            curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" --max-time 40 \
              "https://economic-calendar.tradingview.com/events?from=${FROM}&to=${TO}&countries=US,EU,DE,FR,IT,ES,GB,JP,CA,AU,NZ,CH,CN" \
              -o "tv_$i.json" -w "slice $i: HTTP %{http_code}, %{size_download} bytes\n" || true
          done
      - name: Evaluate
        run: |
          node -e '
            const fs=require("fs");
            let all=[];
            for(let i=0;i<4;i++){
              let d=null;try{d=JSON.parse(fs.readFileSync("tv_"+i+".json","utf8"));}catch(e){console.log("slice "+i+": no JSON");continue;}
              const ev=Array.isArray(d)?d:(d&&Array.isArray(d.result)?d.result:[]);
              console.log("slice "+i+": "+ev.length+" events"+(d&&d.status?" status="+d.status:""));
              all=all.concat(ev);
            }
            const seen=new Set();all=all.filter(e=>{const k=e.id||(e.country+"|"+e.title+"|"+e.date);if(seen.has(k))return false;seen.add(k);return true;});
            if(!all.length){console.log("NO EVENTS");process.exit(0);}
            console.log("sample keys: "+Object.keys(all[0]).join(","));
            const t=all.map(e=>e.date).sort();
            console.log("total "+all.length+" unique events, "+t[0]+" .. "+t[t.length-1]);
            const by=(f)=>{const m={};all.forEach(e=>{const k=f(e);m[k]=(m[k]||0)+1;});return JSON.stringify(m);};
            console.log("by importance: "+by(e=>e.importance));
            console.log("by country: "+by(e=>e.country));
            const now=Date.now();
            console.log("by month ahead (High/Medium): "+by(e=>(e.importance>=0)?Math.floor((new Date(e.date)-now)/(30*86400e3)):"low"));
            const kb=a=>(JSON.stringify(a.map(e=>({title:e.title,country:e.country,date:e.date,importance:e.importance,forecast:e.forecast,previous:e.previous,actual:e.actual}))).length/1024).toFixed(0);
            console.log("size all ~"+kb(all)+" KB, high+medium ~"+kb(all.filter(e=>e.importance>=0))+" KB");
            const far=all.filter(e=>new Date(e.date)-now>60*86400e3);
            console.log("events 60-92 days ahead: "+far.length+", with forecast: "+far.filter(e=>e.forecast!=null).length);
            // Distinkte Titel je Land (fuer die Zuordnung zu den Score-Indikatoren der App)
            const ti={};all.forEach(e=>{const k=e.country+" | "+e.title;const x=ti[k]||(ti[k]={n:0,imp:e.importance,first:e.date});x.n++;if(e.date<x.first)x.first=e.date;x.imp=Math.max(x.imp,e.importance);});
            console.log("=== TITLES (country | title | max importance | count | first date) ===");
            Object.keys(ti).sort().forEach(k=>console.log("T "+k+" | "+ti[k].imp+" | "+ti[k].n+" | "+String(ti[k].first).slice(0,10)));
          '
