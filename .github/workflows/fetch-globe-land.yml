# Holt echte Kuestenlinien fuer die Weltkugel.
#
# Anlass (Nutzer 2026-09-12): "die Weltkugel auch mit deutlich mehr Details
# aus dem Internet".
#
# ⚠ Ausgangslage, gemessen: die eingebaute GLOBE_LAND in js/globe.js hat rund
# 2170 Koordinatenpaare fuer die GANZE Welt - grob genug, dass Inseln fehlen
# und Kuesten als Geradenzuege erscheinen.
#
# ⚠ WARUM NATURAL EARTH: gemeinfrei ohne jede Einschraenkung ("no rights
# reserved"), der De-facto-Standard fuer Kartenumrisse. Damit ist die
# Lizenzfrage so eindeutig wie bei den NASA-Bildern - und das ist bei
# etwas, das dauerhaft im Repo liegt, die halbe Entscheidung.
#
# ⚠ WARUM NICHT EINFACH DIE HOECHSTE AUFLOESUNG: die Kugel zeichnet jeden
# Punkt in JEDEM Bild neu. 50m-Land hat roh ueber 80000 Punkte; das waere
# genau die Verschlechterung, die der Nutzer mit "Performance muss besser
# werden" beheben lassen wollte. Deshalb wird auf ein Punktbudget
# vereinfacht (Douglas-Peucker) und die Zahl im Ergebnis ausgewiesen.
name: Fetch globe coastlines

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Punktbudget fuer die ganze Welt"
        required: false
        default: "14000"
      min_flaeche:
        description: "kleinste Insel in Quadratgrad (kleinere fallen weg)"
        required: false
        default: "0.05"

jobs:
  holen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Natural Earth holen
        run: |
          set -e
          U="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_land.geojson"
          CODE=$(curl -sSL --max-time 120 -w "%{http_code}" -o land_roh.json "$U" || echo 000)
          SZ=$(wc -c < land_roh.json 2>/dev/null || echo 0)
          echo "[debug] HTTP $CODE, $SZ Bytes <- $U"
          {
            echo "## Kuestenlinien"
            echo ""
            echo "| Quelle | HTTP | Bytes |"
            echo "|---|---|---|"
            echo "| ne_50m_land.geojson | $CODE | $SZ |"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$CODE" != "200" ] || [ "$SZ" -lt 100000 ]; then
            echo "::error::Natural Earth nicht erreichbar oder Antwort zu klein."
            if [ -s land_roh.json ]; then head -c 400 land_roh.json; else echo "(keine Antwort)"; fi
            exit 1
          fi

      - name: Vereinfachen und ins App-Format bringen
        run: |
          python3 <<'PY'
          import json, math, os

          BUDGET = int("${{ github.event.inputs.budget }}" or "14000")
          MIN_A  = float("${{ github.event.inputs.min_flaeche }}" or "0.05")

          roh = json.load(open('land_roh.json'))

          # ── GeoJSON -> Ringe in [lat, lon] ───────────────────────────────
          # Die App erwartet [lat, lon]; GeoJSON liefert [lon, lat]. Genau
          # solche Vertauschungen fallen erst am fertigen Bild auf, wenn die
          # Kontinente quer liegen - deshalb hier einmal zentral gedreht.
          ringe = []
          for f in roh.get('features', []):
              g = f.get('geometry') or {}
              t, c = g.get('type'), g.get('coordinates') or []
              teile = [c] if t == 'Polygon' else (c if t == 'MultiPolygon' else [])
              for poly in teile:
                  if not poly: continue
                  aussen = poly[0]                 # nur der Aussenring, keine Loecher
                  if len(aussen) < 4: continue
                  ringe.append([[p[1], p[0]] for p in aussen])

          def flaeche(r):
              """Betrag der Polygonflaeche in Quadratgrad - nur zum Sortieren
              und Aussieben, keine echte Erdoberflaeche."""
              s = 0.0
              for i in range(len(r)):
                  a, b = r[i], r[(i + 1) % len(r)]
                  s += a[1] * b[0] - b[1] * a[0]
              return abs(s) / 2.0

          def dp(punkte, eps):
              """Douglas-Peucker, iterativ (rekursiv lief bei 80k Punkten in
              Pythons Rekursionsgrenze)."""
              if len(punkte) < 3: return punkte[:]
              behalten = [False] * len(punkte)
              behalten[0] = behalten[-1] = True
              stapel = [(0, len(punkte) - 1)]
              while stapel:
                  a, b = stapel.pop()
                  if b <= a + 1: continue
                  x1, y1 = punkte[a][1], punkte[a][0]
                  x2, y2 = punkte[b][1], punkte[b][0]
                  dx, dy = x2 - x1, y2 - y1
                  n2 = dx * dx + dy * dy
                  weit, wi = -1.0, -1
                  for i in range(a + 1, b):
                      x0, y0 = punkte[i][1], punkte[i][0]
                      if n2 == 0:
                          d = math.hypot(x0 - x1, y0 - y1)
                      else:
                          d = abs(dy * x0 - dx * y0 + x2 * y1 - y2 * x1) / math.sqrt(n2)
                      if d > weit: weit, wi = d, i
                  if weit > eps:
                      behalten[wi] = True
                      stapel.append((a, wi)); stapel.append((wi, b))
              return [p for p, k in zip(punkte, behalten) if k]

          ringe = [r for r in ringe if flaeche(r) >= MIN_A]
          ringe.sort(key=flaeche, reverse=True)
          roh_punkte = sum(len(r) for r in ringe)

          # Epsilon einregeln, bis das Budget passt. Binaere Suche statt
          # Raten: die Punktzahl faellt sehr ungleichmaessig mit Epsilon.
          lo, hi = 0.0, 3.0
          bestes = None
          for _ in range(24):
              eps = (lo + hi) / 2
              v = [dp(r, eps) for r in ringe]
              v = [r for r in v if len(r) >= 4]
              n = sum(len(r) for r in v)
              if n > BUDGET: lo = eps
              else: hi = eps; bestes = (eps, v, n)
          if bestes is None:
              raise SystemExit('Budget selbst bei starker Vereinfachung nicht erreichbar')
          eps, verein, n = bestes

          verein = [[[round(p[0], 3), round(p[1], 3)] for p in r] for r in verein]
          aus = {
            'quelle': 'Natural Earth (ne_50m_land) via nvkelso/natural-earth-vector',
            'lizenz': 'public domain, no rights reserved',
            'aufbereitung': f'Aussenringe, Inseln ab {MIN_A} Quadratgrad, Douglas-Peucker eps={eps:.4f}',
            'polygone': len(verein),
            'punkte': n,
            'punkte_roh': roh_punkte,
            'ringe': verein,
          }
          os.makedirs('.', exist_ok=True)
          json.dump(aus, open('globe_land.json', 'w'), separators=(',', ':'))
          kb = os.path.getsize('globe_land.json') / 1024
          print(f'[debug] {len(verein)} Polygone, {n} Punkte (roh {roh_punkte}), eps={eps:.4f}, {kb:.0f} KB')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n### Ergebnis\n\n')
              f.write(f'- Polygone: **{len(verein)}**\n')
              f.write(f'- Punkte: **{n}** (roh {roh_punkte}, Budget {BUDGET})\n')
              f.write(f'- Douglas-Peucker eps: {eps:.4f}\n')
              f.write(f'- Dateigroesse: {kb:.0f} KB\n')
              f.write('- Lizenz: public domain (Natural Earth)\n')
          PY

      - name: Commit
        run: |
          rm -f land_roh.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add globe_land.json
          if ! git diff --staged --quiet; then
            git commit -m "Kuestenlinien fuer die Weltkugel (Natural Earth, gemeinfrei)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || true
              sleep 3
            done
          else
            echo "nichts geaendert"
          fi
