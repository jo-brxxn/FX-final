name: Morning Report (Telegram)

on:
  schedule:
    # Ziel: Versand um 07:00 Berlin (Toleranz +30 Minuten, Nutzervorgabe).
    # GitHubs Cron ist fuer dieses Repo NICHT puenktlich - beobachtet
    # 2026-07-03..06: Laeufe starten systematisch ~6 Stunden verspaetet
    # (11-12 UTC statt 5/6 UTC). Strategie daher: VIELE Ausloese-Punkte
    # ueber die Nacht verteilt (Minute bewusst nie :00 - dort ist GitHubs
    # Cron-Queue am vollsten); jeder Lauf, der VOR 07:00 Berlin startet,
    # schlaeft bis exakt 07:00 (+ kleiner Slot-Versatz gegen Doppelversand)
    # und sendet dann; Laeufe, die zwischen 07:00 und 07:30 starten, senden
    # sofort; spaetere werden verworfen. So reicht EIN Slot, der irgendwo
    # in den ~6 Stunden vor 7 Uhr tatsaechlich startet, fuer puenktlichen
    # Versand - egal ob Sommer- oder Winterzeit (das Ziel ist in
    # Berlin-Zeit berechnet, nicht pro Cron-Eintrag).
    - cron: '23 23 * * *'
    - cron: '53 0 * * *'
    - cron: '23 2 * * *'
    - cron: '23 3 * * *'
    - cron: '53 4 * * *'
    - cron: '7 5 * * *'
    - cron: '37 5 * * *'
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Gate mit Schlaf-bis-07:00-Mechanik (Details siehe Kommentar oben am
      # schedule-Block). Dedup ueber den Versand-Marker
      # .report-state/morning_last.txt: VOR dem Senden (und nach dem
      # Aufwachen nochmal frisch von origin) geprueft, NACH dem Senden
      # committet. Der Slot-Versatz (90s je Cron-Eintrag) staffelt die
      # Aufwachzeiten, damit zwei parallel schlafende Laeufe nicht
      # gleichzeitig senden - der spaetere sieht beim Aufwachen den Marker
      # des frueheren. workflow_dispatch sendet immer sofort (manueller
      # Test/Nachlieferung), sofern heute noch nicht gesendet wurde.
      - name: Gate - bis 07:00 Berlin schlafen, Fenster 07:00-07:30, Dedup
        id: gate
        run: |
          DATE="$(TZ="Europe/Berlin" date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          LAST="$(cat .report-state/morning_last.txt 2>/dev/null || true)"
          if [ "$LAST" = "$DATE" ]; then
            echo "Heute bereits verschickt - ueberspringen."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manueller Lauf - sofort senden."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "${{ github.event.schedule }}" in
            '23 23 * * *') OFF=0;;
            '53 0 * * *')  OFF=90;;
            '23 2 * * *')  OFF=180;;
            '23 3 * * *')  OFF=270;;
            '53 4 * * *')  OFF=360;;
            '7 5 * * *')   OFF=450;;
            '37 5 * * *')  OFF=540;;
            '7 6 * * *')   OFF=630;;
            *)             OFF=0;;
          esac
          NOW="$(date +%s)"
          TARGET="$(( $(TZ="Europe/Berlin" date -d "$DATE 07:00:00" +%s) + OFF ))"
          WAIT="$((TARGET-NOW))"
          echo "Slot '${{ github.event.schedule }}' (+${OFF}s), Berlin jetzt: $(TZ="Europe/Berlin" date '+%F %T'), bis Ziel: ${WAIT}s"
          if [ "$WAIT" -gt 19800 ]; then
            echo "Mehr als 5,5h bis 07:00 Berlin - dieser Slot ueberlaesst es einem spaeteren."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$WAIT" -lt -1800 ]; then
            echo "Nach 07:30 Berlin gestartet - Fenster verpasst, kein verspaeteter Versand (Nutzervorgabe: max. +30 Min)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$WAIT" -gt 0 ]; then
            echo "Schlafe ${WAIT}s bis 07:00 Berlin (+${OFF}s Slot-Versatz)..."
            sleep "$WAIT"
            # Nach dem Aufwachen frisch von origin pruefen, ob ein anderer
            # Slot inzwischen gesendet hat.
            git fetch --quiet origin main || true
            LAST2="$(git show origin/main:.report-state/morning_last.txt 2>/dev/null || true)"
            if [ "$LAST2" = "$DATE" ]; then
              echo "Anderer Slot hat inzwischen gesendet - ueberspringen."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Frischesten Kalenderstand uebernehmen (der Checkout ist nach
            # stundenlangem Schlafen veraltet; der Daten-Workflow pusht
            # stuendlich neue ff_calendar.json-Staende).
            git merge --ff-only origin/main || true
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Morning report aus ff_calendar.json zusammenstellen (Text + Sprach-Skript)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const cal = JSON.parse(fs.readFileSync("ff_calendar.json", "utf8"));
            const tz = "Europe/Berlin";
            const now = new Date();
            const dayKey = d => new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
            const todayKey = dayKey(now);
            const fmtTime = iso => new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
            const dateHdr = new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
            const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").trim();
            const clean = s => String(s || "").trim();

            const todays = cal
              .filter(e => (e.impact === "High" || e.impact === "Medium") && dayKey(new Date(e.date)) === todayKey)
              .sort((a, b) => new Date(a.date) - new Date(b.date));
            const high = todays.filter(e => e.impact === "High");
            const med = todays.filter(e => e.impact === "Medium");

            // ── Text-Nachricht (HTML fuer Telegram sendMessage) ──
            const evLineHtml = e => {
              const marker = new Date(e.date) < now ? "✅" : "⏳";
              const fc = esc(e.forecast), prev = esc(e.previous);
              const parts = [];
              if (fc) parts.push("exp. " + fc);
              if (prev) parts.push("prev. " + prev);
              const vals = parts.length ? " (" + parts.join(", ") + ")" : "";
              return marker + " " + fmtTime(e.date) + " · " + esc(e.country) + " — " + esc(e.title) + vals;
            };
            const lines = ["☀️ <b>Morning Report — " + esc(dateHdr) + "</b>", ""];
            if (high.length) {
              lines.push("🔴 <b>High Impact</b>");
              high.forEach(e => lines.push(evLineHtml(e)));
              lines.push("");
            }
            if (med.length) {
              lines.push("🟠 <b>Medium Impact</b>");
              med.forEach(e => lines.push(evLineHtml(e)));
              lines.push("");
            }
            if (!todays.length) lines.push("No High/Medium impact events today.");
            lines.push("Total today: " + high.length + " High, " + med.length + " Medium impact.");
            fs.writeFileSync("morning-report.txt", lines.join("\n"));

            // ── Sprach-Skript (Klartext ohne HTML/Emoji, fuer TTS) ──
            const evLineSpeech = e => {
              const parts = [clean(e.country) + " " + clean(e.title)];
              const fc = clean(e.forecast), prev = clean(e.previous);
              if (fc) parts.push("expected " + fc);
              if (prev) parts.push("previous " + prev);
              return parts.join(", ");
            };
            const speech = ["Good morning. Here is your market report for " + dateHdr + "."];
            if (high.length) {
              speech.push("There " + (high.length === 1 ? "is one high impact event" : "are " + high.length + " high impact events") + " today.");
              high.forEach(e => speech.push(evLineSpeech(e) + "."));
            } else {
              speech.push("No high impact events today.");
            }
            speech.push(med.length + (med.length === 1 ? " medium impact event is" : " medium impact events are") + " also scheduled.");
            fs.writeFileSync("morning-report-speech.txt", speech.join(" "));

            console.log(lines.join("\n"));
            console.log("---SPEECH---");
            console.log(speech.join(" "));
          '

      - name: espeak-ng und ffmpeg installieren (kostenlose TTS)
        if: steps.gate.outputs.proceed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Sprachnachricht erzeugen
        if: steps.gate.outputs.proceed == 'true'
        run: |
          espeak-ng -v en-us -s 155 -f morning-report-speech.txt -w morning-report.wav
          # Telegram-Sprachnachrichten brauchen OGG/Opus, mono, 48kHz.
          ffmpeg -y -i morning-report.wav -c:a libopus -b:a 32k -ar 48000 -ac 1 morning-report.ogg

      - name: Per Telegram senden (Text + Sprachnachricht)
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID nicht als Secrets gesetzt - Versand uebersprungen. Siehe README-Hinweis im Workflow-Kommentar."
            exit 0
          fi
          TEXT="$(cat morning-report.txt)"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "voice=@morning-report.ogg"

      # Versand-Marker committen, damit der zweite Cron-Eintrag desselben
      # Tages (und weitere Nachzuegler) nicht doppelt senden. Push-Konflikte
      # mit dem stuendlichen Daten-Workflow werden per pull --rebase geloest.
      - name: Versand-Marker committen
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p .report-state
          echo "${{ steps.gate.outputs.date }}" > .report-state/morning_last.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .report-state/morning_last.txt
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Morning report sent ${{ steps.gate.outputs.date }}"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase origin main
          done

# ── Einmalige Einrichtung ────────────────────────────────────────────
# 1. In Telegram nach "BotFather" suchen, /newbot senden, Namen vergeben.
#    -> Bot-Token kopieren (Format: 123456789:ABC-Def...).
# 2. Dem neuen Bot eine beliebige Nachricht schicken (z.B. "/start"),
#    damit er antworten darf.
# 3. Chat-ID ermitteln: im Browser
#    https://api.telegram.org/bot<TOKEN>/getUpdates aufrufen (TOKEN aus
#    Schritt 1 einsetzen) -> im JSON "chat":{"id":...} suchen.
# 4. Im GitHub-Repo: Settings -> Secrets and variables -> Actions ->
#    "New repository secret":
#      TELEGRAM_BOT_TOKEN = Token aus Schritt 1
#      TELEGRAM_CHAT_ID   = ID aus Schritt 3
# 5. Workflow einmal manuell testen: Actions -> "Morning Report
#    (Telegram)" -> "Run workflow".
#
# Sprachnachricht: kostenlose espeak-ng-TTS (robotisch, keine weiteren
# Accounts noetig). Fuer eine natuerlichere Stimme muesste ein
# kostenpflichtiger TTS-Dienst (z.B. OpenAI TTS, ElevenLabs) samt
# eigenem API-Key als weiteres Secret eingebunden werden.
#
# Sendezeit: 07:00 Uhr Berlin-Zeit, ganzjaehrig (zwei Cron-Eintraege +
# Gate-Schritt gleichen die Sommer-/Winterzeit-Verschiebung aus - siehe
# Kommentare bei "on: schedule:" oben).
