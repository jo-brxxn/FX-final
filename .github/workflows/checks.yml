name: Waechter

# Laeuft bei jedem Push und jedem Pull Request auf index.html, die Module
# (js/), die Workflows oder die Waechter selbst. Die stuendlichen
# Daten-Commits (nur *.json) loesen ihn NICHT aus - sie aendern keinen Code.
# ⚠ js/** fehlte bis 2026-10-05: seit der Modul-Aufteilung (2026-08-25) liefen
# reine Modul-Aenderungen ungeprueft durch.
on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'check/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'check/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  waechter:
    runs-on: ubuntu-latest
    # 45 statt 25 Minuten (Nutzer-Wahl 2026-10-05): die Suite braucht lokal
    # ~27 Minuten, seit dem 2026-09-20 (letzter gruener Lauf Nr. 395) wurde
    # jeder Lauf am alten Limit abgebrochen - 97 von 100 "cancelled", kein
    # einziges Ergebnis. Waechst die Suite weiter: Limit mit anheben.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # die Regel-Pruefung braucht den Vorher-Stand

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PyYAML bereitstellen
        run: python3 -m pip install --quiet pyyaml

      - name: Statische Waechter
        run: node check/all.js --static --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}"

      - name: Chromium fuer die Browser-Waechter
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Testserver starten
        run: |
          nohup python3 -m http.server 8935 --directory . >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8935/index.html; then echo "Server steht."; exit 0; fi
            sleep 1
          done
          echo "Server kam nicht hoch"; exit 1

      - name: Alle Waechter
        env:
          PW_PATH: playwright
        run: node check/all.js --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}"
