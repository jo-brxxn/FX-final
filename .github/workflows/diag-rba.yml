# TEMPORAERER Diagnose-Workflow: RBA F1.1 CSV-Zeilenformat pruefen (AUD-
# Referenzzins-Parser lieferte im ersten Live-Lauf "ref-rate unreadable"
# trotz erfolgreichem Download, exakt gleiche Groesse wie in der fruehen
# Probe - der Parser trifft offenbar nicht auf das echte Datenzeilen-Format).
# Wird nach Auswertung wieder geloescht.
name: diag-rba
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump RBA F1.1 CSV rows
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "http=%{http_code} size=%{size_download}\n" "https://www.rba.gov.au/statistics/tables/csv/f1.1-data.csv" -o rba.csv
          echo "=== first 30 lines ==="
          head -n 30 rba.csv
          echo "=== last 10 lines ==="
          tail -n 10 rba.csv
          echo "=== total lines ==="
          wc -l rba.csv
