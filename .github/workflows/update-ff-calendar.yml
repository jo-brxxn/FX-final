name: Update FF Calendar

on:
  schedule:
    # Stuendlich, damit Actual-Werte (z.B. GDP, CPI), die fruehmorgens
    # europaeischer/asiatischer Zeit veroeffentlicht werden, noch am selben
    # Tag in ff_calendar.json landen (nicht erst beim naechsten 12h-Lauf).
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Forex Factory calendar (this + next week)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o thisweek.json || true
          curl -sL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o nextweek.json || true

      - name: Merge into ff_calendar.json
        run: |
          node -e '
            const fs=require("fs");
            function safeParse(file){
              try{
                const d=JSON.parse(fs.readFileSync(file,"utf8"));
                return Array.isArray(d)?d:null;
              }catch(e){return null;}
            }
            const a=safeParse("thisweek.json");
            const b=safeParse("nextweek.json");
            const existing=safeParse("ff_calendar.json")||[];
            if(a===null&&b===null){
              console.log("Both fetches failed/invalid, keeping existing ff_calendar.json");
              process.exit(0);
            }
            const fetched=[...(a||[]),...(b||[])];
            if(fetched.length===0){
              console.log("Empty result, keeping existing ff_calendar.json");
              process.exit(0);
            }
            console.log("Fetched: thisweek="+((a||[]).length)+" nextweek="+((b||[]).length));
            // Key auf Land|Titel|UTC-Kalendertag, damit derselbe Release nicht
            // doppelt landet. Frisch geholte Events haben Vorrang; danach werden
            // ZUKUENFTIGE Events aus der bisherigen Datei ergaenzt, die diesmal
            // nicht (mit)geholt wurden - so verschwindet die Folgewoche nicht,
            // wenn der nextweek-Abruf einmal blockiert wird/leer ist.
            function key(ev){
              const t=new Date(ev.date);
              if(isNaN(t))return null;
              return (ev.country||"")+"|"+(ev.title||"")+"|"+t.toISOString().slice(0,10);
            }
            const map=new Map();
            fetched.forEach(ev=>{const k=key(ev);if(k&&!map.has(k))map.set(k,ev);});
            const now=Date.now();
            let kept=0;
            existing.forEach(ev=>{
              const k=key(ev);if(!k)return;
              const t=new Date(ev.date).getTime();
              if(t>=now-86400000 && !map.has(k)){map.set(k,ev);kept++;}
            });
            const combined=[...map.values()].sort((x,y)=>new Date(x.date)-new Date(y.date));
            fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
            console.log("Wrote "+combined.length+" events ("+kept+" future events preserved from previous file)");
          '

      # Der freie Forex-Factory-Feed (nfs.faireconomy.media) liefert auf den
      # GitHub-Runnern haeufig NUR die laufende Woche (nextweek wird von
      # Cloudflare/Akamai blockiert), weshalb die naechsten 10 Tage komplett
      # fehlten. TradingViews Wirtschaftskalender ist von hier aus zuverlaessig
      # erreichbar und liefert title/country/date/importance/forecast/previous/
      # actual fuer ein frei waehlbares Fenster - er dient daher als Quelle
      # sowohl fuer ZUKUENFTIGE Events als auch fuer Actual-Werte.
      - name: Fetch TradingView economic calendar (today-3d .. today+11d)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          TV_FROM=$(node -e 'console.log(new Date(Date.now()-3*86400e3).toISOString())')
          TV_TO=$(node -e 'console.log(new Date(Date.now()+11*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_FROM}&to=${TV_TO}&countries=US,EU,DE,FR,IT,ES,GB,JP,CA,AU,NZ,CH,CN" -o tv.json || true

      # Zukuenftige High/Medium-Events (naechste 10 Tage) aus TradingView in
      # ff_calendar.json ergaenzen, falls der FF-Feed sie nicht (mehr) enthaelt.
      # Deduplizierung gegen vorhandene FF-Events ueber Waehrung + kanonischen
      # Event-Namen + ET-Kalendertag, damit KEINE Dopplungen entstehen. FF-Namen
      # haben Vorrang (TV fuellt nur Luecken).
      - name: Add upcoming events from TradingView
        run: |
          node -e '
            const fs=require("fs");
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",FR:"EUR",IT:"EUR",ES:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF",CN:"CNY"};
            function fmtVal(v,unit,scale){
              if(v==null||v==="")return "";
              let s=String(v);
              if(unit==="%")s+="%";
              else if(scale)s+=String(scale).toUpperCase();
              return s;
            }
            // Kanonischer Schluessel (identisch zur Enrichment-Logik unten), damit
            // FF "Core CPI m/m" und TV "Core Inflation Rate MoM" als dasselbe
            // Event erkannt werden.
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              // TradingView haengt an viele Titel "Growth Rate" an (z.B. "GDP
              // Growth Rate QoQ"), waehrend der FF-Feed nur "GDP q/q" nutzt -
              // das Wort entfernen, sonst werden beide als verschiedene Events
              // erkannt und es entstehen Dopplungen im Kalender.
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              // Weitere Fuellwoerter/Release-Stufen-Marker entfernen, die je
              // Quelle mal im Titel stehen und mal nicht ("Retail Sales MoM
              // Prel" vs "Retail Sales (MoM)", "National CPI" vs "CPI",
              // "Westpac Consumer Confidence Index" vs "... Sentiment") -
              // noetig, damit Investing.com-Titel gegen TV/FF-Titel matchen.
              s=s.replace(/\b(?:final|prel|prelim|preliminary|advance|adv|second estimate|2nd estimate)\b/g," ");
              s=s.replace(/\bindex\b/g," ").replace(/\bnational\b/g," ");
              s=s.replace(/consumer sentiment/g,"consumer confidence");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            // ET-Kalendertag (FF-Feed-Tage sind in US-Eastern; Juni = EDT = UTC-4)
            function etDay(iso){const t=new Date(iso).getTime();if(isNaN(t))return null;return new Date(t-4*3600e3).toISOString().slice(0,10);}

            let combined;
            try{combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){combined=[];}
            if(!Array.isArray(combined))combined=[];

            let tv;
            try{tv=JSON.parse(fs.readFileSync("tv.json","utf8"));}catch(e){tv=null;}
            const evts=Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
            if(!evts){console.log("TradingView future events unavailable, keeping ff_calendar.json as is");process.exit(0);}

            // Vorhandene Events indexieren (Waehrung|canonKey|ET-Tag) -> Dedup.
            const have=new Set();
            combined.forEach(ev=>{
              have.add((ev.country||"")+"|"+canonKey(ev.title)+"|"+String(ev.date).slice(0,10));
            });

            const now=Date.now();
            const lo=now-2*86400e3, hi=now+10*86400e3;
            let added=0;
            evts.forEach(ev=>{
              const ccy=TV2CCY[ev.country]||ev.currency;
              if(!ccy||!TV2CCY[ev.country])return;
              const imp=ev.importance;
              const impact=(imp===1||imp==="1")?"High":(imp===0||imp==="0")?"Medium":null;
              if(!impact)return;
              const t=new Date(ev.date).getTime();
              if(isNaN(t)||t<lo||t>hi)return;
              const title=String(ev.title||ev.indicator||"").trim();
              if(!title)return;
              const k=ccy+"|"+canonKey(title)+"|"+etDay(ev.date);
              if(have.has(k))return;
              have.add(k);
              combined.push({
                title:title,country:ccy,date:ev.date,impact:impact,
                forecast:fmtVal(ev.forecast,ev.unit,ev.scale),
                previous:fmtVal(ev.previous,ev.unit,ev.scale),
                actual:ev.actual!=null?fmtVal(ev.actual,ev.unit,ev.scale):"",
                src:"tv"
              });
              added++;
            });
            if(added){
              combined.sort((x,y)=>new Date(x.date)-new Date(y.date));
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
            }
            console.log("TradingView upcoming: added "+added+" future High/Medium event(s)");
          '

      # FXStreet's economic calendar API (calendar-api.fxstreet.com) returns
      # "actual" values that the free FF feed never provides. We fetch a
      # window covering the FF events and merge in any verified actuals.
      - name: Fetch FXStreet actual values
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          RANGE=$(node -e '
            const fs=require("fs");
            try{
              const d=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));
              let minT=Infinity,maxT=-Infinity;
              d.forEach(ev=>{
                const t=new Date(ev.date).getTime();
                if(!isNaN(t)){minT=Math.min(minT,t);maxT=Math.max(maxT,t);}
              });
              if(!isFinite(minT))process.exit(0);
              console.log(new Date(minT-86400000).toISOString()+" "+new Date(maxT+86400000).toISOString());
            }catch(e){process.exit(0);}
          ')
          if [ -n "$RANGE" ]; then
            START=$(echo "$RANGE" | cut -d" " -f1)
            END=$(echo "$RANGE" | cut -d" " -f2)
            curl -sL -A "$UA" -H "Referer: https://www.fxstreet.com/economic-calendar" \
              "https://calendar-api.fxstreet.com/en/api/v1/eventDates/${START}/${END}?volatilities=NONE,LOW,MEDIUM,HIGH&countries=&categories=" -o fxstreet.json || echo '[]' > fxstreet.json
          else
            echo '[]' > fxstreet.json
          fi

      # Fallback-Quellen fuer Actual-Werte, falls FXStreet eine Zahl (noch)
      # nicht fuehrt:
      # 1) Die Forex-Factory-Webseite selbst - dort stehen die Actuals und
      #    die Event-Namen passen 1:1 zum Feed (kein Alias-Mapping noetig).
      # 2) Trading Economics Kalender-API (guest-Zugang).
      # 3) Investing.com Kalender-AJAX-Endpunkt - liefert (im Gegensatz zu
      #    FXStreet/TradingView/Trading Economics) auch den S&P-Global/HCOB-
      #    Manufacturing-PMI-Endwert fuer EUR/GBP/JPY/CAD/AUD/NZD (siehe
      #    CLAUDE.md Session-Notizen 2026-07-04: "PMI ohne Trend"). Request-
      #    Format + Country-IDs sind aus der oeffentlich dokumentierten
      #    investpy-Bibliothek uebernommen (reverse-engineered, keine
      #    offizielle Doku von investing.com). Der Endpunkt ist Cloudflare-
      #    geschuetzt - kann daher auf GitHub-Runnern blockiert sein; Diagnose
      #    unten (Laenge/"cf-"/"challenge") zeigt das im Job-Log.
      # ── PMI-ERSATZQUELLE: Trading-Economics-Laenderseiten ────────────────
      # Ausgangslage, gemessen statt vermutet (siehe CLAUDE.md): KEINE der
      # vier bereits angebundenen Quellen fuehrt die PMI-Actuals fuer
      # EUR/GBP/JPY/AUD. TradingView liefert fuer S&P Global/HCOB/Jibun
      # grundsaetzlich keine Werte, FXStreets Kalender enthaelt 0 PMI-Reihen,
      # die Alt-Quellen kennen nur Ivey (CAD) mit Wert, Investing.com ist per
      # Cloudflare dicht. Bezahlt scheidet nach der Projekt-Regel aus.
      #
      # Per Sonde am 2026-08-09 geprueft, welche freie Quelle vom Runner aus
      # erreichbar ist UND die Zahl fuehrt:
      #   S&P Global Release-Uebersicht  200, 92 KB - aber nur eine Liste,
      #                                  die Zahlen stehen erst in den
      #                                  Einzelmitteilungen
      #   HCOB                           nicht erreichbar (curl 000, 0 Byte)
      #   Trading-Economics-Laenderseite 200, ~300 KB, Wert im KLARTEXT
      # Also die Laenderseiten. Sie tragen den Satz
      #   "Manufacturing PMI in Japan decreased to 54.50 points in July
      #    from 54.80 points in June of 2026."
      # - damit Actual, Previous, Referenzmonat und Jahr in einem Zug.
      #
      # Die Muster sind gegen die ECHTEN Saetze aus dem Sondenlauf geprueft:
      # 6 von 6 Formulierungen korrekt geparst (increased/decreased/unchanged/
      # remained), 3 von 3 Nicht-Treffer korrekt verworfen (Prognose-,
      # Durchschnitts- und Trendsaetze auf derselben Seite).
      - name: Fetch indicator actuals from Trading Economics country pages
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          # Jede Zeile: KUERZEL|WAEHRUNG|TE-PFAD. Erst PMI (seit 2026-08-09
          # produktiv), dann die uebrigen Reihen, fuer die KEINE der anderen
          # vier Quellen einen Wert liefert - jede einzeln aus der
          # OUT-OF-DATE-Liste der App abgeleitet, nicht auf Verdacht.
          while IFS='|' read -r key ccy path; do
            [ -z "$key" ] && continue
            curl -sL -A "$UA" -m 25 "https://tradingeconomics.com/$path" -o "tepage_$key.html" || true
            sleep 1
          done <<'URLS'
          mfg_EUR|EUR|euro-area/manufacturing-pmi
          svc_EUR|EUR|euro-area/services-pmi
          mfg_GBP|GBP|united-kingdom/manufacturing-pmi
          svc_GBP|GBP|united-kingdom/services-pmi
          mfg_JPY|JPY|japan/manufacturing-pmi
          svc_JPY|JPY|japan/services-pmi
          mfg_AUD|AUD|australia/manufacturing-pmi
          svc_AUD|AUD|australia/services-pmi
          mfg_CAD|CAD|canada/manufacturing-pmi
          svc_CAD|CAD|canada/services-pmi
          mfg_CHF|CHF|switzerland/manufacturing-pmi
          svc_CHF|CHF|switzerland/services-pmi
          retail_AUD|AUD|australia/retail-sales
          corecpi_AUD|AUD|australia/core-inflation-rate
          corecpi_CHF|CHF|switzerland/core-inflation-rate
          ppi_CHF|CHF|switzerland/producer-prices-change
          svcinfl_JPY|JPY|japan/services-inflation
          svcinfl2_JPY|JPY|japan/producer-prices-services
          gdp_JPY|JPY|japan/gdp-growth
          emp_JPY|JPY|japan/employed-persons
          jolts_JPY|JPY|japan/job-vacancies
          emp_EUR|EUR|euro-area/employment-change
          URLS
          node -e '
            const fs=require("fs");
            // key -> was die Seite fuer uns bedeutet.
            //   ind   = Indikatorname in der App
            //   anchor= womit der Berichtssatz beginnen MUSS (die Seite nennt
            //           auch Nachbar-Reihen, ein offenes Muster griffe daneben)
            //   unit  = wie der Wert in der App formatiert wird
            const MAP={
              mfg:{ind:"Manufacturing PMI",anchor:"manufacturing pmi"},
              svc:{ind:"Services PMI",anchor:"(?:services pmi|services psi)"},
              // Anker = wie die Seite die Reihe im BERICHTSSATZ nennt, nicht
              // wie sie im Menue heisst. Die Schweiz schreibt "Core consumer
              // prices", Australien nennt beim Kernmass die RBA-Reihe
              // (Trimmed Mean), Japan formuliert die eigene Reihe als
              // "GDP grew" bzw. "The number of employed persons".
              retail:{ind:"Retail Sales",anchor:"retail sales"},
              corecpi:{ind:"Core CPI",anchor:"(?:core inflation rate|core consumer pric|trimmed mean)"},
              ppi:{ind:"PPI",anchor:"producer pric"},
              svcinfl2:{ind:"Services Inflation",anchor:"(?:services producer pric|corporate services pric|services pric)"},
              svcinfl:{ind:"Services Inflation",anchor:"(?:services producer pric|corporate services pric|services pric)"},
              gdp:{ind:"GDP Growth QoQ",anchor:"gdp"},
              // Japan fuehrt keine monatliche "Beschaeftigungsaenderung" wie
              // USA/Kanada/Australien. Die Zahl der Erwerbstaetigen ist die
              // naechstliegende echte Reihe - fuer den Score zaehlt ohnehin
              // die RICHTUNG gegen den Vorwert, und die ist hier dieselbe
              // Aussage. Damit auf der Karte trotzdem sichtbar ist, WELCHE
              // Reihe das ist, traegt sie ein eigenes Label.
              emp:{ind:"NFP / Employment Change",anchor:"(?:employed persons|employment change|employment in)",label:"Employed Persons"},
              jolts:{ind:"JOLTS Job Openings",anchor:"job (?:vacanc|offers|openings)",label:"Job Vacancies"}
            };
            // Abschliessende Verbliste: auf derselben Seite stehen Prognose
            // ("is expected to be"), Durchschnitt ("averaged") und Ausblick
            // ("projected to trend") im selben Satzbau. Ein offenes Muster
            // liest die Prognose als Actual.
            // An den ECHTEN Saetzen der Seiten nachgezogen (Diagnoselauf
            // 2026-08-09): Japan schreibt "GDP grew", die Eurozone
            // "increased BY 0,1 percent", Japan "from A RECORD HIGH OF 68820
            // Thousand", und manche Seiten setzen das Prozentzeichen statt
            // des Wortes. Die Verbliste bleibt abschliessend - der Schutz
            // gegen Prognosesaetze liegt ohnehin im geforderten Monats- und
            // Jahres-Anhang, den "is expected to be ... by the end of this
            // quarter" nicht hat.
            const VERB="(?:increased|decreased|rose|fell|declined|edged up|edged down|went up|went down|grew|expanded|contracted|shrank|shrunk|advanced|climbed|dropped|jumped|slid|was unchanged at|remained at|remained unchanged at|stood at|was|came in at|hit|reached)";
            const NUM="(-?[\\d]+(?:\\.[\\d]+)?)";
            const UNIT="(percent|%|points|percent of gdp|thousand|million|billion|[a-z]{3} million|[a-z]{3} billion)";
            const FROM="from\\s+(?:a\\s+record\\s+(?:high|low)\\s+of\\s+|an\\s+all[\\s-]time\\s+(?:high|low)\\s+of\\s+)?";
            const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
            const out=[];
            fs.readdirSync(".").filter(f=>/^tepage_.+\.html$/.test(f)).sort().forEach(f=>{
              const key=f.slice(7,-5);            // z.B. "corecpi_CHF"
              const kind=key.split("_")[0], ccy=key.split("_")[1];
              const cfg=MAP[kind];
              if(!cfg){console.log("[te] "+key+": keine Zuordnung");return;}
              let h;try{h=fs.readFileSync(f,"utf8");}catch(e){console.log("[te] "+key+": nicht geladen");return;}
              const txt=h.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ")
                         .replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ");
              // Form A: "... increased TO x <unit> in <Monat> from y <unit> in <Monat> of <Jahr>"
              // Perioden-Anhang. Monatsreihen schreiben "in June of 2026",
              // Quartalsreihen "in the second quarter of 2026", und dazwischen
              // stehen teils Fuellwoerter ("from a month earlier",
              // "month-over-month"). Der Anhang bleibt aber PFLICHT - er ist
              // der eigentliche Schutz gegen die Prognosesaetze derselben
              // Seite ("by the end of this quarter", "from 1983 until 2026"),
              // die genau diesen Anhang nicht haben.
              const TAIL="(?:\\s+[a-z][a-z-]*){0,4}?\\s+in\\s+(?:the\\s+)?([a-z]+)(?:\\s+quarter)?\\s+of\\s+(\\d{4})";
              const A=new RegExp(cfg.anchor+"[^.]{0,60}?\\b"+VERB+"(?:\\s+by)?\\s+to\\s+"+NUM+"\\s*"+UNIT+"\\s+in\\s+(?:the\\s+)?([a-z]+)(?:\\s+quarter)?\\s+"+FROM+NUM+"\\s*"+UNIT+"\\s+in\\s+(?:the\\s+)?[a-z]+(?:\\s+quarter)?\\s+of\\s+(\\d{4})","i");
              // Form B: "... increased (by) x percent in <Periode> of <Jahr>"
              const B=new RegExp(cfg.anchor+"[^.]{0,60}?\\b"+VERB+"(?:\\s+by)?\\s+"+NUM+"\\s*"+UNIT+TAIL,"i");
              // ⚠ ALLE Vorkommen des Ankers durchprobieren, nicht nur das
              // erste. Der Reihenname steht auf jeder Seite zuerst in der
              // Navigation und in der Ueberschrift - dort folgt kein Verb,
              // und ein einzelnes exec() gibt genau diesen ersten Treffer
              // zurueck und erreicht den echten Berichtssatz weiter unten
              // nie. Genau daran sind AUD Core CPI, AUD Retail Sales und EUR
              // Employment Change gescheitert, obwohl ihr Satz auf der Seite
              // steht (im Log als "am Anker: ... Calendar News Markets ..."
              // zu sehen - das ist die Menueleiste).
              let actual=null,prev=null,unit=null,refMonth=null,refYear=null,shape=null;
              const thisYear=new Date().getFullYear();
              [["A",A],["B",B]].forEach(([tag,re0])=>{
                if(actual)return;
                const rg=new RegExp(re0.source,"gi");
                let mm;
                while((mm=rg.exec(txt))){
                  const yr=+(tag==="A"?mm[6]:mm[4]);
                  if(!(yr>=thisYear-1))continue;   // Rekord-/Durchschnittssatz
                  actual=mm[1];unit=mm[2].toLowerCase();refMonth=mm[3];
                  prev=tag==="A"?mm[4]:null;refYear=String(yr);shape=tag;
                  break;
                }
              });
              if(!actual){
                // Diagnose statt Raten: WAS steht dort stattdessen? Ohne das
                // muesste man das Satzmuster blind variieren - genau die Art
                // Zeitverschwendung, die die TITLE-DIAG bei den PMIs schon
                // einmal erspart hat.
                console.log("[te] "+key+": kein Berichtssatz ("+h.length+" Byte)");
                const an=new RegExp(cfg.anchor,"i").exec(txt);
                if(an)console.log("      am Anker: ..."+txt.slice(Math.max(0,an.index-30),an.index+260).replace(/\s+/g," ")+"...");
                else console.log("      Anker \""+cfg.anchor+"\" kommt auf der Seite gar nicht vor");
                // Fenster um JEDES Ankervorkommen, ohne am Satzende oder am
                // Dezimalpunkt abzubrechen - beides hat vorher genau die Stelle
                // verdeckt, auf die es ankam.
                const rgA=new RegExp(cfg.anchor,"gi");let am2,seen2=0;
                while((am2=rgA.exec(txt))&&seen2<3){seen2++;
                  console.log("      Vorkommen "+seen2+": "+txt.substr(am2.index,300));}
                const sent=null;
                if(sent)console.log("      erster Bewegungssatz: "+sent[0].trim().slice(0,240));
                return;
              }
              // Einheit -> Darstellung wie im Rest der App
              let fmtA,fmtP;
              if(unit==="percent"||unit==="%"||unit==="percent of gdp"){fmtA=actual+"%";fmtP=prev!=null?prev+"%":null;}
              else if(unit==="points"){fmtA=actual;fmtP=prev;}
              else if(unit==="thousand"){fmtA=actual+"K";fmtP=prev!=null?prev+"K":null;}
              else if(/million/.test(unit)){fmtA=actual+"M";fmtP=prev!=null?prev+"M":null;}
              else if(/billion/.test(unit)){fmtA=actual+"B";fmtP=prev!=null?prev+"B":null;}
              else{console.log("[te] "+key+": Einheit \""+unit+"\" nicht unterstuetzt - uebersprungen");return;}
              // Release-DATUM. Ohne echtes Datum wird NICHTS geschrieben - es
              // steuert Altersgrenze und Zyklus-Rechnung, ein geratenes waere
              // schlimmer als kein Eintrag (Grundsatz "nie schaetzen").
              // WICHTIG: auch im ROHEN HTML suchen. Das Tag-Strippen entfernt
              // die Attribute, und genau dort stehen die Termine haeufig
              // (data-date="2026-08-04") - bei vier Seiten war deshalb im
              // reinen Text ueberhaupt keine Datumsangabe zu finden.
              const dates=[];let dm;
              [txt,h].forEach(src=>{
                const D1=/\b([a-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})\b/gi;
                while((dm=D1.exec(src))){const mo=MON[dm[1].toLowerCase()];if(mo)dates.push(dm[3]+"-"+String(mo).padStart(2,"0")+"-"+String(dm[2]).padStart(2,"0"));}
                const D2=/\b(\d{4})-(\d{2})-(\d{2})\b/g;
                while((dm=D2.exec(src)))dates.push(dm[1]+"-"+dm[2]+"-"+dm[3]);
                const D3=/\b(\d{2})\/(\d{2})\/(\d{4})\b/g;
                while((dm=D3.exec(src)))dates.push(dm[3]+"-"+dm[1]+"-"+dm[2]);
              });
              const today=new Date().toISOString().slice(0,10);
              const floor=new Date(Date.now()-120*86400000).toISOString().slice(0,10);
              const past=dates.filter(d=>d<=today&&d>=floor).sort();
              const relDate=past.length?past[past.length-1]:null;
              if(!relDate)console.log("      [datum] keine vergangene Datumsangabe gefunden; gefundene Kandidaten: "+dates.slice(0,6).join(", ")||"(keine)");
              out.push({source:"tepage",country:ccy,key:kind,ind:cfg.ind,label:cfg.label||null,
                        actual:fmtA,previous:fmtP,date:relDate,refMonth:refMonth,refYear:refYear});
              console.log("[te] "+key+" -> "+cfg.ind+": "+fmtA+(fmtP?" (vorher "+fmtP+")":"")+" ["+shape+"/"+unit+"] "+refMonth+" "+refYear+" | Release: "+(relDate||"KEINS"));
            });
            fs.writeFileSync("te_pages.json",JSON.stringify(out));
            console.log("te_pages.json: "+out.length+" Werte");
          '

      - name: Fetch alternative actual sources (FF website + Trading Economics + Investing.com)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          INV_FROM=$(node -e 'console.log(new Date(Date.now()-5*86400e3).toISOString().slice(0,10))')
          INV_TO=$(node -e 'console.log(new Date(Date.now()+1*86400e3).toISOString().slice(0,10))')
          # Investing.coms Cloudflare blockt Requests heuristisch und
          # intermittierend (beobachtet: 8/8 Laeufe ok, am Folgetag 2/2 mit
          # ~6KB-Challenge-Seite statt ~230KB JSON) - daher bis zu 3 Versuche
          # mit Pause. Eine gueltige Antwort ist JSON ("{"-Anfang) und
          # deutlich groesser als die Challenge-Seite.
          for try in 1 2 3; do
            curl -sL -A "$UA" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: https://www.investing.com/economic-calendar/" \
              -H "Accept: application/json" \
              --data-urlencode "country[]=17" --data-urlencode "country[]=22" \
              --data-urlencode "country[]=72" --data-urlencode "country[]=4" \
              --data-urlencode "country[]=35" --data-urlencode "country[]=6" \
              --data-urlencode "country[]=25" --data-urlencode "country[]=43" \
              --data-urlencode "dateFrom=$INV_FROM" \
              --data-urlencode "dateTo=$INV_TO" --data-urlencode "timeZone=8" \
              --data-urlencode "timeFilter=timeRemain" --data-urlencode "currentTab=custom" \
              --data-urlencode "submitFilters=1" --data-urlencode "limit_from=0" \
              "https://www.investing.com/economic-calendar/Service/getCalendarFilteredData" -o invcal.json || true
            SIZE=$(wc -c <invcal.json 2>/dev/null | tr -d ' ')
            SIZE=${SIZE:-0}
            if [ "$SIZE" -gt 20000 ] && head -c 20 invcal.json | grep -q '{'; then
              echo "[debug] invcal.json: $SIZE bytes (attempt $try: OK)"
              break
            fi
            echo "[debug] invcal.json: $SIZE bytes (attempt $try: blocked/invalid)"
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          if [ -s invcal.json ]; then
            head -c 300 invcal.json; echo
          else
            echo "[debug] invcal.json: MISSING/EMPTY"
          fi
          for d in $(node -e '
            const M=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
            const nowET=new Date(Date.now()-4*3600e3);
            for(let i=2;i>=0;i--){
              const x=new Date(nowET.getTime()-i*86400e3);
              console.log(M[x.getUTCMonth()]+x.getUTCDate()+"."+x.getUTCFullYear());
            }
          '); do
            curl -sL -A "$UA" "https://www.forexfactory.com/calendar?day=$d" -o "ffhtml_$d.html" || true
          done
          curl -sL -A "$UA" "https://api.tradingeconomics.com/calendar?c=guest:guest&f=json" -o te.json || true
          # tv.json wurde bereits im Schritt "Fetch TradingView economic calendar"
          # geholt (breiteres Fenster) und wird hier nur noch ausgewertet.
          node -e '
            const fs=require("fs");
            const out=[];
            // ── Forex-Factory-HTML parsen ──────────────────────────────
            const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
            fs.readdirSync(".").filter(f=>/^ffhtml_.*\.html$/.test(f)).forEach(f=>{
              const m=f.match(/^ffhtml_([a-z]{3})(\d+)\.(\d{4})\.html$/);
              if(!m)return;
              const day=m[3]+"-"+String(M[m[1]]+1).padStart(2,"0")+"-"+String(Number(m[2])).padStart(2,"0");
              let html;
              try{html=fs.readFileSync(f,"utf8");}catch(e){return;}
              const rows=html.split(/<tr[^>]*calendar__row/).slice(1);
              let found=0;
              const cell=(row,cls)=>{
                const m=row.match(new RegExp("calendar__"+cls+"[^>]*>(?:\\s*<span[^>]*>)?([^<>]*?)(?:<\\/span>)?\\s*<\\/td>"));
                return m?m[1].trim():"";
              };
              rows.forEach(row=>{
                const cur=row.match(/calendar__currency[^>]*>\s*([A-Z]{3})\b/);
                const title=row.match(/calendar__event-title[^>]*>([^<]+)</);
                if(!cur||!title)return;
                const actual=cell(row,"actual");
                const previous=cell(row,"previous");
                const forecast=cell(row,"forecast");
                // Die Forex-Factory-Webseite ist die Referenz fuer revidierte
                // Previous-Werte (z.B. Core PPI 1.0% -> 0.7%) und nachgetragene
                // Actuals - daher auch dann uebernehmen, wenn (noch) kein Actual
                // vorliegt, solange wenigstens Previous oder Forecast dasteht.
                if(actual||previous||forecast){
                  out.push({source:"ffhtml",title:title[1].trim(),country:cur[1],day:day,actual:actual,previous:previous,forecast:forecast});
                  if(actual)found++;
                }
              });
              const diag=found?"":" [len="+html.length+" rows="+rows.length+(/just a moment|challenge|cf-/i.test(html)?" CLOUDFLARE-BLOCK":"")+"]";
              console.log("FF website "+day+": "+found+" actual(s) parsed"+diag);
            });
            // ── TradingView-Wirtschaftskalender ────────────────────────
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",FR:"EUR",IT:"EUR",ES:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF",CN:"CNY"};
            try{
              const tv=JSON.parse(fs.readFileSync("tv.json","utf8"));
              const evts=Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
              if(evts){
                let n=0;
                const fmt=(v,unit,scale)=>{
                  if(v==null||v==="")return "";
                  let s=String(v);
                  if(unit==="%")s+="%";
                  else if(scale)s+=String(scale).toUpperCase();
                  return s;
                };
                evts.forEach(ev=>{
                  const ccy=TV2CCY[ev.country];
                  if(!ccy)return;
                  // Auch ohne Actual uebernehmen: previous/forecast dienen zur
                  // Revisions-Erkennung (z.B. Core PPI previous 1.0% -> 0.7%).
                  const actual=ev.actual!=null?fmt(ev.actual,ev.unit,ev.scale):"";
                  const previous=fmt(ev.previous,ev.unit,ev.scale);
                  const forecast=fmt(ev.forecast,ev.unit,ev.scale);
                  if(!actual&&!previous&&!forecast)return;
                  out.push({source:"tv",name:ev.title||ev.indicator||"",country:ccy,dateUtc:ev.date,actual:actual,previous:previous,forecast:forecast});
                  if(actual)n++;
                });
                console.log("TradingView: "+n+" actual(s) loaded");
              }else{
                console.log("TradingView: unexpected response shape");
              }
            }catch(e){console.log("TradingView unavailable: "+e.message);}
            // ── Trading Economics normalisieren ────────────────────────
            const C2CCY={"united states":"USD","euro area":"EUR","germany":"EUR","france":"EUR","italy":"EUR","spain":"EUR","united kingdom":"GBP","japan":"JPY","canada":"CAD","australia":"AUD","new zealand":"NZD","switzerland":"CHF","china":"CNY"};
            try{
              const te=JSON.parse(fs.readFileSync("te.json","utf8"));
              if(Array.isArray(te)){
                let n=0;
                te.forEach(ev=>{
                  const ccy=C2CCY[String(ev.Country||"").toLowerCase()];
                  if(!ccy)return;
                  const actual=(ev.Actual==null||ev.Actual==="")?"":String(ev.Actual);
                  const previous=(ev.Previous==null||ev.Previous==="")?"":String(ev.Previous);
                  const forecast=(ev.Forecast==null||ev.Forecast==="")?"":String(ev.Forecast);
                  if(!actual&&!previous&&!forecast)return;
                  out.push({source:"te",name:ev.Event||"",country:ccy,dateUtc:ev.Date,actual:actual,previous:previous,forecast:forecast});
                  if(actual)n++;
                });
                console.log("Trading Economics: "+n+" actual(s) loaded");
              }
            }catch(e){console.log("Trading Economics unavailable: "+e.message);}
            // ── Investing.com Kalender-Events (alle, nicht nur PMI) ──────
            // Response ist {data:"<html mit <tr id=theDayNNN> Datums-Header
            // und <tr id=eventRowId_NNN> Event-Zeilen>",...}. Land kommt aus
            // dem title-Attribut der flagCur-Zelle, Actual/Forecast/Previous
            // aus den eventActual_/eventForecast_/eventPrevious_-IDs (Format
            // uebernommen aus der investpy-Bibliothek, investing.com selbst
            // dokumentiert das AJAX-Format nicht offiziell).
            // Es werden ALLE Events der getrackten Laender extrahiert:
            // - Manufacturing-PMI-Zeilen (mfg:true) fuer das bewaehrte
            //   Land+Zeit-Naehe-Matching (Titel enthalten Bank-Marken).
            // - Alle uebrigen Events als Forecast-/Actual-Quelle fuer den
            //   ind_data-Schritt und das kanonische canonKey-Matching
            //   (Investing.com liefert als einzige der 5 Quellen zuverlaessig
            //   den Forecast fuer Releases, bei denen TradingView keinen
            //   fuehrt, z.B. CAD Core CPI, AUD/NZD Westpac-Konsumklima).
            const INV_COUNTRY2CCY={"germany":"EUR","france":"EUR","euro zone":"EUR","united kingdom":"GBP","japan":"JPY","canada":"CAD","australia":"AUD","new zealand":"NZD"};
            try{
              const raw=fs.readFileSync("invcal.json","utf8");
              const cf=/just a moment|challenge-platform|cf-browser|attention required/i.test(raw);
              let payload;try{payload=JSON.parse(raw);}catch(e){payload=null;}
              const html=payload&&typeof payload.data==="string"?payload.data:null;
              if(!html){
                console.log("Investing.com: no usable HTML in response"+(cf?" [CLOUDFLARE-BLOCK likely]":"")+" [len="+raw.length+"]");
              }else{
                // Event-Zeilen tragen ihr Datum direkt als eigenes Attribut
                // (data-event-datetime="2026/06/29 01:00:00") - robuster als
                // die vorherige "theDay"-Header-Zeilen-Verfolgung, deren
                // id-Attribut tatsaechlich am verschachtelten <td> haengt
                // (nicht am <tr> selbst) und daher NIE traf: dateUtc fiel
                // dadurch immer auf "heute" zurueck, was aeltere Releases
                // (z.B. Monatsanfang-PMI, waehrend der Job Tage spaeter
                // laeuft) aus jedem Zeit-Toleranzfenster warf - beobachtet
                // in einem workflow_dispatch-Testlauf (alle 7 Eintraege
                // hatten dateUtc=heute statt ihres echten Release-Tages).
                let n=0,rows=0;
                const rowRe=/<tr([^>]*\bid="eventRowId_\d+"[^>]*)>([\s\S]*?)<\/tr>/g;
                let rm;
                while((rm=rowRe.exec(html))){
                  const attrs=rm[1],body=rm[2];
                  const idM=attrs.match(/\bid="eventRowId_(\d+)"/);
                  if(!idM)continue;
                  const evId=idM[1];
                  rows++;
                  const flagM=body.match(/flagCur[^>]*>[\s\S]*?title="([^"]*)"/);
                  const country=flagM?INV_COUNTRY2CCY[flagM[1].trim().toLowerCase()]:null;
                  if(!country)continue;
                  const nameM=body.match(/class="left event"[^>]*>([\s\S]*?)<\/td>/);
                  const name=nameM?nameM[1].replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim():"";
                  if(!name)continue;
                  const mfg=/manufacturing pmi/i.test(name)&&!/non.?manufacturing/i.test(name);
                  const grab=field=>{
                    const m=body.match(new RegExp("id=\"event"+field+"_"+evId+"\"[^>]*>([^<]*)<"));
                    return m?m[1].trim():"";
                  };
                  const actual=grab("Actual"),forecast=grab("Forecast"),previous=grab("Previous");
                  if(!actual&&!forecast&&!previous)continue;
                  const dtM=attrs.match(/data-event-datetime="(\d{4})\/(\d{2})\/(\d{2}) (\d{2}:\d{2}:\d{2})"/);
                  const dateUtc=dtM?(dtM[1]+"-"+dtM[2]+"-"+dtM[3]+"T"+dtM[4]+"Z"):(new Date().toISOString().slice(0,10)+"T00:00:00Z");
                  out.push({source:"investingcom",mfg:mfg,name:name,country:country,dateUtc:dateUtc,actual:actual,previous:previous,forecast:forecast});
                  if(actual)n++;
                }
                console.log("Investing.com: "+rows+" event row(s) scanned, "+n+" actual(s) loaded ("+out.filter(o=>o.source==="investingcom"&&o.mfg).length+" Manufacturing-PMI entries)");
                console.log("Investing.com PMI entries: "+JSON.stringify(out.filter(o=>o.source==="investingcom"&&o.mfg)));
              }
            }catch(e){console.log("Investing.com unavailable: "+e.message);}
            fs.writeFileSync("alt_actuals.json",JSON.stringify(out));
            console.log("alt_actuals.json: "+out.length+" total entries");
          '

      - name: Enrich ff_calendar.json with FXStreet actuals
        run: |
          node -e '
            const fs=require("fs");

            // Maps Forex Factory event titles (lowercased) to the equivalent
            // FXStreet event name(s) (lowercased), since the two providers use
            // different naming conventions for the same release. A value may
            // be a string or an array of candidate names.
            const NAME_ALIASES={
              "cpi m/m":"consumer price index (mom)",
              "cpi y/y":"consumer price index (yoy)",
              "core cpi m/m":"consumer price index ex food & energy (mom)",
              "core cpi y/y":"consumer price index ex food & energy (yoy)",
              "national cpi y/y":"consumer price index (yoy)",
              "ppi m/m":["producer price index (mom)","producer price index, final demand (mom)"],
              "ppi y/y":["producer price index (yoy)","producer price index, final demand (yoy)"],
              "core ppi m/m":["producer price index ex food & energy (mom)","core producer price index (mom)"],
              "core ppi y/y":["producer price index ex food & energy (yoy)","core producer price index (yoy)"],
              "core pce price index m/m":"core personal consumption expenditures - price index (mom)",
              "core pce price index y/y":"core personal consumption expenditures - price index (yoy)",
              "main refinancing rate":["ecb main refinancing operations rate","ecb interest rate decision","ecb rate decision","interest rate decision"],
              "overnight rate":["boc interest rate decision","boc rate decision","interest rate decision"],
              "official bank rate":["boe interest rate decision","interest rate decision"],
              "federal funds rate":["fed interest rate decision","fomc rate decision","interest rate decision"],
              "official cash rate":["rbnz interest rate decision","rba interest rate decision","interest rate decision"],
              "cash rate":["rba interest rate decision","interest rate decision"],
              "policy rate":["interest rate decision"],
              "gdp q/q":"gross domestic product annualized (qoq)",
              "prelim gdp q/q":"gross domestic product annualized (qoq)",
              "final gdp q/q":"gross domestic product annualized (qoq)",
              "advance gdp q/q":"gross domestic product annualized (qoq)",
              "gdp m/m":"gross domestic product (mom)",
              "unemployment rate":"unemployment rate",
              "retail sales m/m":"retail sales (mom)",
              "retail sales y/y":"retail sales (yoy)",
              "retail sales yoy":"retail sales (yoy)",
              "core retail sales m/m":"retail sales ex autos (mom)",
              "core retail sales y/y":"retail sales ex autos (yoy)",
              "ism manufacturing pmi":"ism manufacturing pmi",
              "ism services pmi":"ism non-manufacturing pmi",
              "ism non-manufacturing pmi":"ism non-manufacturing pmi",
              "flash manufacturing pmi":["s&p global manufacturing pmi","hcob manufacturing pmi"],
              "flash services pmi":["s&p global services pmi","hcob services pmi"],
              "final manufacturing pmi":["s&p global manufacturing pmi","hcob manufacturing pmi"],
              "final services pmi":["s&p global services pmi","hcob services pmi"],
              "prelim uom consumer sentiment":"michigan consumer sentiment index",
              "revised uom consumer sentiment":"michigan consumer sentiment index",
              "prelim uom inflation expectations":"michigan inflation expectations",
              "cb consumer confidence":"consumer confidence",
              "consumer confidence":"consumer confidence",
              "industrial production m/m":"industrial production (mom)",
              "industrial production y/y":"industrial production (yoy)",
              "manufacturing production m/m":"manufacturing production (mom)",
              "durable goods orders m/m":"durable goods orders (mom)",
              "core durable goods orders m/m":"durable goods orders ex transportation (mom)",
              "philly fed manufacturing index":"philadelphia fed manufacturing survey",
              "empire state manufacturing index":"empire state manufacturing index",
              "zew economic sentiment":"zew survey - economic sentiment",
              "german zew economic sentiment":"zew survey - economic sentiment",
              "ifo business climate":"ifo - business climate",
              "gfk consumer confidence":"gfk consumer confidence survey"
            };

            function normName(s){return String(s||"").toLowerCase().trim().replace(/\s+/g," ");}

            function trimNum(n){
              let s=Number(n).toFixed(3);
              s=s.replace(/0+$/,"").replace(/\.$/,"");
              return s;
            }

            // Only merge "actual" when we can format it the same way FF
            // does (plain number or percentage). K/M/B/T-scaled values
            // (Trade Balance, Jobless Claims, NFP, ...) are skipped to avoid
            // guessing the wrong magnitude/suffix.
            function fmtActual(fx){
              if(fx.actual==null)return null;
              if(fx.unit==="%")return trimNum(fx.actual)+"%";
              if((fx.unit==null||fx.unit==="")&&(fx.potency==null||fx.potency==="ZERO"))return trimNum(fx.actual);
              return null;
            }

            // Kanonischer Schluessel, damit Quellen mit anderer Namens-
            // Konvention (Trading Economics etc.) ohne Alias-Pflege matchen:
            // mom/yoy vereinheitlichen, "ex food & energy" -> core,
            // Langnamen kuerzen, Tokens sortieren.
            function canonKey(s){
              s=normName(s);
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              // Weitere Fuellwoerter/Release-Stufen-Marker entfernen, die je
              // Quelle mal im Titel stehen und mal nicht ("Retail Sales MoM
              // Prel" vs "Retail Sales (MoM)", "National CPI" vs "CPI",
              // "Westpac Consumer Confidence Index" vs "... Sentiment") -
              // noetig, damit Investing.com-Titel gegen TV/FF-Titel matchen.
              s=s.replace(/\b(?:final|prel|prelim|preliminary|advance|adv|second estimate|2nd estimate)\b/g," ");
              s=s.replace(/\bindex\b/g," ").replace(/\bnational\b/g," ");
              s=s.replace(/consumer sentiment/g,"consumer confidence");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }

            let combined;
            try{
              combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));
            }catch(e){
              console.log("No ff_calendar.json, skipping FXStreet enrichment");
              process.exit(0);
            }
            if(!Array.isArray(combined)||!combined.length)process.exit(0);

            let altActuals=[];
            try{
              altActuals=JSON.parse(fs.readFileSync("alt_actuals.json","utf8"));
              if(!Array.isArray(altActuals))altActuals=[];
            }catch(e){}

            // ── Revidierte Previous-/Forecast-Werte von der Forex-Factory-
            // Webseite uebernehmen (unabhaengig von FXStreet, da die Webseite
            // die Referenz ist, die der Nutzer sieht). Die FF-Webseite nutzt
            // exakt dieselben Event-Namen wie der Feed, daher reicht
            // Titel+Waehrung+ET-Kalendertag als Schluessel. Wird auch dann
            // angewandt, wenn der Wert bereits gesetzt ist (Revision).
            // Felder, die hier gesetzt werden, markieren wir (_ffAct/_ffPrev/
            // _ffFc), damit der nachfolgende TradingView-Overlay sie NICHT
            // mehr ueberschreibt - die FF-Webseite hat Vorrang.
            let revPrev=0,revFc=0,actFromWeb=0;
            combined.forEach(ev=>{
              const evDayET=String(ev.date).slice(0,10);
              const w=altActuals.find(a=>a.source==="ffhtml"&&a.title===ev.title&&a.country===ev.country&&a.day===evDayET);
              if(!w)return;
              if(w.actual&&w.actual!==ev.actual){ev.actual=w.actual;ev._ffAct=true;actFromWeb++;}
              if(w.previous&&w.previous!==ev.previous){ev.previous=w.previous;ev._ffPrev=true;revPrev++;}
              if(w.forecast&&w.forecast!==ev.forecast){ev.forecast=w.forecast;ev._ffFc=true;revFc++;}
            });
            if(revPrev||revFc||actFromWeb){
              // _ffAct/_ffPrev/_ffFc sind nur fuer den nachfolgenden TradingView-
              // Overlay-Schritt (im selben Prozess, gleiches `combined`-Array)
              // gedacht und duerfen nicht in die Datei geschrieben werden.
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined,(k,v)=>k==="_ffAct"||k==="_ffPrev"||k==="_ffFc"?undefined:v));
              console.log("FF website overlay: "+actFromWeb+" actual, "+revPrev+" previous, "+revFc+" forecast updated");
            }

            // ── Revidierte Previous-/Forecast-Werte aus TradingView/Trading
            // Economics uebernehmen (FF-Webseite ist auf den Runnern fast immer
            // von Cloudflare blockiert). Matcht ueber kanonischen Namen +
            // Waehrung + Zeit (+/-2h). Laeuft UNABHAENGIG von FXStreet, damit
            // Revisionen auch dann ankommen, wenn FXStreet ausfaellt. Felder,
            // die bereits von der FF-Webseite gesetzt wurden, bleiben
            // unangetastet (FF-Webseite hat Vorrang vor TradingView).
            const TV_TOL=2*60*60*1000;
            let tvAct=0;
            combined.forEach(ev=>{
              const t=new Date(ev.date).getTime();
              if(isNaN(t))return;
              const evKey=canonKey(ev.title);
              // Investing.com benennt denselben Release je Land unterschiedlich
              // (Landesname/Bank-Marke im Titel, z.B. "au Jibun Bank Japan
              // Manufacturing PMI", "Judo Bank Australia Manufacturing PMI") -
              // das sprengt den sonst ueber canonKey() exakt verglichenen
              // Namen. Da unsere Investing.com-Entnahme (s.o.) bereits VORAB
              // auf "manufacturing pmi"-Titel gefiltert hat, reicht hier
              // Land + Zeit-Naehe + "ist ev.title ueberhaupt ein Manufacturing-
              // PMI-Event" als Match-Kriterium (kein zweiter, anderer
              // Manufacturing-PMI-Release existiert je Land im selben Fenster).
              const isMfgPmi=/manufacturing pmi/i.test(ev.title)&&!/non.?manufacturing/i.test(ev.title);
              const hits=altActuals.filter(a=>{
                // Investing.com: PMI-Eintraege (a.mfg) matchen ueber Land+
                // Zeit-Naehe (Titel enthalten Bank-Marken, die canonKey
                // sprengen); alle uebrigen Eintraege wie TV/TE ueber den
                // kanonischen Namen + enge Zeit-Toleranz.
                if(a.source==="investingcom"){
                  if(a.mfg)return isMfgPmi&&a.country===ev.country&&a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=30*60*60*1000;
                  return a.country===ev.country&&a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TV_TOL&&canonKey(a.name)===evKey;
                }
                return (a.source==="tv"||a.source==="te")&&a.country===ev.country&&
                  a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TV_TOL&&
                  canonKey(a.name)===evKey;
              }
              ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(!hits.length)return;
              // Gleichquellen-Regel (Nutzer-Wunsch 2026-07-23): ein Kalender-
              // Event fuehrt Actual/Forecast/Previous IMMER aus DERSELBEN
              // Quelle - nie feldweise gemischt. Hat ForexFactory selbst schon
              // einen Actual (Basis oder FF-Website-Overlay), bleibt das
              // FF-Trio komplett unangetastet. Nur wenn FF KEINEN Actual hat,
              // wird das GANZE Trio vom zeitlich naechsten Alt-Treffer MIT
              // Actual uebernommen (Actual+Forecast+Previous aus einer Quelle);
              // von der FF-Website gesetzte Felder (_ff*) behalten dabei
              // Vorrang, da FF-Website = dieselbe Quelle wie das FF-Event.
              if(ev.actual&&ev.actual!=="")return;
              const h=hits.find(x=>x.actual);
              if(h){
                ev.actual=h.actual;tvAct++;
                if(!ev._ffFc)ev.forecast=h.forecast||"";
                if(!ev._ffPrev)ev.previous=h.previous||"";
              }
            });
            // Temporaere FF-Vorrang-Markierungen wieder entfernen, bevor in
            // die Datei geschrieben wird.
            combined.forEach(ev=>{delete ev._ffAct;delete ev._ffPrev;delete ev._ffFc;});
            if(tvAct){
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
              console.log("Alt-source overlay: "+tvAct+" event(s) got a full same-source trio (FF had no actual)");
            }

            let fxEvents;
            try{
              fxEvents=JSON.parse(fs.readFileSync("fxstreet.json","utf8"));
              if(!Array.isArray(fxEvents))throw new Error("not an array");
            }catch(e){
              console.log("FXStreet data unavailable/invalid, skipping FXStreet enrichment (FF website overlay already applied)");
              process.exit(0);
            }

            // Zeit-Toleranz: Provider veröffentlichen denselben Release teils
            // mit leicht abweichendem Zeitstempel - Name+Währung müssen exakt
            // passen, der Zeitpunkt nur auf +/-2h genau (nächster gewinnt).
            const TIME_TOL=2*60*60*1000;
            let matched=0,matchedFFW=0,matchedTE=0;

            // 0) Eurozone-Einzelstaaten-Flash-PMI (French/German Manufacturing/
            // Services PMI): FXStreet benennt diese Releases teils ALLE
            // identisch nach dem Indexanbieter ("HCOB Manufacturing PMI")
            // OHNE das Land im Namen, und die Zeitstempel sind nicht
            // zuverlaessig genug, um per Zeit-Naehe zu disambiguieren (FF und
            // FXStreet weichen teils um mehr als die 15 Min. Abstand zwischen
            // den Laendern selbst ab). Stattdessen nach Veroeffentlichungs-
            // Reihenfolge zuordnen: Frankreich meldet vor Deutschland vor dem
            // Eurozone-Aggregat - diese Reihenfolge ist Konvention und nicht
            // von Zeitstempel-Ungenauigkeit betroffen.
            const COUNTRY_ORDER={france:0,germany:1,spain:2,italy:2,netherlands:2};
            const pmiGroups={};
            combined.forEach(ev=>{
              if(ev.actual)return;
              const m=ev.title.toLowerCase().match(/\b(french|german|spanish|italian|dutch)\b/);
              if(!m)return;
              const t=new Date(ev.date).getTime();
              if(isNaN(t))return;
              const country=({french:"france",german:"germany",spanish:"spain",italian:"italy",dutch:"netherlands"})[m[1]];
              const noCountryCanon=canonKey(ev.title).split(" ").filter(w=>!(w in COUNTRY_ORDER)).join(" ");
              const key=ev.country+"|"+noCountryCanon+"|"+String(ev.date).slice(0,10);
              (pmiGroups[key]=pmiGroups[key]||[]).push({ev,country,t});
            });
            Object.keys(pmiGroups).forEach(key=>{
              const group=pmiGroups[key].sort((a,b)=>COUNTRY_ORDER[a.country]-COUNTRY_ORDER[b.country]);
              const [ccy,noCountryCanon]=key.split("|");
              const refT=group[0].t;
              const seen=new Set();
              const fxCands=fxEvents.filter(fx=>{
                if(fx.currencyCode!==ccy||fx.actual==null)return false;
                if(canonKey(fx.name)!==noCountryCanon)return false;
                if(Math.abs(new Date(fx.dateUtc).getTime()-refT)>24*60*60*1000)return false;
                const k=fx.dateUtc+"|"+fx.actual;
                if(seen.has(k))return false;
                seen.add(k);
                return true;
              }).sort((a,b)=>new Date(a.dateUtc).getTime()-new Date(b.dateUtc).getTime());
              if(fxCands.length!==group.length)return;
              group.forEach((item,i)=>{
                const f=fmtActual(fxCands[i]);
                if(f!==null){item.ev.actual=f;matched++;}
              });
            });

            const unmatched=[];
            combined.forEach(ev=>{
              if(ev.actual)return;
              const t=new Date(ev.date).getTime();
              if(isNaN(t))return;
              const ffName=normName(ev.title);
              let aliases=NAME_ALIASES[ffName]||[];
              if(typeof aliases==="string")aliases=[aliases];
              // 1) FXStreet (verifizierte, einheitlich formatierte Werte).
              // Neben der expliziten Alias-Liste auch ueber den kanonischen
              // Namen (canonKey) matchen, der Land-Adjektive normalisiert und
              // "Flash" entfernt - faengt Eurozone-Einzelstaaten-Releases
              // (French/German Flash PMI) ab, fuer die keine Alias-Zeile
              // gepflegt ist, ohne dass dafuer jede Sprachvariante einzeln
              // eingetragen werden muss.
              const ffCanon=canonKey(ev.title);
              const candidates=fxEvents.filter(fx=>
                fx.currencyCode===ev.country &&
                Math.abs(new Date(fx.dateUtc).getTime()-t)<=TIME_TOL &&
                fx.actual!=null &&
                (normName(fx.name)===ffName || aliases.includes(normName(fx.name)) || canonKey(fx.name)===ffCanon)
              ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(candidates.length){
                const f=fmtActual(candidates[0]);
                if(f!==null){ev.actual=f;matched++;return;}
              }
              // 2) Forex-Factory-Webseite: Namen identisch zum Feed, daher
              // reicht Titel+Waehrung+ET-Kalendertag (Feed-Datum traegt -04:00)
              const evDayET=String(ev.date).slice(0,10);
              const ffw=altActuals.find(a=>a.source==="ffhtml"&&a.title===ev.title&&a.country===ev.country&&a.day===evDayET&&a.actual);
              if(ffw){ev.actual=ffw.actual;matchedFFW++;return;}
              // 3) TradingView/Trading Economics: kanonischer Name + Zeit-Toleranz
              // (Investing.com: siehe Kommentar beim ersten Overlay oben -
              // Land+Zeit-Naehe statt canonKey, da Investing.com Bank-
              // Marken/Laendernamen in den PMI-Titel mischt.)
              const evKey=canonKey(ev.title);
              const evIsMfgPmi=/manufacturing pmi/i.test(ev.title)&&!/non.?manufacturing/i.test(ev.title);
              const te=altActuals.filter(a=>{
                if(a.source==="investingcom"){
                  if(a.mfg)return evIsMfgPmi&&a.country===ev.country&&a.actual&&Math.abs(new Date(a.dateUtc).getTime()-t)<=30*60*60*1000;
                  return a.country===ev.country&&a.actual&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TIME_TOL&&canonKey(a.name)===evKey;
                }
                return (a.source==="te"||a.source==="tv")&&a.country===ev.country&&a.actual&&
                  Math.abs(new Date(a.dateUtc).getTime()-t)<=TIME_TOL&&
                  canonKey(a.name)===evKey;
              }).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(te.length){ev.actual=te[0].actual;matchedTE++;return;}
              // Diagnose fuer kuerzlich faellige Events ohne Treffer.
              // ⚠ 2026-08-08: die Stufe war auf High/Medium beschraenkt -
              // PMIs laufen bei Forex Factory aber als "Low" und fielen
              // damit STILL durch. Genau die Indikatoren, die der Nutzer als
              // veraltet gemeldet hat, waren also die einzigen, ueber die es
              // nie eine Meldung gab. Jetzt zaehlt jede Impact-Stufe; das
              // 48h-Fenster bleibt, damit die Liste kurz bleibt.
              if(t<=Date.now()&&Date.now()-t<=48*60*60*1000){
                const near=fxEvents.filter(fx=>fx.currencyCode===ev.country&&Math.abs(new Date(fx.dateUtc).getTime()-t)<=TIME_TOL)
                  .map(fx=>fx.name+" [actual="+fx.actual+" unit="+fx.unit+" potency="+fx.potency+"]");
                const nearAlt=altActuals.filter(a=>a.country===ev.country&&(a.day===evDayET||(a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TIME_TOL)))
                  .map(a=>a.source+":"+(a.title||a.name)+" ["+a.actual+"]");
                unmatched.push(ev.title+" ("+ev.country+", "+ev.date+") -> FXStreet: "+(near.length?near.join(" | "):"NONE")+" || Alt: "+(nearAlt.length?nearAlt.join(" | "):"NONE"));
              }
            });
            // ── PMI-Actuals aus den Trading-Economics-Laenderseiten ──────
            // Letzte Instanz fuer genau die Luecke, die keine der anderen
            // Quellen schliesst (siehe Kommentar am Fetch-Schritt). Die
            // Seite fuehrt immer den ZULETZT veroeffentlichten Wert - er
            // gehoert also zur juengsten bereits stattgefundenen
            // Kalenderzeile dieses Landes und dieser Art. Genau so wird
            // zugeordnet: nicht ueber den Referenzmonat (der liegt je nach
            // Flash/Final mal im selben, mal im Vormonat), sondern ueber
            // "juengste vergangene Zeile ohne Wert". Fenster 40 Tage, damit
            // nach einem laengeren Ausfall nicht ein uralter Termin
            // rueckwirkend befuellt wird.
            let matchedTEP=0;
            try{
              const tep=JSON.parse(fs.readFileSync("te_pages.json","utf8"));
              // Nur die PMI-Reihen werden zusaetzlich in den Kalender
              // gespiegelt - dort steht ohnehin eine Zeile, der nur der Wert
              // fehlt. Alle anderen TE-Reihen gehen ausschliesslich direkt
              // nach ind_data (der Kalender fuehrt sie teils gar nicht).
              const isKind=(title,ind)=>{
                const t=String(title||"").toLowerCase();
                if(!/pmi/.test(t))return false;
                if(ind==="Manufacturing PMI")return /manufacturing pmi/.test(t)&&!/non-?manufacturing/.test(t);
                if(ind==="Services PMI")return /services pmi|non-?manufacturing pmi|\bpsi\b|ivey/.test(t);
                return false;
              };
              // Nationale Teilreihen tragen bei der Eurozone dieselbe
              // Waehrungskennung und duerfen NICHT befuellt werden - sonst
              // landet der Eurozone-Wert auf der deutschen Zeile.
              const isNational=t=>/german|french|italian|spanish|dutch|irish|greek/i.test(String(t||""));
              tep.forEach(e=>{
                const cands=combined.filter(ev=>ev.country===e.country&&!ev.actual&&
                  isKind(ev.title,e.ind)&&!isNational(ev.title)&&
                  (()=>{const t=new Date(ev.date).getTime();
                        return !isNaN(t)&&t<=Date.now()&&Date.now()-t<=40*86400000;})());
                if(!cands.length)return;
                cands.sort((a,b)=>new Date(b.date)-new Date(a.date));
                cands[0].actual=e.actual;
                matchedTEP++;
                console.log("[te-page] -> "+e.country+" \""+cands[0].title+"\" ("+cands[0].date+") = "+e.actual);
              });
            }catch(err){console.log("[te-page] te_pages.json nicht nutzbar: "+err.message);}
            console.log("Matched: "+matched+" from FXStreet, "+matchedFFW+" from FF website, "+matchedTE+" from TradingView/TradingEconomics, "+matchedTEP+" from TE country pages");
            if(unmatched.length){
              console.log("Unmatched due/recent events (all impact levels):");
              unmatched.forEach(u=>console.log("  - "+u));
            }
            // ── QUELLEN-DIAGNOSE fuer die Luecken-Indikatoren (2026-08-08) ──
            // TradingView liefert fuer S&P Global/HCOB/Jibun nachweislich
            // KEINE Actuals. Bevor eine neue Quelle angebaut wird, muss
            // geklaert sein, ob eine der BEREITS geholten Quellen die Werte
            // fuehrt - genau das war bisher nirgends sichtbar, weil die
            // Diagnose oben nur auf einzelne Kalender-Zeilen schaut. Hier
            // stattdessen die ROHEN Quell-Payloads durchsuchen.
            const GAPRE=/pmi|\bpsi\b|purchasing manag/i;
            const dump=(label,rows,name,ccy,act,when)=>{
              const seen={};
              rows.forEach(r=>{
                const n=name(r)||"";
                if(!GAPRE.test(n))return;
                const k=(ccy(r)||"?")+"|"+n;
                const a=act(r);
                const has=a!=null&&a!=="";
                if(!seen[k]||(!seen[k].has&&has))seen[k]={has:has,a:a,d:when(r)};
              });
              const ks=Object.keys(seen).sort();
              console.log(label+" PMI-Reihen ("+ks.length+"):");
              ks.forEach(k=>console.log("  "+k+(seen[k].has?" = "+seen[k].a:" [kein actual]")+(seen[k].d?" @"+String(seen[k].d).slice(0,10):"")));
            };
            dump("FXStreet",fxEvents,r=>r.name,r=>r.currencyCode,r=>r.actual,r=>r.dateUtc);
            dump("Alt-Quellen (ffhtml/tv/te/investingcom)",altActuals,r=>r.title||r.name,r=>r.country,r=>r.actual,r=>r.dateUtc||r.day);
            if(matched+matchedFFW+matchedTE+matchedTEP>0)fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
          '

      # Schutznetz gegen Dopplungen im Kalender (z.B. "GDP q/q" vom FF-Feed
      # UND "GDP Growth Rate QoQ" von TradingView fuer denselben Release):
      # unabhaengig davon, wie eine Dopplung entstanden ist (Namens-
      # Mismatch beim Hinzufuegen, mehrfacher Lauf, ...), werden hier ALLE
      # Events mit gleicher Waehrung + kanonischem Namen + ET-Kalendertag
      # zu einem Eintrag zusammengefuehrt (der vollstaendigere/FF-Eintrag
      # gewinnt, fehlende Felder werden aus dem Duplikat ergaenzt).
      - name: Deduplicate ff_calendar.json
        run: |
          node -e '
            const fs=require("fs");
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              // Weitere Fuellwoerter/Release-Stufen-Marker entfernen, die je
              // Quelle mal im Titel stehen und mal nicht ("Retail Sales MoM
              // Prel" vs "Retail Sales (MoM)", "National CPI" vs "CPI",
              // "Westpac Consumer Confidence Index" vs "... Sentiment") -
              // noetig, damit Investing.com-Titel gegen TV/FF-Titel matchen.
              s=s.replace(/\b(?:final|prel|prelim|preliminary|advance|adv|second estimate|2nd estimate)\b/g," ");
              s=s.replace(/\bindex\b/g," ").replace(/\bnational\b/g," ");
              s=s.replace(/consumer sentiment/g,"consumer confidence");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            function etDay(iso){const t=new Date(iso).getTime();if(isNaN(t))return null;return new Date(t-4*3600e3).toISOString().slice(0,10);}
            let combined;
            try{combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){process.exit(0);}
            if(!Array.isArray(combined))process.exit(0);
            const groups=new Map();
            combined.forEach(ev=>{
              const k=ev.country+"|"+canonKey(ev.title)+"|"+etDay(ev.date);
              if(!groups.has(k))groups.set(k,[]);
              groups.get(k).push(ev);
            });
            let removed=0;
            const out=[];
            groups.forEach(list=>{
              if(list.length===1){out.push(list[0]);return;}
              // Gleichquellen-Regel (Nutzer-Wunsch 2026-07-23): Duplikate NICHT
              // feldweise zusammenmischen (koennten aus verschiedenen Quellen
              // stammen) - stattdessen das EINE vollstaendigste Event behalten,
              // sein Actual/Forecast/Previous-Trio bleibt aus seiner Quelle.
              // Bei Gleichstand FF-nativ (kein src-Tag) bevorzugen.
              list.sort((a,b)=>{
                const af=["actual","forecast","previous"].filter(k=>a[k]).length;
                const bf=["actual","forecast","previous"].filter(k=>b[k]).length;
                if(bf!==af)return bf-af;
                return (a.src?1:0)-(b.src?1:0);
              });
              out.push(list[0]);
              removed+=list.length-1;
            });
            if(removed){
              out.sort((x,y)=>new Date(x.date)-new Date(y.date));
              fs.writeFileSync("ff_calendar.json", JSON.stringify(out));
              console.log("Dedup: removed "+removed+" duplicate calendar event(s)");
            } else {
              console.log("Dedup: no duplicates found");
            }
          '

      # ── INDIKATOR-WERTE (ind_data.json) ───────────────────────────────
      # Zieht ein BREITES Zeitfenster (letzte ~95 Tage) von TradingViews
      # Wirtschaftskalender (auf den Runnern zuverlaessig erreichbar) und
      # extrahiert pro getracktem Indikator den ZULETZT veroeffentlichten Wert
      # (actual/forecast/previous). So stammen die Werte der Indikator-Karten
      # aus derselben echten Quelle wie der Kalender - nur mit laengerem
      # Rueckblick, damit auch Releases sichtbar bleiben, die schon Wochen
      # zurueckliegen. Periodengenaue Zuordnung (q/q != m/m != y/y) verhindert
      # Verwechslungen wie monatliches vs. quartalsweises GDP.
      - name: Fetch TradingView wide window for indicator values
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          TV_FROM=$(node -e 'console.log(new Date(Date.now()-95*86400e3).toISOString())')
          TV_TO=$(node -e 'console.log(new Date(Date.now()+2*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_FROM}&to=${TV_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o tv_wide.json || true
          # Die 95-Tage-Abfrage liefert pro Aufruf maximal ~2000 Events
          # (API-Limit) - bei 9 Laendern reicht das Limit oft nicht bis zum
          # aktuellen Tag, wodurch die juengsten Veroeffentlichungen fehlen.
          # Zusaetzlich ein enges, garantiert unter dem Limit liegendes
          # Fenster um "jetzt" abfragen, damit die neuesten Actuals nicht
          # durch das Limit abgeschnitten werden.
          TV_RFROM=$(node -e 'console.log(new Date(Date.now()-45*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_RFROM}&to=${TV_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o tv_recent.json || true
          # Zusaetzliche AELTERE Fenster (95-395 Tage zurueck, in 60-Tage-
          # Haeppchen unter dem ~2000-Event-API-Limit): Quartals-Indikatoren
          # (GDP QoQ, NZD CPI/Employment/Unemployment, AUD PPI, Westpac)
          # haben im 95-Tage-Fenster nur 1-2 Releases - fuer den 2-Schritt-
          # Momentum-Trend der App braucht die history aber mindestens 3
          # Datenpunkte. ~13 Monate decken >=4 Quartals-Releases ab.
          for i in 0 1 2 3 4; do
            H_FROM=$(node -e "console.log(new Date(Date.now()-(95+60*($i+1))*86400e3).toISOString())")
            H_TO=$(node -e "console.log(new Date(Date.now()-(95+60*$i)*86400e3).toISOString())")
            curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
              "https://economic-calendar.tradingview.com/events?from=${H_FROM}&to=${H_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o "tv_hist_$i.json" || true
            sleep 2
          done
          # TIEFEN-Historie ueber die bestehenden 395 Tage hinaus, bis zu 3
          # Jahre (Nutzer-Wunsch 2026-07-14/15, Indikator-Verlaufschart mit
          # Actual+Forecast) - ALLE noch fehlenden 60-Tage-Haeppchen in
          # diesem EINEN Lauf holen (Nutzer-Wunsch 2026-07-15: nicht ueber
          # 13 Stunden strecken, sondern die komplette Vergangenheit sofort).
          # Fortschritt bleibt trotzdem in ind_data.json._histChunksFetched
          # persistiert, damit ein Lauf, der wegen Rate-Limiting mittendrin
          # abbricht, beim naechsten Mal nur die NOCH fehlenden Haeppchen
          # nachholt statt wieder bei 0 anzufangen; sind einmal alle 18
          # Haeppchen (3 Jahre) da, werden fuer diesen Teil keine weiteren
          # Requests mehr gestellt.
          CHUNKS_DONE=$(node -e '
            try{const d=JSON.parse(require("fs").readFileSync("ind_data.json","utf8"));console.log(Math.max(5,Math.min(18,+d._histChunksFetched||5)));}catch(e){console.log(5);}
          ')
          TARGET_CHUNKS=18
          rm -f tv_hist_deep_*.json
          i=$CHUNKS_DONE
          while [ "$i" -lt "$TARGET_CHUNKS" ]; do
            H_FROM=$(node -e "console.log(new Date(Date.now()-(95+60*($i+1))*86400e3).toISOString())")
            H_TO=$(node -e "console.log(new Date(Date.now()-(95+60*$i)*86400e3).toISOString())")
            curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
              "https://economic-calendar.tradingview.com/events?from=${H_FROM}&to=${H_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o "tv_hist_deep_$i.json" || true
            echo "[debug] deep history chunk $i fetched (window $H_FROM .. $H_TO)"
            i=$((i+1))
            sleep 2
          done
          export CHUNKS_DONE TARGET_CHUNKS
          node -e '
            const fs=require("fs");
            // TradingView-Laendercode -> unsere Symbol-Waehrung. DE wird als
            // Fallback fuer die Eurozone genutzt, falls EU fehlt.
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF"};
            const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
            const fmt=(v,unit,scale)=>{
              if(v==null||v==="")return null;
              let s=String(v);
              if(unit==="%")s+="%";else if(scale)s+=String(scale).toUpperCase();
              return s;
            };
            const period=t=>{
              t=norm(t);
              if(/\bq\/?o\/?q\b|\bqoq\b|quarter/.test(t))return "q/q";
              if(/\by\/?o\/?y\b|\byoy\b|year/.test(t))return "y/y";
              if(/\bm\/?o\/?m\b|\bmom\b|month/.test(t))return "m/m";
              return null;
            };
            // Praezise, periodengenaue Zuordnung TV-Titel -> unser Indikator.
            // test(t,ccy)=>true, plus erwartete Periode (oder null = egal).
            // Nur EINDEUTIGE Standard-Releases; laenderspezifische Sondermasse
            // (Negotiated Wages, WPI, Labour Cost Index, CSPI, Anleiherenditen,
            // Swaps, Spreads) bleiben bewusst aussen vor und landen im Report.
            // Schliesst Kern-/Spezial-Varianten aus, damit ein "Headline"-Wert
            // nicht faelschlich eine Ex-/Input-/Weekly-Reihe erwischt.
            const EXCORE=/core|\bex[\s-]|ex food|ex-food|excluding|trimmed|median|weighted|super/;
            const RULES=[
              {ind:"Central Bank Rate",period:null,test:t=>/interest rate decision|rate decision/.test(t)},
              {ind:"CPI (Headline)",period:"y/y",test:t=>/\binflation rate\b/.test(t)&&!EXCORE.test(t)&&!/wage|expectation|harmoni/.test(t)},
              {ind:"CPI",period:"m/m",test:t=>/\binflation rate\b/.test(t)&&!EXCORE.test(t)&&!/wage|expectation|harmoni/.test(t)},
              {ind:"Core CPI",period:"y/y",test:t=>/core inflation rate/.test(t)},
              {ind:"PPI",period:"y/y",test:t=>(/producer pric/.test(t)||/\bppi\b/.test(t))&&!EXCORE.test(t)&&!/input|import|\btrade\b/.test(t)},
              {ind:"Core PPI",period:"y/y",test:t=>/core producer pric|core ppi/.test(t)},
              {ind:"PCE",period:"y/y",test:(t,c)=>c==="USD"&&/\bpce price index\b/.test(t)&&!EXCORE.test(t)},
              {ind:"Core PCE",period:"y/y",test:(t,c)=>c==="USD"&&/core pce price index/.test(t)},
              {ind:"Unemployment Rate",period:null,test:t=>/unemployment rate/.test(t)&&!/ex|youth|\bu-?\d/.test(t)},
              {ind:"NFP / Employment Change",period:null,test:(t,c)=>c==="USD"?/non.?farm payrolls/.test(t)&&!/private/.test(t):/employment change/.test(t)&&!/adp/.test(t)},
              {ind:"ADP Employment",period:null,test:(t,c)=>c==="USD"&&/adp employment/.test(t)&&!/weekly/.test(t)},
              {ind:"JOLTS Job Openings",period:null,test:(t,c)=>c==="USD"&&/job openings/.test(t)},
              {ind:"Unemployment Claims",period:null,test:(t,c)=>c==="USD"&&/initial jobless claims/.test(t)},
              {ind:"Unemployment Claims",period:null,test:(t,c)=>c==="GBP"&&/claimant count/.test(t)},
              // Lohnwachstum war bis 2026-08-08 auf USD gegated - dabei fuehrt
              // TradingView fuer sechs weitere Waehrungen eine passende Reihe
              // MIT Actual (per TITLE DIAG desselben Tages belegt): GBP
              // "Average Earnings incl. Bonus (3Mo/Yr)", JPY "Average Cash
              // Earnings YoY", CAD "Average Hourly Wages YoY", EUR "Negotiated
              // Wage Growth", AUD "Wage Price Index YoY". Deshalb je eine
              // eigene Zeile statt eines gemeinsamen Musters: die Reihen
              // heissen nicht nur anders, sie haben auch verschiedene
              // Perioden-Kennungen, und GBP fuehrt zusaetzlich eine
              // "excl. Bonus"-Reihe, die NICHT die Headline ist.
              {ind:"Avg Hourly Earnings",period:"y/y",test:(t,c)=>c==="USD"&&/average hourly earnings/.test(t)},
              {ind:"Avg Hourly Earnings",period:null,test:(t,c)=>c==="GBP"&&/average earnings/.test(t)&&/incl/.test(t)},
              {ind:"Avg Hourly Earnings",period:"y/y",test:(t,c)=>c==="JPY"&&/average cash earnings/.test(t)},
              {ind:"Avg Hourly Earnings",period:"y/y",test:(t,c)=>c==="CAD"&&/average hourly wages/.test(t)},
              {ind:"Avg Hourly Earnings",period:null,test:(t,c)=>c==="EUR"&&/negotiated wage growth/.test(t)},
              {ind:"Avg Hourly Earnings",period:"y/y",test:(t,c)=>c==="AUD"&&/wage price index/.test(t)},
              {ind:"Avg Hourly Earnings",period:"q/q",test:(t,c)=>c==="NZD"&&/labou?r cost index/.test(t)},
              {ind:"GDP Growth QoQ",period:"q/q",test:t=>/\bgdp growth rate\b/.test(t)&&!/year/.test(t)},
              {ind:"Manufacturing PMI",period:null,test:t=>/manufacturing pmi/.test(t)&&!/non.?manufacturing/.test(t)},
              {ind:"Services PMI",period:null,test:t=>/services pmi|non.?manufacturing pmi/.test(t)},
              // CAD: die Ivey-Reihe ist Kanadas Stimmungsindex und heisst bei
              // TradingView "Ivey PMI s.a" - traf also weder "services pmi"
              // noch "non-manufacturing pmi". Die App selbst kennt diese
              // Zuordnung laengst (IND_EVENT_MATCHERS hat CAD:/ivey/ und
              // IND_DISPLAY_NAMES zeigt "Ivey PMI"), nur der Workflow nicht -
              // die einzige CAD-PMI-Reihe MIT Actual lief dadurch ins Leere.
              {ind:"Services PMI",period:null,test:(t,c)=>c==="CAD"&&/ivey/.test(t)},
              // NZD: BusinessNZ fuehrt eigene, anders betitelte Reihen statt
              // der generischen S&P-Global-Namen ("business nz pmi"/
              // "services nz psi" statt "manufacturing/services pmi") - per
              // workflow_dispatch-Testlauf verifiziert, dass TradingView
              // diese Titel tatsaechlich fuehrt (siehe CLAUDE.md-Session
              // 2026-07-21, NZD-Live-Quellen-Suche). War zuvor eine reine
              // Startbefuellung ohne jeden Live-Pfad.
              {ind:"Manufacturing PMI",period:null,test:(t,c)=>c==="NZD"&&/business nz pmi/.test(t)},
              {ind:"Services PMI",period:null,test:(t,c)=>c==="NZD"&&/services nz psi/.test(t)},
              // Ueberall den m/m-Release ziehen (nicht y/y), ausser bei CHF -
              // die Schweiz (BFS) meldet Detailhandelsumsatz nur als y/y, es
              // gibt dort keine eigene m/m-Reihe auf TradingView.
              {ind:"Retail Sales",period:"m/m",test:(t,c)=>c!=="CHF"&&c!=="NZD"&&/retail sales/.test(t)&&!/core|\bex[\s-]|ex fuel|yoy|y\/y/.test(t)},
              {ind:"Retail Sales",period:"y/y",test:(t,c)=>c==="CHF"&&/retail sales/.test(t)&&!/core|\bex[\s-]|ex fuel/.test(t)},
              // NZD: TradingView fuehrt keine "Retail Sales m/m"-Reihe (nur
              // q/q und y/y bei den Stats-NZ-Quartalszahlen) - stattdessen
              // dieselbe monatliche "Electronic Card Retail Sales"-Reihe
              // verwenden, die schon in der urspruenglichen Startbefuellung
              // als NZDs "Retail Sales"-Indikator hinterlegt ist (identische
              // Methodik, jetzt live statt einmalig manuell recherchiert).
              {ind:"Retail Sales",period:"m/m",test:(t,c)=>c==="NZD"&&/electronic retail card spending/.test(t)&&!/yoy|y\/y/.test(t)},
              // USD: ausdruecklich die Conference-Board-Reihe ("Consumer
              // Confidence") - NICHT die University-of-Michigan-"Consumer
              // Sentiment"-Reihe (anderer Indikator!).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c==="USD"&&/consumer confidence/.test(t)&&!/sentiment|michigan|expectation|change/.test(t)},
              // NZD: ausdruecklich die Westpac-Reihe (nicht ANZ-Roy Morgan).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c==="NZD"&&/westpac/.test(t)&&/consumer/.test(t)},
              // Uebrige Waehrungen: jeweils ihr landesuebliches Stimmungsmass
              // (EU-Kommission, GfK, SECO Climate, Cabinet Office, Westpac ...).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c!=="USD"&&c!=="NZD"&&/consumer confidence|consumer sentiment|consumer climate/.test(t)&&!/change|expectation/.test(t)},
            ];
            const readEvts=f=>{
              let tv;
              try{tv=JSON.parse(fs.readFileSync(f,"utf8"));}catch(e){return null;}
              return Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
            };
            const wide=readEvts("tv_wide.json");
            const recent=readEvts("tv_recent.json");
            if(!wide&&!recent){console.log("ind_data: TradingView windows unavailable, keeping existing ind_data.json");process.exit(0);}
            // Aeltere 60-Tage-Fenster (95-395 Tage zurueck) fuer die
            // Momentum-Trend-Historie der Quartals-Indikatoren; jedes darf
            // fehlen (continue-on-error-Charakter: hist ist reine Anreicherung).
            let histEvts=[],histN=[];
            for(let i=0;i<5;i++){const h=readEvts("tv_hist_"+i+".json");histN.push(h?h.length:0);if(h)histEvts=histEvts.concat(h);}
            // Alle in diesem Lauf geholten TIEFEN-Haeppchen (bis zu 3 Jahre
            // insgesamt) fuer den Indikator-Verlaufschart einsammeln - und
            // dabei merken, ob eines fehlgeschlagen ist (leer/kaputtes JSON,
            // z.B. Rate-Limit), damit der naechste Lauf genau dort statt bei
            // 0 weitermacht (siehe _histChunksFetched unten).
            const CHUNKS_DONE_ENV=+process.env.CHUNKS_DONE||5;
            const TARGET_CHUNKS_ENV=+process.env.TARGET_CHUNKS||18;
            let firstFailedChunk=null;
            for(let i=CHUNKS_DONE_ENV;i<TARGET_CHUNKS_ENV;i++){
              const h=readEvts(`tv_hist_deep_${i}.json`);
              if(h)histEvts=histEvts.concat(h);
              else if(firstFailedChunk===null)firstFailedChunk=i;
            }
            const nextChunksDone=firstFailedChunk===null?TARGET_CHUNKS_ENV:firstFailedChunk;
            // Enges Fenster zuerst -> bei gleichem Datum gewinnt trotzdem das
            // spaetere Event (s.u.), aber so sind die juengsten Actuals nicht
            // vom 2000er-Limit der 95-Tage-Abfrage betroffen.
            const evts=[...(recent||[]),...(wide||[]),...histEvts];
            console.log("ind_data: "+(wide?wide.length:0)+" TV events in 95d window, "+(recent?recent.length:0)+" in 45d window, hist windows: "+histN.join("/"));
            // Pro (ccy|ind) ALLE Events mit Actual sammeln (nicht nur das
            // spaeteste) - das vorletzte Event liefert den verlaesslichsten
            // "Previous"-Wert (s.u.).
            const hist={};
            evts.forEach(ev=>{
              const ccy=TV2CCY[ev.country];
              if(!ccy)return;
              const title=norm(ev.title||ev.indicator||"");
              if(!title)return;
              const actual=fmt(ev.actual,ev.unit,ev.scale);
              if(actual==null)return; // nur veroeffentlichte Werte
              const per=period(ev.title||ev.indicator||"");
              RULES.forEach(r=>{
                if(!r.test(title,ccy))return;
                if(r.period&&per&&r.period!==per)return; // Periode muss passen
                if(r.period&&!per)return; // Periode gefordert, aber keine erkannt -> ueberspringen
                const k=ccy+"|"+r.ind;
                const t=new Date(ev.date).getTime();
                if(isNaN(t))return;
                (hist[k]=hist[k]||[]).push({
                  actual:actual,
                  forecast:fmt(ev.forecast,ev.unit,ev.scale),
                  previous:fmt(ev.previous,ev.unit,ev.scale),
                  date:new Date(ev.date).toISOString().slice(0,10),
                  event:(ev.title||ev.indicator||""),
                  period:r.period,
                  origin:ev.country,
                  _t:t
                });
              });
            });
            // In nach Waehrung gruppiertes Objekt umwandeln. "Previous" wird,
            // wenn moeglich, durch den ACTUAL-Wert des vorhergehenden Release
            // ERSETZT statt dem von TradingView selbst gemeldeten previous-Feld
            // zu vertrauen. Das ist aber nur der FALLBACK: wo der Forex-Factory-
            // Kalender (unten) einen passenden Eintrag hat, gewinnen dessen
            // Werte (siehe FF-Overlay).
            const out={};
            Object.keys(hist).forEach(k=>{
              const [ccy,ind]=k.split("|");
              let arr=hist[k];
              // EUR: Eurozone-Aggregat (TV-Land "EU") bevorzugen, damit
              // nationale Releases (DE/FR/IT/ES -> EUR) den Euro-Wert nicht
              // ueberschreiben (z.B. deutscher PPI 2.2% statt Eurozone-PPI).
              // Nationale Quelle bleibt nur Fallback, falls kein EU-Release
              // im Fenster vorliegt.
              if(ccy==="EUR"){const eu=arr.filter(e=>e.origin==="EU");if(eu.length)arr=eu;}
              const list=arr.sort((a,b)=>b._t-a._t);
              // Duplikate entdoppeln: recent- und wide-Fenster ueberlappen,
              // dasselbe Release kann doppelt in der Liste stehen - fuer
              // "previous" und die Historie zaehlt jedes Datum nur einmal.
              const uniq=[];const seenD=new Set();
              for(const e of list){if(seenD.has(e.date))continue;seenD.add(e.date);uniq.push(e);}
              const v={...uniq[0]};delete v._t;delete v.origin;
              if(uniq[1])v.previous=uniq[1].actual;
              // Release-Historie fuer den Momentum-Trend der App: die letzten
              // bis zu 4 veroeffentlichten Werte [[Datum,Actual],...], aeltester
              // zuerst. Damit hat die App die noetigen 3 Datenpunkte sofort,
              // statt auf kuenftige Releases warten zu muessen. UNVERAENDERT -
              // die Trend-Logik haengt an genau diesem Format/dieser Laenge.
              v.history=uniq.slice(0,4).map(e=>[e.date,e.actual]).reverse();
              // Fuer den Indikator-Verlaufschart (Nutzer-Wunsch 2026-07-14):
              // ALLE in diesem Lauf gematchten Events mit Forecast, aeltester
              // zuerst - wird gleich mit der ueber prevOut mitgefuehrten
              // Historie aus fruaeheren Laeufen gemergt (s.u.), da ein
              // einzelner Lauf immer nur einen Zeit-Ausschnitt sieht.
              v._newHistFull=uniq.map(e=>[e.date,e.actual,e.forecast==null?null:e.forecast]).reverse();
              (out[ccy]=out[ccy]||{})[ind]=v;
            });

            // ── Forex-Factory-Kalenderwerte haben VORRANG (Nutzerwunsch) ──────
            // Die Indikator-Karten sollen exakt die Werte des Forex-Factory-
            // Kalenders (ff_calendar.json) zeigen, damit Karte und Kalender
            // IMMER identisch sind (kein Auseinanderlaufen mehr wie bei NZD GDP:
            // Karte 0.5% vs. Kalender 0.2%). Pro Indikator wird der passende
            // FF-Eintrag (gleiche Waehrung + kanonischer Name, naechstgelegenes
            // Datum) gesucht und dessen actual/forecast/previous uebernommen.
            // Nur wo der Kalender (noch) keinen Eintrag hat (Release liegt
            // ausserhalb des ~13-Tage-Fensters), bleiben die oben aus
            // TradingView abgeleiteten Werte als Fallback bestehen.
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              // Weitere Fuellwoerter/Release-Stufen-Marker entfernen, die je
              // Quelle mal im Titel stehen und mal nicht ("Retail Sales MoM
              // Prel" vs "Retail Sales (MoM)", "National CPI" vs "CPI",
              // "Westpac Consumer Confidence Index" vs "... Sentiment") -
              // noetig, damit Investing.com-Titel gegen TV/FF-Titel matchen.
              s=s.replace(/\b(?:final|prel|prelim|preliminary|advance|adv|second estimate|2nd estimate)\b/g," ");
              s=s.replace(/\bindex\b/g," ").replace(/\bnational\b/g," ");
              s=s.replace(/consumer sentiment/g,"consumer confidence");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            let cal;
            try{cal=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){cal=null;}
            let ffOverlaid=0;
            if(Array.isArray(cal)){
              Object.keys(out).forEach(ccy=>{
                Object.keys(out[ccy]).forEach(ind=>{
                  const v=out[ccy][ind];
                  if(!v.event)return;
                  const evKey=ccy+"|"+canonKey(v.event);
                  const t=new Date(v.date).getTime();
                  // Passenden FF-Eintrag mit dem naechstgelegenen Datum suchen.
                  let best=null,bestDt=Infinity;
                  cal.forEach(ev=>{
                    if(ev.country+"|"+canonKey(ev.title)!==evKey)return;
                    const et=new Date(ev.date).getTime();
                    if(isNaN(et))return;
                    const dt=Math.abs(et-t);
                    if(dt<bestDt){bestDt=dt;best=ev;}
                  });
                  if(!best||bestDt>4*86400e3)return;
                  // Gleichquellen-Regel (Nutzer-Wunsch 2026-07-23): Actual,
                  // Forecast UND Previous muessen aus DERSELBEN Quelle stammen
                  // (oder leer bleiben) - NIE einzelne Felder mischen. Hat
                  // TradingView bereits einen Actual, bleibt das komplette
                  // TV-Trio. Nur wenn TV keinen Actual hat, wird das GANZE
                  // Trio von ForexFactory uebernommen.
                  if(v.actual!=null&&v.actual!==""){v.source=v.source||"tv";return;}
                  if(best.actual){v.actual=best.actual;v.forecast=best.forecast||null;v.previous=best.previous||null;v.source="ff";ffOverlaid++;}
                });
              });
            }

            // ── Investing.com-Anreicherung (alt_actuals.json, source
            // "investingcom" - im Schritt "Fetch alternative actual sources"
            // extrahiert). Zwei Aufgaben:
            // 1) FEHLENDE FORECASTS nachtragen: TradingView liefert fuer
            //    manche Releases keinen Forecast (CAD Core CPI/GDP/Retail
            //    Sales, AUD/NZD Westpac, JPY CPI, EUR CPI m/m, ...) -
            //    Investing.com fuehrt ihn. Match: gleiche Waehrung +
            //    kanonischer Name + Release-Datum max. 3 Tage auseinander +
            //    SICHERHEITS-CHECK: liegen beide Actuals vor, muessen sie
            //    numerisch uebereinstimmen (sonst ist es ein anderes Event).
            // 2) JPY "Services Inflation" (Corporate Services Price Index):
            //    TradingViews Titel-Matching ist fuer die laenderspezifische
            //    CSPI-Reihe bewusst nicht aktiv (siehe RULES-Kommentar) -
            //    Investing.com liefert Actual+Forecast+Previous direkt.
            // Beides ist nur im ~6-Tage-Abruffenster von Investing.com
            // frisch verfuegbar -> Persistenz ueber das VORHERIGE
            // ind_data.json (liegt im Checkout): einmal gefundene Forecasts
            // bleiben am selben Release kleben, der CSPI-Eintrag wird
            // zwischen den Monats-Releases unveraendert weitergetragen.
            let prevOut={};
            try{const p=JSON.parse(fs.readFileSync("ind_data.json","utf8"));if(p&&typeof p==="object"&&!Array.isArray(p))prevOut=p;}catch(e){}
            // Indikator-Verlaufschart (Nutzer-Wunsch 2026-07-14): historyFull
            // akkumuliert ueber viele Laeufe hinweg (wie beim CSPI-history-Feld
            // oben), bis zu 3 Jahre Actual+Forecast. Jeder Lauf sieht nur einen
            // Zeit-Ausschnitt (v._newHistFull) - hier mit der ueber prevOut
            // mitgefuehrten Historie gemergt (neuere Werte gewinnen bei
            // Ueberlappung/Revisionen), auf 3 Jahre gekappt, chronologisch
            // sortiert.
            const HIST_FULL_DAYS=1095;
            Object.keys(out).forEach(ccy=>{
              Object.keys(out[ccy]).forEach(indName=>{
                const v=out[ccy][indName];
                const prevEntry=prevOut[ccy]&&prevOut[ccy][indName];
                const prevHist=(prevEntry&&Array.isArray(prevEntry.historyFull))?prevEntry.historyFull:[];
                const newHist=v._newHistFull||[];
                const byDate={};
                prevHist.forEach(h=>{if(h&&h[0])byDate[h[0]]=h;});
                newHist.forEach(h=>{if(h&&h[0])byDate[h[0]]=h;});
                const cutoff=Date.now()-HIST_FULL_DAYS*86400e3;
                v.historyFull=Object.values(byDate).filter(h=>new Date(h[0]).getTime()>=cutoff).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
                delete v._newHistFull;
              });
            });
            out._histChunksFetched=Math.max(5,Math.min(18,nextChunksDone));
            let invEvts=[];
            try{
              const alt=JSON.parse(fs.readFileSync("alt_actuals.json","utf8"));
              if(Array.isArray(alt))invEvts=alt.filter(a=>a.source==="investingcom");
            }catch(e){}
            const numOf=s=>{if(s==null)return null;const m=String(s).replace(/,/g,"").match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):null;};
            const dayDiff=(a,b)=>Math.abs(new Date(String(a).slice(0,10))-new Date(String(b).slice(0,10)))/86400e3;
            // (1) Gleichquellen-Regel (Nutzer-Wunsch 2026-07-23): der Forecast
            // wird NICHT mehr quellenuebergreifend von Investing.com geliehen
            // (das mischte Actual=TV mit Forecast=Investing). Fehlt der eigene
            // Forecast der Trio-Quelle, bleibt er LEER -> Score ueber Step/
            // Previous. Nur der EIGENE Forecast (derselben Quelle) wird am
            // selben Release aus dem Vor-Lauf weitergetragen, weil TradingView
            // den Forecast wie das previous nach ein paar Tagen wieder
            // ausblendet. (invEvts wird weiter fuer den CSPI-Eintrag unten
            // gebraucht.)
            let keptFc=0;
            Object.keys(out).forEach(ccy=>{
              Object.keys(out[ccy]).forEach(indName=>{
                const v=out[ccy][indName];
                if(!v.source)v.source="tv"; // Basis-Trio kommt aus TradingView
                if(v.forecast!=null&&v.forecast!=="")return;
                const pv=prevOut[ccy]&&prevOut[ccy][indName];
                if(pv&&pv.forecast!=null&&pv.forecast!==""&&pv.source!=="investing"&&pv.date===v.date&&numOf(pv.actual)===numOf(v.actual)){
                  v.forecast=pv.forecast;keptFc++;
                }
              });
            });
            // (2) JPY Services Inflation (CSPI) direkt aus Investing.com.
            const cspi=invEvts.find(a=>a.country==="JPY"&&/cspi|corporate services? price/i.test(a.name)&&a.actual);
            if(cspi){
              const date=String(cspi.dateUtc).slice(0,10);
              const prevEntry=prevOut.JPY&&prevOut.JPY["Services Inflation"];
              const hist=(prevEntry&&Array.isArray(prevEntry.history)?prevEntry.history:[]).filter(h=>h&&h[0]!==date);
              hist.push([date,cspi.actual]);
              (out.JPY=out.JPY||{})["Services Inflation"]={
                actual:cspi.actual,forecast:cspi.forecast||null,previous:cspi.previous||null,
                date:date,event:cspi.name,period:null,history:hist.slice(-4),source:"investing"
              };
              console.log("ind_data <- Investing.com: JPY Services Inflation (CSPI) "+cspi.actual+" ("+date+")");
            }else if(prevOut.JPY&&prevOut.JPY["Services Inflation"]){
              // Kein frisches CSPI-Event im Fenster -> letzten Stand behalten.
              (out.JPY=out.JPY||{})["Services Inflation"]=prevOut.JPY["Services Inflation"];
            }

            // (3) Revisions-Erkennung (Nutzer-Wunsch 2026-07-21): kommt ein
            //     NEUES Release (Datum wechselt ggue. dem letzten Lauf) und
            //     weicht dessen "previous" numerisch vom Actual des
            //     VORHERIGEN Release ab (wie er damals gemeldet wurde, via
            //     prevOut), wurde der alte Wert revidiert -> revisedFrom
            //     traegt den urspruenglich gemeldeten Wert. Innerhalb
            //     desselben Release wird revisedFrom aus dem Vor-Lauf
            //     weitergetragen (Persistenz wie beim Forecast oben), beim
            //     NAECHSTEN Release ohne neue Abweichung faellt es weg.
            //     Server-seitig statt im Client, damit ALLE Geraete dieselbe
            //     Revision sehen - ein Geraet, das zwischen zwei Releases nie
            //     offen war, koennte den Vergleich lokal nicht anstellen
            //     (sein gespeicherter Stand ist dann 2+ Releases alt und
            //     wuerde faelschlich eine "Revision" melden).
            let revN=0;
            Object.keys(out).forEach(ccy=>{
              const grp=out[ccy];
              if(!grp||typeof grp!=="object")return;
              Object.keys(grp).forEach(indName=>{
                const v=grp[indName];
                if(!v||typeof v!=="object")return;
                const pv=prevOut[ccy]&&prevOut[ccy][indName];
                if(!pv)return;
                if(pv.date&&v.date&&pv.date!==v.date&&pv.actual!=null&&v.previous!=null){
                  const a=numOf(pv.actual),b=numOf(v.previous);
                  if(a!=null&&b!=null&&a!==b){v.revisedFrom=pv.actual;revN++;}
                }else if(pv.date===v.date&&pv.revisedFrom!=null){
                  v.revisedFrom=pv.revisedFrom;
                  // TV setzt das previous-Feld einige Tage nach dem Release
                  // wieder auf den UNrevidierten Originalwert zurueck
                  // (beobachtet bei USD NFP Juli 2026: revidiertes previous
                  // 129K stand nur vom 02.-04.07. im Feed, danach wieder
                  // 172K = der alte Juni-Actual; TVs history-Reihe fuehrt
                  // ebenfalls durchgehend den Originalwert). Springt das
                  // frische previous exakt auf revisedFrom zurueck, den
                  // REVIDIERTEN Stand aus dem Vor-Lauf behalten - sonst
                  // loescht sich jede Revision nach wenigen Tagen von
                  // selbst. Ein DRITTER Wert (echte Zweitrevision) wird
                  // dagegen normal uebernommen.
                  if(v.previous!=null&&pv.previous!=null&&numOf(v.previous)===numOf(pv.revisedFrom)&&numOf(pv.previous)!==numOf(pv.revisedFrom))v.previous=pv.previous;
                }
              });
            });
            if(revN)console.log("ind_data revisions detected this run: "+revN);

            // ── PMI aus den Trading-Economics-Laenderseiten nachtragen ──
            // Direkt nach ind_data, nicht nur ueber den Kalender: der
            // FF-Feed umfasst nur zwei Wochen, die PMI-Zeile ist also schon
            // wenige Tage nach dem Release verschwunden und der Wert haette
            // nichts mehr zum Andocken (live beobachtet am 2026-08-09 -
            // 12 von 12 Werten geholt, 0 zuzuordnen). Nur eintragen, wenn
            // die Reihe hier KEINEN Wert hat oder der TE-Wert NEUER ist,
            // und nur MIT echtem Release-Datum - ohne Datum liesse sich
            // weder Alter noch Zyklus rechnen, und ein geratenes Datum
            // waere schlimmer als kein Eintrag.
            try{
              const tep=JSON.parse(fs.readFileSync("te_pages.json","utf8"));
              let tepN=0,tepSkip=0;
              tep.forEach(e=>{
                if(!e.date){tepSkip++;console.log("[te->ind_data] "+e.country+" "+e.ind+": uebersprungen, kein Release-Datum");return;}
                const ind=e.ind;
                out[e.country]=out[e.country]||{};
                const cur=out[e.country][ind];
                if(cur&&cur.date&&cur.date>=e.date)return;   // schon aktueller
                out[e.country][ind]={actual:e.actual,forecast:(cur&&cur.date===e.date?cur.forecast:null)||null,
                  previous:e.previous,date:e.date,event:(e.label||ind)+" (Trading Economics)",source:"tepage",
                  history:(cur&&cur.history)||undefined,historyFull:(cur&&cur.historyFull)||undefined};
                tepN++;
                console.log("[te->ind_data] "+e.country+" "+ind+" = "+e.actual+" ("+e.date+", "+(e.label||ind)+")");
              });
              console.log("ind_data <- TE country pages: "+tepN+" written, "+tepSkip+" skipped (no release date)");
            }catch(err){console.log("ind_data <- TE country pages: nicht nutzbar ("+err.message+")");}
            fs.writeFileSync("ind_data.json",JSON.stringify(out,null,1));
            // Report: welche (ccy|ind) der RULES KEINEN Wert bekamen.
            const ALLCCY=["USD","EUR","GBP","CHF","JPY","CAD","AUD","NZD"];
            const missing=[];
            ALLCCY.forEach(c=>RULES.forEach(r=>{ if(!out[c]||!out[c][r.ind])missing.push(c+" "+r.ind); }));
            console.log("ind_data.json: "+Object.values(out).reduce((n,o)=>n+Object.keys(o).length,0)+" indicator values written");
            console.log("ind_data MISSING ("+missing.length+"): "+missing.join(", "));
            console.log("ind_data <- FF calendar overlay: "+ffOverlaid+" full trio(s) taken from Forex-Factory (TV had no actual)");
            console.log("ind_data <- own forecast kept from previous run: "+keptFc);
            // Gleichquellen-Verifikation: Zaehlung je Quelle (source-Feld).
            const srcCount={};
            Object.keys(out).forEach(ccy=>Object.keys(out[ccy]).forEach(n=>{const s=(out[ccy][n]&&out[ccy][n].source)||"?";srcCount[s]=(srcCount[s]||0)+1;}));
            console.log("ind_data source distribution: "+JSON.stringify(srcCount));
            const noFc=[];
            Object.keys(out).forEach(ccy=>Object.keys(out[ccy]).forEach(n=>{const v=out[ccy][n];if(v.actual!=null&&(v.forecast==null||v.forecast===""))noFc.push(ccy+" "+n+" ("+(v.event||"?")+", "+v.date+")");}));
            console.log("ind_data STILL WITHOUT FORECAST ("+noFc.length+"): "+noFc.join(" | "));
            // ── TITEL-DIAGNOSE (2026-08-08) ────────────────────────────────
            // Der MISSING-Report oben sagt nur DASS eine Regel leer ausging,
            // nicht WARUM. Bei der NZD-Luecke 2026-07-22 war die Ursache, dass
            // die Landesquelle ihre Reihe voellig anders betitelt
            // ("Business NZ PMI" statt "Manufacturing PMI") - das liess sich
            // erst sehen, nachdem die echten TradingView-Titel einmal
            // ausgegeben wurden. Genau diese Ausgabe fehlte seither und wird
            // hier dauerhaft nachgeholt: alle Titel im Themenfeld der aktuell
            // luecken-behafteten Indikatoren, je Waehrung, mit dem Hinweis, ob
            // ein Actual dranhaengt. Kostet nichts (die Events liegen ohnehin
            // schon im Speicher) und macht jede kuenftige Luecke sofort
            // diagnostizierbar, ohne erst einen Extra-Lauf bauen zu muessen.
            const DIAG=/pmi|\bpsi\b|purchasing manag|earnings|wage|ivey|core inflation|producer pric|\bppi\b|employment/;
            const diagSeen={};
            evts.forEach(ev=>{
              const ccy=TV2CCY[ev.country];if(!ccy)return;
              const raw=String(ev.title||ev.indicator||"");
              if(!DIAG.test(norm(raw)))return;
              const k=ccy+"|"+raw;
              const hasA=fmt(ev.actual,ev.unit,ev.scale)!=null;
              if(!diagSeen[k]||(!diagSeen[k].a&&hasA))diagSeen[k]={a:hasA};
            });
            const diagLines=Object.keys(diagSeen).sort().map(k=>k+(diagSeen[k].a?" [actual]":" [kein actual]"));
            console.log("ind_data TITLE DIAG ("+diagLines.length+" distinct):\n  "+diagLines.join("\n  "));
          '

      # ── BOND-HISTORIE BACKFILL (offizielle Gratis-Quellen, ohne Key) ──
      # Fuellt die Zeitreihe fuer Waehrungen, deren Tageshistorie frei und ohne
      # API-Key verfuegbar ist, sofort mit echten Werten (statt ~10 Tage zu
      # "warmlaufen"): USD via US-Treasury-CSV, CAD via Bank of Canada (Valet).
      # Gleiche Messgroesse wie TradingView (Treasury/Benchmark-Rendite), daher
      # keine Methoden-Bruchstelle. Laeuft vor dem TradingView-Schritt; die
      # historischen Tage bleiben erhalten, TradingView ergaenzt nur "heute".
      - name: Backfill bond history (US Treasury + BoC + ECB, no key)
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          YEAR=$(node -e 'console.log(new Date().getUTCFullYear())')
          curl -sL -A "$UA" "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${YEAR}/all?type=daily_treasury_yield_curve&field_tdr_date_value=${YEAR}&page&_format=csv" -o ust.csv || true
          curl -sL -A "$UA" "https://www.bankofcanada.ca/valet/observations/BD.CDN.2YR.DQ.YLD,BD.CDN.10YR.DQ.YLD/json?recent=30" -o boc.json || true
          # EZB-Zinsstrukturkurve (Euroraum AAA), Spot-Rate 2J/10J, taeglich.
          curl -sL -A "$UA" "https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y?format=csvdata&lastNObservations=30" -o ecb2.csv || true
          curl -sL -A "$UA" "https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y?format=csvdata&lastNObservations=30" -o ecb10.csv || true
          node -e '
            const fs=require("fs");
            ["ust.csv","boc.json","ecb2.csv","ecb10.csv"].forEach(f=>{try{const s=fs.readFileSync(f,"utf8");console.log("[debug] "+f+": "+s.length+" bytes, first line: "+JSON.stringify(s.split(/\r?\n/)[0]).slice(0,160));}catch(e){console.log("[debug] "+f+": MISSING");}});
            const SRC={
              "USD|10Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-10-year-bond-yield",
              "USD|2Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-2-year-bond-yield",
              "CAD|10Y Bond Yield":"https://www.investing.com/rates-bonds/canada-10-year-bond-yield",
              "CAD|2Y Bond Yield":"https://www.investing.com/rates-bonds/canada-2-year-bond-yield",
              "EUR|10Y Bond Yield":"https://www.investing.com/rates-bonds/germany-10-year-bond-yield",
              "EUR|2Y Bond Yield":"https://www.investing.com/rates-bonds/germany-2-year-bond-yield"
            };
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            // Historien-Tiefe: siehe Kommentar beim Backfill-Schritt.
            const BOND_KEEP=400;
            function merge(ccy,ind,points){
              if(!points.length)return 0;
              const cur=(out[ccy]&&out[ccy][ind])||{};
              const m=new Map();
              (Array.isArray(cur.series)?cur.series:[]).forEach(e=>{if(e&&e[0])m.set(e[0],String(e[1]));});
              points.forEach(p=>{if(p&&p[0]&&isFinite(Number(p[1])))m.set(p[0],String(Math.round(Number(p[1])*1000)/1000));});
              const series=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-BOND_KEEP).map(e=>[e[0],e[1]]);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[ccy+"|"+ind]||cur.source||"",series:series};
              return points.length;
            }
            // US-Treasury-Tages-CSV: Spalten "Date","1 Mo",...,"2 Yr",...,"10 Yr",...
            // Datum als MM/DD/YYYY. Liefert "2 Yr"/"10 Yr"-Par-Renditen.
            function parseTreasury(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return {p2:[],p10:[]};}
              const lines=csv.split(/\r?\n/).filter(Boolean);
              if(!lines.length)return {p2:[],p10:[]};
              const hdr=lines[0].split(",").map(s=>s.replace(/^"|"$/g,"").trim());
              const di=hdr.indexOf("Date"),i2=hdr.indexOf("2 Yr"),i10=hdr.indexOf("10 Yr");
              const p2=[],p10=[];
              if(di<0||i2<0||i10<0)return {p2:[],p10:[]};
              for(let i=1;i<lines.length;i++){
                const c=lines[i].split(",").map(s=>s.replace(/^"|"$/g,"").trim());
                const m=c[di]&&c[di].match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if(!m)continue;
                const date=m[3]+"-"+m[1]+"-"+m[2];
                const v2=parseFloat(c[i2]),v10=parseFloat(c[i10]);
                if(isFinite(v2))p2.push([date,v2]);
                if(isFinite(v10))p10.push([date,v10]);
              }
              return {p2,p10};
            }
            // EZB-CSV (csvdata): Spalten u.a. TIME_PERIOD (YYYY-MM-DD), OBS_VALUE.
            function parseEcb(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return [];}
              const lines=csv.split(/\r?\n/).filter(Boolean);
              if(lines.length<2)return [];
              const hdr=lines[0].split(",");
              const ti=hdr.indexOf("TIME_PERIOD"),vi=hdr.indexOf("OBS_VALUE");
              if(ti<0||vi<0)return [];
              const pts=[];
              for(let i=1;i<lines.length;i++){
                const c=lines[i].split(",");
                const d=c[ti],v=parseFloat(c[vi]);
                if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isFinite(v))pts.push([d,v]);
              }
              return pts;
            }
            const ust=parseTreasury("ust.csv");
            let usd2=merge("USD","2Y Bond Yield",ust.p2),usd10=merge("USD","10Y Bond Yield",ust.p10);
            let boc=null;try{boc=JSON.parse(fs.readFileSync("boc.json","utf8"));}catch(e){}
            let cad2=0,cad10=0;
            if(boc&&Array.isArray(boc.observations)){
              const k2="BD.CDN.2YR.DQ.YLD",k10="BD.CDN.10YR.DQ.YLD";
              const p2=[],p10=[];
              boc.observations.forEach(o=>{
                if(o[k2]&&o[k2].v!=null&&o[k2].v!=="")p2.push([o.d,parseFloat(o[k2].v)]);
                if(o[k10]&&o[k10].v!=null&&o[k10].v!=="")p10.push([o.d,parseFloat(o[k10].v)]);
              });
              cad2=merge("CAD","2Y Bond Yield",p2);cad10=merge("CAD","10Y Bond Yield",p10);
            }
            let eur2=merge("EUR","2Y Bond Yield",parseEcb("ecb2.csv")),eur10=merge("EUR","10Y Bond Yield",parseEcb("ecb10.csv"));
            if(usd2||usd10||cad2||cad10||eur2||eur10){
              fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
              console.log("bond backfill: USD 2Y="+usd2+"/10Y="+usd10+", CAD 2Y="+cad2+"/10Y="+cad10+", EUR 2Y="+eur2+"/10Y="+eur10+" pts");
            }else{
              console.log("bond backfill: no data from official sources, keeping existing file");
            }
          '
          rm -f ust.csv boc.json ecb2.csv ecb10.csv

      # Zweiter Backfill-Batch: schliesst die verbleibende 25-Tage-Truend-
      # Luecke fuer GBP/JPY/AUD/CHF/NZD (siehe CLAUDE.md Session-Notizen
      # 2026-07-04), alle Quellen offiziell/gratis/ohne API-Key:
      # - Japan: MOF taegliche JGB-Par-Rendite-CSV (feste Spaltenstruktur
      #   seit 1974, gut dokumentiert).
      # - Australien: RBA Tabelle F2 (Capital Market Yields - Government
      #   Bonds - Daily) als CSV.
      # - Schweiz: SNB-Datenportal-API (Cube "rendoblid" = Renditen auf
      #   Obligationen, Tageswerte).
      # - UK: Bank of England Zinsstrukturkurven-Archiv (ZIP mit XLSX-
      #   Arbeitsmappen je Kurventyp) - die "spot curve"-Tabelle enthaelt
      #   Punkte in Halbjahres-Abstaenden, darunter exakt 2J/10J.
      # - Neuseeland: RBNZ B2 "Wholesale interest rates" taegliche XLSX.
      # RBNZ liefert kein CSV, nur XLSX - da keine Node-XLSX-Bibliothek
      # verfuegbar ist (kein npm install im Workflow), wird das XLSX (= ZIP
      # mit XML-Worksheets) per `unzip` entpackt und die Worksheet-XML direkt
      # mit einem kleinen Parser gelesen (kein externes Package noetig).
      # Alle Formate/URLs sind noch ungeprueft (Stand Anlage dieses Schritts)
      # - `continue-on-error` + ausfuehrliches Debug-Logging, damit ein
      # workflow_dispatch-Lauf zeigt, welche Quelle funktioniert und welche
      # ggf. Format-Anpassungen braucht.
      - name: Backfill bond history (Japan MOF + RBA + SNB + RBNZ, no key)
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" "https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv" -o jgb.csv || true
          # MOF-CSV ist Shift-JIS-kodiert (Kopfzeile "1年,2年,...") - nach
          # UTF-8 konvertieren, damit die Spaltensuche per Text ("2年"/"10年")
          # statt auf einen rohen Spaltenindex angewiesen ist (Spaltenanzahl
          # hat sich ueber die 50 Jahre Historie schon mehrfach geaendert).
          iconv -f SHIFT_JIS -t UTF-8//TRANSLIT -c jgb.csv -o jgb_utf8.csv 2>/dev/null || cp jgb.csv jgb_utf8.csv
          curl -sL -A "$UA" "https://www.rba.gov.au/statistics/tables/csv/f2-data.csv" -o rba.csv || true
          SNB_FROM=$(node -e 'console.log(new Date(Date.now()-45*86400e3).toISOString().slice(0,10))')
          curl -sL -A "$UA" "https://data.snb.ch/api/cube/rendoblid/data/csv/en?dimSel=D0(2J,10J0)&fromDate=${SNB_FROM}" -o snb.csv || true
          if [ ! -s snb.csv ]; then
            echo "[debug] snb.csv filtered request empty, falling back to unfiltered endpoint"
            curl -sL -A "$UA" "https://data.snb.ch/api/cube/rendoblid/data/csv/en" -o snb.csv || true
          fi
          # BoE-Zinskurven-ZIP wurde 2026-08-06 ENTFERNT (Nutzer-Entscheid):
          # die Datei enthaelt mehrere gleich aufgebaute Kurven (Spot/Forward/
          # Par) und die Sheet-Heuristik ("nimm das mit den meisten Punkten")
          # konnte sie nicht unterscheiden - sie erwischte regelmaessig die
          # INSTANTANEOUS-FORWARD-Kurve, die am 10Y-Punkt ~120bp ueber der
          # echten Spot-Rendite liegt, und ueberschrieb damit an jedem
          # Handelstag den korrekten TradingView-Wert (GBP 10Y sprang
          # zwischen ~4,9% und ~6,1% hin und her -> verfaelschte GBPs Score).
          # Mehrwert gab es keinen: die Datei enthaelt nur den laufenden
          # Monat, also ~2 Punkte, die TVC:GB10Y/TVC:GB02Y (Schritt weiter
          # unten) ohnehin taeglich liefern - GBP laeuft jetzt wie die
          # anderen 7 Waehrungen rein ueber TradingView.
          curl -sL -A "$UA" "https://www.rbnz.govt.nz/-/media/ReserveBank/Files/Statistics/tables/b2/hb2-daily.xlsx" -o rbnz.xlsx || true
          if [ -s rbnz.xlsx ] && ! head -c 4 rbnz.xlsx | grep -q "PK"; then
            echo "[debug] rbnz.xlsx candidate 1 not a zip/xlsx (likely HTML error page), trying candidate 2"
            curl -sL -A "$UA" "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily-close.xlsx" -o rbnz.xlsx || true
          fi
          if [ -s rbnz.xlsx ] && ! head -c 4 rbnz.xlsx | grep -q "PK"; then
            echo "[debug] rbnz.xlsx candidate 2 not a zip/xlsx either, trying candidate 3"
            curl -sL -A "$UA" "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2.xlsx" -o rbnz.xlsx || true
          fi
          for f in jgb.csv jgb_utf8.csv rba.csv snb.csv rbnz.xlsx; do
            if [ -s "$f" ]; then
              echo "[debug] $f: $(wc -c <"$f" | tr -d ' ') bytes, first line/bytes: $(head -c 200 "$f" | tr -d '\0')"
            else
              echo "[debug] $f: MISSING/EMPTY"
            fi
          done

          node -e '
            const fs=require("fs");
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            const SRC={
              "JPY|10Y Bond Yield":"https://www.investing.com/rates-bonds/japan-10-year-bond-yield",
              "JPY|2Y Bond Yield":"https://www.investing.com/rates-bonds/japan-2-year-bond-yield",
              "AUD|10Y Bond Yield":"https://www.investing.com/rates-bonds/australia-10-year-bond-yield",
              "AUD|2Y Bond Yield":"https://www.investing.com/rates-bonds/australia-2-year-bond-yield",
              "CHF|10Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-10-year-bond-yield",
              "CHF|2Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-2-year-bond-yield",
              "GBP|10Y Bond Yield":"https://www.investing.com/rates-bonds/uk-10-year-bond-yield",
              "GBP|2Y Bond Yield":"https://www.investing.com/rates-bonds/uk-2-year-bond-yield",
              "NZD|10Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-10-years-bond-yield",
              "NZD|2Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-2-years-bond-yield"
            };
            // Historien-Tiefe (2026-08-06 von 35 Tagen / 45 Tagen Cutoff angehoben):
            // die Bond-Signale rechnen mit einer SMA21, dafuer waren ~25
            // Handelstage viel zu knapp - faellt eine Quelle ein paar Tage aus,
            // reicht die Historie fuer die lange SMA nicht mehr und der
            // Indikator faellt auf neutral. 400 Punkte (~18 Monate Handelstage)
            // entspricht der Konvention der uebrigen Reihen (Put/Call nutzt
            // ebenfalls slice(-400)). Der Cutoff begrenzt nur, wie weit
            // ZURUECK eine Quelle beim Nachladen liefern darf.
            const BOND_KEEP=400;
            const CUTOFF=new Date(Date.now()-420*86400000).toISOString().slice(0,10);
            function merge(ccy,ind,points){
              if(!points.length)return 0;
              const cur=(out[ccy]&&out[ccy][ind])||{};
              const m=new Map();
              (Array.isArray(cur.series)?cur.series:[]).forEach(e=>{if(e&&e[0])m.set(e[0],String(e[1]));});
              points.forEach(p=>{if(p&&p[0]&&isFinite(Number(p[1])))m.set(p[0],String(Math.round(Number(p[1])*1000)/1000));});
              const series=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-BOND_KEEP).map(e=>[e[0],e[1]]);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[ccy+"|"+ind]||cur.source||"",series:series};
              return points.length;
            }

            // ── Japan MOF: feste CSV-Spaltenreihenfolge seit 1974 ──────────
            // Kopfzeile (japanisch): Datum,1年,2年,3年,...,10年,15年,... Wird
            // ueber den Spaltentext ("2年"/"10年") gesucht, mit Fallback auf
            // die bekannte feste Position (Index 2 bzw. 10), falls die
            // Kopfzeile aus Encoding-Gruenden nicht matcht.
            function parseJgb(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return {p2:[],p10:[]};}
              const lines=csv.split(/\r?\n/).filter(Boolean);
              if(lines.length<2)return {p2:[],p10:[]};
              // Zeile 0 ist ein Titel ("国債金利情報 ... (単位：％)"), die
              // eigentliche Kopfzeile ("基準日,1年,2年,...") folgt erst
              // danach - erste 5 Zeilen nach "2年"+"10年" absuchen statt
              // blind Zeile 0 zu nehmen.
              let hdrIdx=-1,i2=-1,i10=-1;
              for(let i=0;i<Math.min(5,lines.length);i++){
                const hdr=lines[i].split(",").map(s=>s.trim());
                const c2=hdr.findIndex(h=>/^2年$/.test(h)),c10=hdr.findIndex(h=>/^10年$/.test(h));
                if(c2>=0&&c10>=0){hdrIdx=i;i2=c2;i10=c10;break;}
              }
              if(hdrIdx<0){hdrIdx=0;i2=2;i10=10;}
              const p2=[],p10=[];
              let dateMatched=0,inCutoff=0;
              // Datumsformat ist NICHT gregorianisch, sondern japanische
              // Nengo-Aera: "R8.6.30" = Reiwa 8, 30. Juni = 2026-06-30
              // (Reiwa 1 = 2019 -> gregorianisches Jahr = Aera-Jahr+2018).
              // Aeltere Zeilen (vor 2019) nutzen H(eisei)/S(howa) - fuer
              // unser 45-Tage-Cutoff-Fenster irrelevant, werden einfach
              // uebersprungen (kein Regex-Treffer).
              const ERA_BASE={R:2018,H:1988,S:1925};
              for(let i=hdrIdx+1;i<lines.length;i++){
                const c=lines[i].split(",").map(s=>s.trim());
                const m=c[0]&&c[0].match(/^([RHS])(\d{1,2})\.(\d{1,2})\.(\d{1,2})$/);
                if(!m)continue;
                dateMatched++;
                const base=ERA_BASE[m[1]];
                if(base==null)continue;
                const date=(base+Number(m[2]))+"-"+m[3].padStart(2,"0")+"-"+m[4].padStart(2,"0");
                if(date<CUTOFF)continue;
                inCutoff++;
                const v2=parseFloat(c[i2]),v10=parseFloat(c[i10]);
                if(isFinite(v2))p2.push([date,v2]);
                if(isFinite(v10))p10.push([date,v10]);
              }
              console.log("JGB: "+(lines.length-hdrIdx-1)+" candidate rows, "+dateMatched+" date-matched, "+inCutoff+" within cutoff ("+CUTOFF+"); last line raw: "+JSON.stringify(lines[lines.length-1]));
              console.log("JGB: header row "+hdrIdx+" (col2="+i2+" col10="+i10+"), "+p2.length+"/"+p10.length+" pts in window");
              return {p2,p10};
            }
            const jgb=parseJgb("jgb_utf8.csv");
            const jpy2=merge("JPY","2Y Bond Yield",jgb.p2),jpy10=merge("JPY","10Y Bond Yield",jgb.p10);

            // ── RBA: Tabelle F2, Format mit mehreren Metadaten-Zeilen vor
            // den Datenzeilen. Statt fester Zeilen-/Spaltenindizes (koennen
            // sich aendern) wird die "Title"-Zeile nach Spalten mit
            // "Government"+"2 year"/"10 year" im Namen durchsucht, und der
            // Beginn der Datenzeilen ueber ein Datumsmuster in Spalte 1
            // erkannt (robust gegen Metadaten-Zeilenanzahl).
            function parseRba(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return {p2:[],p10:[]};}
              const rows=csv.split(/\r?\n/).filter(Boolean).map(l=>l.split(",").map(s=>s.replace(/^"|"$/g,"").trim()));
              if(!rows.length)return {p2:[],p10:[]};
              let i2=-1,i10=-1;
              rows.forEach(r=>{
                r.forEach((cell,ci)=>{
                  const c=cell.toLowerCase();
                  if(!/government/.test(c))return;
                  if(i2<0&&/2[\s-]*year/.test(c))i2=ci;
                  if(i10<0&&/10[\s-]*year/.test(c))i10=ci;
                });
              });
              if(i2<0||i10<0)return {p2:[],p10:[]};
              const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
              function parseDate(s){
                let m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
                if(m&&MON[m[2].toLowerCase()]!=null)return m[3]+"-"+String(MON[m[2].toLowerCase()]+1).padStart(2,"0")+"-"+m[1].padStart(2,"0");
                m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if(m)return s;
                m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
                return null;
              }
              const p2=[],p10=[];
              rows.forEach(r=>{
                const date=parseDate(r[0]||"");
                if(!date||date<CUTOFF)return;
                const v2=parseFloat(r[i2]),v10=parseFloat(r[i10]);
                if(isFinite(v2))p2.push([date,v2]);
                if(isFinite(v10))p10.push([date,v10]);
              });
              return {p2,p10};
            }
            const rba=parseRba("rba.csv");
            const aud2=merge("AUD","2Y Bond Yield",rba.p2),aud10=merge("AUD","10Y Bond Yield",rba.p10);

            // ── SNB Datenportal (Cube "rendoblid" = Renditen auf
            // Obligationen, Tag): unterstuetzt sowohl Long-Format (eigene
            // Dimensions-Spalte mit Laufzeit-Code, z.B. "2J" oder "10J0") als auch
            // Wide-Format (eine Spalte je Laufzeit) - beides wird versucht.
            function parseSnb(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return {p2:[],p10:[]};}
              // BOM entfernen, dann Header dynamisch suchen: SNB-Exporte
              // haben teils eine leere/BOM-only erste Zeile vor dem echten
              // Header - Zeile 0 blind als Header zu nehmen liefert dann 0
              // Treffer (beobachtet in einem workflow_dispatch-Testlauf).
              csv=csv.replace(/^﻿/,"");
              const rawLines=csv.split(/\r?\n/);
              const delim=(rawLines.find(l=>l.trim())||"").includes(";")?";":",";
              const rows=rawLines.map(l=>l.split(delim).map(s=>s.replace(/^"|"$/g,"").trim())).filter(r=>r.some(c=>c));
              if(rows.length<2)return {p2:[],p10:[]};
              // SNB-CSV-Exporte haben mehrere Metadaten-Zeilen ("CubeId",...)
              // vor dem echten Tabellenkopf - die erste nicht-leere Zeile ist
              // NICHT zuverlaessig der Header (traf im 2. Testlauf auf
              // ["CubeId","rendoblid"]). Stattdessen die ersten 20 Zeilen als
              // Header-Kandidaten pruefen und die erste nehmen, die
              // tatsaechlich Date/Dimension/Value- oder 2J/10J0-Spalten hat.
              let hdrIdx=-1,di=-1,dimI=-1,valI=-1,wideC2=-1,wideC10=-1;
              for(let i=0;i<Math.min(20,rows.length);i++){
                const h=rows[i].map(c=>c.toLowerCase());
                const cDi=h.findIndex(c=>/date/.test(c));
                const cDimI=h.findIndex(c=>c==="d0"||c==="dimension"||c==="series");
                const cValI=h.findIndex(c=>c==="value"||c==="obs_value"||c==="wert");
                const cC2=h.findIndex(c=>/^2j$/.test(c)),cC10=h.findIndex(c=>/^0*10j0$/.test(c));
                if((cDi>=0&&cDimI>=0&&cValI>=0)||cC2>=0||cC10>=0){
                  hdrIdx=i;di=cDi;dimI=cDimI;valI=cValI;wideC2=cC2;wideC10=cC10;break;
                }
              }
              if(hdrIdx<0){console.log("SNB: no usable header found in first 20 rows (row0="+JSON.stringify(rows[0])+")");return {p2:[],p10:[]};}
              console.log("SNB: header row "+hdrIdx+": "+JSON.stringify(rows[hdrIdx])+", first data rows: "+JSON.stringify(rows.slice(hdrIdx+1,hdrIdx+4))+", LAST rows (most recent): "+JSON.stringify(rows.slice(-8)));
              const p2=[],p10=[];
              if(di>=0&&dimI>=0&&valI>=0){
                const seenDim=new Set();
                for(let i=hdrIdx+1;i<rows.length;i++){
                  const r=rows[i];
                  const date=(r[di]||"").slice(0,10);
                  const dimRaw=(r[dimI]||"");
                  if(seenDim.size<25)seenDim.add(dimRaw);
                  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<CUTOFF)continue;
                  const dim=dimRaw.toLowerCase();
                  const v=parseFloat(r[valI]);
                  if(!isFinite(v))continue;
                  if(/^2j$/.test(dim))p2.push([date,v]);
                  if(/^0*10j0$/.test(dim))p10.push([date,v]);
                }
                if(p2.length||p10.length){console.log("SNB: long-format match, "+p2.length+"/"+p10.length+" pts");return {p2,p10};}
                console.log("SNB: long-format columns found but 0 pts matched; distinct D0 values seen: "+JSON.stringify([...seenDim]));
              }
              // Wide-Format-Fallback: Spalten direkt nach Laufzeit-Code suchen.
              const c2=wideC2,c10=wideC10;
              const dCol=di>=0?di:0;
              if(c2>=0||c10>=0){
                for(let i=hdrIdx+1;i<rows.length;i++){
                  const r=rows[i];
                  const date=(r[dCol]||"").slice(0,10);
                  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<CUTOFF)continue;
                  if(c2>=0){const v=parseFloat(r[c2]);if(isFinite(v))p2.push([date,v]);}
                  if(c10>=0){const v=parseFloat(r[c10]);if(isFinite(v))p10.push([date,v]);}
                }
                console.log("SNB: wide-format match (c2="+c2+" c10="+c10+"), "+p2.length+"/"+p10.length+" pts");
              }else{
                console.log("SNB: no date/dimension/value or 2J/10J0 columns found in header");
              }
              return {p2,p10};
            }
            const snb=parseSnb("snb.csv");
            const chf2=merge("CHF","2Y Bond Yield",snb.p2),chf10=merge("CHF","10Y Bond Yield",snb.p10);

            fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
            console.log("bond backfill (CSV sources): JPY 2Y="+jpy2+"/10Y="+jpy10+", AUD 2Y="+aud2+"/10Y="+aud10+", CHF 2Y="+chf2+"/10Y="+chf10+" pts");
          '

          # ── RBNZ (NZD): XLSX-Datei, keine CSV verfuegbar. Kein npm/Node-
          # XLSX-Paket im Workflow (kein package.json/Install-Schritt) -
          # stattdessen XLSX (= ZIP-Container mit XML-Worksheets) per `unzip`
          # (auf ubuntu-latest vorinstalliert) entpacken und die Worksheet-XML
          # mit einem kleinen Inline-Parser lesen. (Der frueher hier ebenfalls
          # entpackte BoE-Block ist 2026-08-06 entfallen, siehe Begruendung
          # beim Download weiter oben.)
          if [ -s rbnz.xlsx ]; then
            unzip -o -q rbnz.xlsx -d rbnz_xlsx 2>&1 | head -20 || true
            echo "[debug] rbnz.xlsx sheets: $(ls rbnz_xlsx/xl/worksheets 2>/dev/null | tr '\n' '|')"
          else
            echo "[debug] rbnz.xlsx missing/empty, skipping RBNZ"
          fi

          node -e '
            const fs=require("fs");
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            const SRC={
              "GBP|10Y Bond Yield":"https://www.investing.com/rates-bonds/uk-10-year-bond-yield",
              "GBP|2Y Bond Yield":"https://www.investing.com/rates-bonds/uk-2-year-bond-yield",
              "NZD|10Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-10-years-bond-yield",
              "NZD|2Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-2-years-bond-yield"
            };
            // Historien-Tiefe (2026-08-06 von 35 Tagen / 45 Tagen Cutoff angehoben):
            // die Bond-Signale rechnen mit einer SMA21, dafuer waren ~25
            // Handelstage viel zu knapp - faellt eine Quelle ein paar Tage aus,
            // reicht die Historie fuer die lange SMA nicht mehr und der
            // Indikator faellt auf neutral. 400 Punkte (~18 Monate Handelstage)
            // entspricht der Konvention der uebrigen Reihen (Put/Call nutzt
            // ebenfalls slice(-400)). Der Cutoff begrenzt nur, wie weit
            // ZURUECK eine Quelle beim Nachladen liefern darf.
            const BOND_KEEP=400;
            const CUTOFF=new Date(Date.now()-420*86400000).toISOString().slice(0,10);
            function merge(ccy,ind,points){
              if(!points.length)return 0;
              const cur=(out[ccy]&&out[ccy][ind])||{};
              const m=new Map();
              (Array.isArray(cur.series)?cur.series:[]).forEach(e=>{if(e&&e[0])m.set(e[0],String(e[1]));});
              points.forEach(p=>{if(p&&p[0]&&isFinite(Number(p[1])))m.set(p[0],String(Math.round(Number(p[1])*1000)/1000));});
              const series=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-BOND_KEEP).map(e=>[e[0],e[1]]);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[ccy+"|"+ind]||cur.source||"",series:series};
              return points.length;
            }
            function colToNum(letters){let n=0;for(let k=0;k<letters.length;k++)n=n*26+(letters.charCodeAt(k)-64);return n;}
            // Liest ein XLSX-Worksheet-XML in ein sparses {row:{col:{v,isStr}}}.
            function readSheet(xmlPath){
              let xml;try{xml=fs.readFileSync(xmlPath,"utf8");}catch(e){return {};}
              const rows={};
              const rowRe=/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
              const cellRe=/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
              let rm;
              while((rm=rowRe.exec(xml))){
                const rIdx=Number(rm[1]);
                const cols={};
                let cm;cellRe.lastIndex=0;
                while((cm=cellRe.exec(rm[2]))){
                  const col=colToNum(cm[1]);
                  const attrs=cm[2]||"";
                  const inner=cm[3]||"";
                  const isStr=/t="s"/.test(attrs);
                  const vm=inner.match(/<v>([^<]*)<\/v>/);
                  if(!vm)continue;
                  cols[col]=isStr?{str:vm[1]}:{num:parseFloat(vm[1])};
                }
                rows[rIdx]=cols;
              }
              return rows;
            }
            function readSharedStrings(dir){
              let xml;try{xml=fs.readFileSync(dir+"/xl/sharedStrings.xml","utf8");}catch(e){return [];}
              const out=[];
              const siRe=/<si>([\s\S]*?)<\/si>/g;
              let m;
              while((m=siRe.exec(xml))){
                const text=[...m[1].matchAll(/<t[^>]*>([^<]*)<\/t>/g)].map(x=>x[1]).join("");
                out.push(text);
              }
              return out;
            }
            function resolveStr(cell,shared){return cell&&cell.str!=null?(shared[Number(cell.str)]||""):null;}
            function excelDateToIso(serial){
              const ms=Math.round((serial-25569)*86400*1000);
              const d=new Date(ms);
              if(isNaN(d))return null;
              return d.toISOString().slice(0,10);
            }

            // (Der BoE-Block, der hier fruehe die GBP-Zinskurve aus der
            // Bank-of-England-XLSX gelesen hat, ist 2026-08-06 entfernt
            // worden - er erwischte die falsche Kurve und verfaelschte
            // GBP 10Y. Siehe ausfuehrliche Begruendung beim Download.)
            let gbp2=0,gbp10=0;

            // ── RBNZ: Spaltenkoepfe sind Text (Shared Strings) - Header-
            // Zeile per Volltextsuche nach "2 year"/"10 year"+"government"
            // finden, Datenzeilen ab der ersten Zeile mit gueltigem Excel-
            // Datum in Spalte A.
            let nzd2=0,nzd10=0;
            try{
              const shared=readSharedStrings("rbnz_xlsx");
              const dir="rbnz_xlsx/xl/worksheets";
              const files=fs.readdirSync(dir).filter(f=>/\.xml$/.test(f));
              for(const f of files){
                const rows=readSheet(dir+"/"+f);
                let col2=null,col10=null;
                Object.keys(rows).forEach(rIdx=>{
                  const cols=rows[rIdx];
                  Object.keys(cols).forEach(ci=>{
                    const s=resolveStr(cols[ci],shared);
                    if(s==null)return;
                    const low=s.toLowerCase();
                    if(!/government|nzgb|bond/.test(low))return;
                    if(col2==null&&/2[\s-]*year|2yr/.test(low))col2=Number(ci);
                    if(col10==null&&/10[\s-]*year|10yr/.test(low))col10=Number(ci);
                  });
                });
                if(col2==null&&col10==null)continue;
                const p2=[],p10=[];
                Object.keys(rows).forEach(rIdx=>{
                  const cols=rows[rIdx];
                  const dateCell=cols[1];
                  if(!dateCell||dateCell.num==null||dateCell.num<30000||dateCell.num>60000)return;
                  const date=excelDateToIso(dateCell.num);
                  if(!date||date<CUTOFF)return;
                  if(col2!=null){const c=cols[col2];if(c&&c.num!=null)p2.push([date,c.num]);}
                  if(col10!=null){const c=cols[col10];if(c&&c.num!=null)p10.push([date,c.num]);}
                });
                if(p2.length||p10.length){
                  nzd2=merge("NZD","2Y Bond Yield",p2);nzd10=merge("NZD","10Y Bond Yield",p10);
                  console.log("RBNZ: matched sheet "+f+" (col2="+col2+" col10="+col10+")");
                  break;
                }
              }
              if(!nzd2&&!nzd10)console.log("RBNZ: no sheet with a 2-year/10-year government bond column found");
            }catch(e){console.log("RBNZ: unavailable ("+e.message+")");}

            fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
            console.log("bond backfill (XLSX sources): GBP 2Y="+gbp2+"/10Y="+gbp10+", NZD 2Y="+nzd2+"/10Y="+nzd10+" pts");
          '
          rm -f jgb.csv jgb_utf8.csv rba.csv snb.csv rbnz.xlsx
          rm -rf rbnz_xlsx

      # ── ANLEIHERENDITEN (bond_data.json) ──────────────────────────────
      # 2J-/10J-Staatsanleiherenditen je Waehrung von TradingViews Scanner-API
      # (auf den Runnern erreichbar; Stooq/investing.com liefern Cloud-IPs nur
      # eine JS-Challenge bzw. 403). Pro Lauf wird der aktuelle Wert je Reihe
      # mit dem heutigen UTC-Datum in eine rollierende Zeitreihe (letzte ~35
      # Eintraege) geschrieben (gleiches Datum wird ueberschrieben). Daraus
      # baut der Browser Actual (letzter Wert <= gestern) und Previous (letzter
      # Wert <= Actual-Datum minus 10 Tage) samt Faerbung. Schlaegt der Abruf
      # fehl, bleibt die bestehende Reihe erhalten.
      - name: Fetch government bond yields (TradingView) -> bond_data.json
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data '{"symbols":{"tickers":["TVC:US10Y","TVC:US02Y","TVC:DE10Y","TVC:DE02Y","TVC:GB10Y","TVC:GB02Y","TVC:CH10Y","TVC:CH02Y","TVC:JP10Y","TVC:JP02Y","TVC:CA10Y","TVC:CA02Y","TVC:AU10Y","TVC:AU02Y","TVC:NZ10Y","TVC:NZ02Y"],"query":{"types":[]}},"columns":["close"]}' \
            "https://scanner.tradingview.com/global/scan" -o bond_tv.json || true
          echo "=== TradingView scanner response (first 500 chars) ==="
          head -c 500 bond_tv.json 2>/dev/null || echo "(missing)"
          echo
          node -e '
            const fs=require("fs");
            // TVC-Ticker -> "CCY|Laufzeit" (Indikatorname in der App).
            const MAP={
              "TVC:US10Y":"USD|10Y Bond Yield","TVC:US02Y":"USD|2Y Bond Yield",
              "TVC:DE10Y":"EUR|10Y Bond Yield","TVC:DE02Y":"EUR|2Y Bond Yield",
              "TVC:GB10Y":"GBP|10Y Bond Yield","TVC:GB02Y":"GBP|2Y Bond Yield",
              "TVC:CH10Y":"CHF|10Y Bond Yield","TVC:CH02Y":"CHF|2Y Bond Yield",
              "TVC:JP10Y":"JPY|10Y Bond Yield","TVC:JP02Y":"JPY|2Y Bond Yield",
              "TVC:CA10Y":"CAD|10Y Bond Yield","TVC:CA02Y":"CAD|2Y Bond Yield",
              "TVC:AU10Y":"AUD|10Y Bond Yield","TVC:AU02Y":"AUD|2Y Bond Yield",
              "TVC:NZ10Y":"NZD|10Y Bond Yield","TVC:NZ02Y":"NZD|2Y Bond Yield"
            };
            // Investing.com-Quelle je Reihe (Fallback; die App bevorzugt ihren
            // kuratierten Link).
            const SRC={
              "USD|10Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-10-year-bond-yield",
              "USD|2Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-2-year-bond-yield",
              "EUR|10Y Bond Yield":"https://www.investing.com/rates-bonds/germany-10-year-bond-yield",
              "EUR|2Y Bond Yield":"https://www.investing.com/rates-bonds/germany-2-year-bond-yield",
              "GBP|10Y Bond Yield":"https://www.investing.com/rates-bonds/uk-10-year-bond-yield",
              "GBP|2Y Bond Yield":"https://www.investing.com/rates-bonds/uk-2-year-bond-yield",
              "CHF|10Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-10-year-bond-yield",
              "CHF|2Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-2-year-bond-yield",
              "JPY|10Y Bond Yield":"https://www.investing.com/rates-bonds/japan-10-year-bond-yield",
              "JPY|2Y Bond Yield":"https://www.investing.com/rates-bonds/japan-2-year-bond-yield",
              "CAD|10Y Bond Yield":"https://www.investing.com/rates-bonds/canada-10-year-bond-yield",
              "CAD|2Y Bond Yield":"https://www.investing.com/rates-bonds/canada-2-year-bond-yield",
              "AUD|10Y Bond Yield":"https://www.investing.com/rates-bonds/australia-10-year-bond-yield",
              "AUD|2Y Bond Yield":"https://www.investing.com/rates-bonds/australia-2-year-bond-yield",
              "NZD|10Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-10-years-bond-yield",
              "NZD|2Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-2-years-bond-yield"
            };
            const today=new Date().toISOString().slice(0,10);
            let resp;
            try{resp=JSON.parse(fs.readFileSync("bond_tv.json","utf8"));}catch(e){console.log("bond_data: TradingView response unreadable, keeping existing file ("+e.message+")");process.exit(0);}
            const rows=resp&&Array.isArray(resp.data)?resp.data:null;
            if(!rows){console.log("bond_data: unexpected TradingView shape, keeping existing file");process.exit(0);}
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            // Historien-Tiefe: siehe Kommentar beim Backfill-Schritt.
            const BOND_KEEP=400;
            let okN=0;const miss=[];
            rows.forEach(r=>{
              const key=MAP[r.s];if(!key)return;
              const v=r.d&&r.d[0];
              if(v==null||!isFinite(Number(v))){miss.push(r.s);return;}
              const val=String(Math.round(Number(v)*1000)/1000);
              const [ccy,ind]=key.split("|");
              const cur=(out[ccy]&&out[ccy][ind])||{};
              let series=Array.isArray(cur.series)?cur.series.filter(e=>e&&e[0]!==today):[];
              series.push([today,val]);
              series.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              series=series.slice(-BOND_KEEP);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[key]||cur.source||"",series:series};
              okN++;
            });
            // Reihen, die diesmal fehlten, aber bereits existieren, bleiben erhalten.
            const wantMiss=Object.keys(MAP).map(k=>MAP[k]).filter(key=>{const[c,i]=key.split("|");return !(out[c]&&out[c][i]);});
            if(okN>0){
              fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
              console.log("bond_data.json: "+okN+"/16 series appended for "+today+(miss.length?" [no value: "+miss.join(", ")+"]":"")+(wantMiss.length?" [never seen: "+wantMiss.join(", ")+"]":""));
            }else{
              console.log("bond_data: no usable values from TradingView, keeping existing file"+(miss.length?" [no value: "+miss.join(", ")+"]":""));
            }
          '
          rm -f bond_tv.json

      # ── ASSET-PREISE (price_data.json) ────────────────────────────────
      # Fuer den "Score vs Price"-Chart im Trends-Tab: pro Waehrung/Asset ein
      # taeglicher Schlusskurs (TradingView-Scanner, gleiche Quelle wie die
      # Anleiherenditen oben). Waehrungen werden ueber ihr liquidestes
      # USD-Paar abgebildet (kein eigener "Preis" fuer eine Waehrung an sich);
      # bei Paaren, die als USD/XXX notieren (JPY/CHF/CAD), steigt der Kurs,
      # wenn die Waehrung SCHWAECHER wird - "invert" markiert das, damit der
      # Browser fuers Chart auf "hoeher = staerker" umdreht (konsistent mit
      # der Score-Richtung). USD selbst nutzt den Dollar-Index (DXY).
      - name: Fetch asset/FX prices (TradingView) -> price_data.json
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data '{"symbols":{"tickers":["TVC:DXY","FX:EURUSD","FX:GBPUSD","FX:USDCHF","FX:USDJPY","FX:USDCAD","FX:AUDUSD","FX:NZDUSD","TVC:GOLD","TVC:SILVER","NYMEX:CL1!","COINBASE:BTCUSD","SP:SPX","NASDAQ:NDX","TVC:DEU40","NASDAQ:AMZN","NASDAQ:NVDA"],"query":{"types":[]}},"columns":["close"]}' \
            "https://scanner.tradingview.com/global/scan" -o price_tv.json || true
          echo "=== TradingView scanner response (first 500 chars) ==="
          head -c 500 price_tv.json 2>/dev/null || echo "(missing)"
          echo
          node -e '
            const fs=require("fs");
            // TVC/FX-Ticker -> {id, invert}. invert=true: Kurs faellt, wenn die
            // Waehrung STAERKER wird (USD/XXX-Notierung) - Anzeige dreht das um.
            const MAP={
              "TVC:DXY":{id:"USD",invert:false},
              "FX:EURUSD":{id:"EUR",invert:false},
              "FX:GBPUSD":{id:"GBP",invert:false},
              "FX:USDCHF":{id:"CHF",invert:true},
              "FX:USDJPY":{id:"JPY",invert:true},
              "FX:USDCAD":{id:"CAD",invert:true},
              "FX:AUDUSD":{id:"AUD",invert:false},
              "FX:NZDUSD":{id:"NZD",invert:false},
              "TVC:GOLD":{id:"GOLD",invert:false},
              "TVC:SILVER":{id:"SILVER",invert:false},
              "NYMEX:CL1!":{id:"OIL",invert:false},
              "COINBASE:BTCUSD":{id:"BTC",invert:false},
              "SP:SPX":{id:"SP500",invert:false},
              "NASDAQ:NDX":{id:"NAS",invert:false},
              "TVC:DEU40":{id:"DAX",invert:false},
              // Einzelaktien ergaenzt 2026-08-08 (Audit-Fund: AMZN/NVDA waren
              // in der App gelistet, hatten aber keinerlei Preisreihe - in
              // Performance-Ranking, Watchlist, Ticker und Volatilitaet
              // erschienen sie deshalb dauerhaft als "-").
              "NASDAQ:AMZN":{id:"AMZN",invert:false},
              "NASDAQ:NVDA":{id:"NVDA",invert:false}
            };
            const SRC={
              USD:"https://www.tradingview.com/symbols/TVC-DXY/",
              EUR:"https://www.tradingview.com/symbols/EURUSD/",
              GBP:"https://www.tradingview.com/symbols/GBPUSD/",
              CHF:"https://www.tradingview.com/symbols/USDCHF/",
              JPY:"https://www.tradingview.com/symbols/USDJPY/",
              CAD:"https://www.tradingview.com/symbols/USDCAD/",
              AUD:"https://www.tradingview.com/symbols/AUDUSD/",
              NZD:"https://www.tradingview.com/symbols/NZDUSD/",
              GOLD:"https://www.tradingview.com/symbols/TVC-GOLD/",
              SILVER:"https://www.tradingview.com/symbols/TVC-SILVER/",
              OIL:"https://www.tradingview.com/symbols/NYMEX-CL1!/",
              BTC:"https://www.tradingview.com/symbols/BTCUSD/",
              SP500:"https://www.tradingview.com/symbols/SPX/",
              NAS:"https://www.tradingview.com/symbols/NDX/",
              DAX:"https://www.tradingview.com/symbols/TVC-DEU40/",
              AMZN:"https://www.tradingview.com/symbols/NASDAQ-AMZN/",
              NVDA:"https://www.tradingview.com/symbols/NASDAQ-NVDA/"
            };
            const today=new Date().toISOString().slice(0,10);
            let resp;
            try{resp=JSON.parse(fs.readFileSync("price_tv.json","utf8"));}catch(e){console.log("price_data: TradingView response unreadable, keeping existing file ("+e.message+")");process.exit(0);}
            const rows=resp&&Array.isArray(resp.data)?resp.data:null;
            if(!rows){console.log("price_data: unexpected TradingView shape, keeping existing file");process.exit(0);}
            let out={};
            try{const d=JSON.parse(fs.readFileSync("price_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            let okN=0;const miss=[];
            rows.forEach(r=>{
              const m=MAP[r.s];if(!m)return;
              const v=r.d&&r.d[0];
              if(v==null||!isFinite(Number(v))){miss.push(r.s);return;}
              const val=Number(v);
              const cur=out[m.id]||{};
              let series=Array.isArray(cur.series)?cur.series.filter(e=>e&&e[0]!==today):[];
              series.push([today,val]);
              series.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              // 2026-08-07 von 100 auf 1100 Punkte (~3 Jahre Handelstage)
              // angehoben: der Yahoo-Backfill-Schritt weiter unten laedt
              // 3 Jahre Tageskurse nach, die hier sonst sofort wieder
              // abgeschnitten wuerden. Basis fuer Performance-Ranking,
              // Korrelationen und die Marktrelevanz-Gewichtung.
              series=series.slice(-1100);
              out[m.id]={source:SRC[m.id]||cur.source||"",invert:m.invert,series:series};
              okN++;
            });
            const wantMiss=Object.keys(MAP).filter(k=>!out[MAP[k].id]);
            if(okN>0){
              fs.writeFileSync("price_data.json",JSON.stringify(out,null,1));
              console.log("price_data.json: "+okN+"/"+Object.keys(MAP).length+" series appended for "+today+(miss.length?" [no value: "+miss.join(", ")+"]":"")+(wantMiss.length?" [never seen: "+wantMiss.join(", ")+"]":""));
            }else{
              console.log("price_data: no usable values from TradingView, keeping existing file"+(miss.length?" [no value: "+miss.join(", ")+"]":""));
            }
          '
          rm -f price_tv.json

      # ── MARKT-SENTIMENT (sentiment_data.json) ─────────────────────────
      # Contrarian-Positionierungs-/Stimmungsdaten fuer Krypto (BTC) und
      # Aktienindizes (SP500/NAS): Crypto Fear & Greed (alternative.me, sehr
      # stabile JSON-API), Stock Fear & Greed (CNN), VIX und CBOE Put/Call
      # (TradingView-Scanner, dieselbe erprobte Quelle wie price_data). Alle
      # mit Carry-over aus der vorherigen sentiment_data.json (Serie
      # fortschreiben); EINE fehlende Quelle darf die anderen NICHT kippen
      # (jede Quelle in eigenem try/catch). continue-on-error, damit ein
      # Ausfall den Gesamt-Workflow nicht rot faerbt.
      - name: Fetch market sentiment -> sentiment_data.json
        continue-on-error: true
        env:
          # Optional: Myfxbook-Login fuer Retail-Positionierung. Ohne diese
          # Secrets bleibt der Retail-Chart leer (alle anderen Quellen laufen
          # unabhaengig). Secrets anlegen: Repo -> Settings -> Secrets and
          # variables -> Actions -> New repository secret: MYFXBOOK_EMAIL und
          # MYFXBOOK_PASSWORD.
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL "https://api.alternative.me/fng/?limit=90&format=json" -o sent_cfng.json || true
          # CNN blockt Datacenter-IPs teils per HTTP 418 ("teapot"); bessere
          # Browser-Header (Accept/Referer/Origin) sind ein guenstiger Versuch,
          # aendern aber nichts, wenn der Block rein IP-basiert ist. Der Schritt
          # degradiert sauber (stockFng bleibt dann leer; VIX scort die Indizes).
          curl -sL -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Referer: https://www.cnn.com/markets/fear-and-greed" -H "Origin: https://www.cnn.com" "https://production.dataviz.cnn.io/index/fearandgreed/graphdata" -o sent_sfng.json || true
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data '{"symbols":{"tickers":["CBOE:VIX","USI:PC","USI:PCC"],"query":{"types":[]}},"columns":["close"]}' \
            "https://scanner.tradingview.com/global/scan" -o sent_tv.json || true
          # Put/Call-Ratio von der OCC (Options Clearing Corp.) - Endstand der
          # 5-Runden-Quellen-Suche 2026-07-11: CBOEs freie Feeds sind tot
          # (delayed-quotes kennt kein _PCC (403), totalpc.csv ist ein
          # eingefrorenes Archiv bis 2019-10-04, die daily-Seite ist eine
          # Client-Shell hinter nicht oeffentlichen Endpunkten). Die OCC
          # liefert dagegen offiziell die taeglichen Call/Put-Volumina ALLER
          # US-Optionsboersen als JSON - Parameter heisst report_date
          # (snake_case; reportDate/camelCase gibt 400!). Wochenende/Feiertage
          # abfangen: bis 5 Tage rueckwaerts den juengsten Handelstag suchen.
          # Datum des Reports in sent_occ_date.txt fuer das Node-Skript.
          rm -f sent_occ.json sent_occ_date.txt
          for back in 1 2 3 4 5; do
            D=$(date -u -d "-${back} day" +%Y-%m-%d)
            curl -sL --max-time 25 -A "$UA" -H "Accept: application/json" "https://marketdata.theocc.com/mdapi/daily-volume-totals?report_date=${D}" -o sent_occ.json || true
            if node -e 'try{const j=JSON.parse(require("fs").readFileSync("sent_occ.json","utf8"));const a=j&&j.entity&&j.entity.total_volume;process.exit(Array.isArray(a)&&a.length?0:1);}catch(e){process.exit(1);}'; then
              echo "$D" > sent_occ_date.txt
              echo "[debug] OCC put/call: report_date=$D ($(wc -c < sent_occ.json) bytes)"
              break
            fi
            echo "[debug] OCC put/call: $D no data ($(head -c 80 sent_occ.json 2>/dev/null | tr '\n' ' '))"
          done
          # Retail-Positionierung von Myfxbook ueber die offizielle API:
          # login.json (Session-Token) -> get-community-outlook.json (JSON mit
          # long/short je Symbol). Nur wenn beide Secrets gesetzt sind.
          if [ -n "$MYFXBOOK_EMAIL" ] && [ -n "$MYFXBOOK_PASSWORD" ]; then
            EMAIL_ENC=$(node -e 'console.log(encodeURIComponent(process.env.MYFXBOOK_EMAIL))')
            PASS_ENC=$(node -e 'console.log(encodeURIComponent(process.env.MYFXBOOK_PASSWORD))')
            # Cookie-Jar mitfuehren: Myfxbook bindet die API-Session teils an
            # ein Cookie, nicht nur an den session-Query-Param ("Invalid
            # session" trotz frischem Login). Debug zeigt error/message/Laenge
            # (NICHT die Session selbst).
            curl -sL -A "$UA" -c mfx_cookies.txt "https://www.myfxbook.com/api/login.json?email=${EMAIL_ENC}&password=${PASS_ENC}" -o sent_mfxlogin.json || true
            echo "[debug] Myfxbook login: $(node -e 'try{const j=JSON.parse(require("fs").readFileSync("sent_mfxlogin.json","utf8"));console.log("error="+j.error+" msg="+JSON.stringify(j.message||"")+" sessionLen="+String(j.session||"").length);}catch(e){console.log("unparseable: "+require("fs").readFileSync("sent_mfxlogin.json","utf8").slice(0,140));}' 2>/dev/null)"
            SESSION=$(node -e 'try{const j=JSON.parse(require("fs").readFileSync("sent_mfxlogin.json","utf8"));process.stdout.write(j&&!j.error&&j.session?String(j.session):"");}catch(e){}' 2>/dev/null)
            if [ -n "$SESSION" ]; then
              SESS_ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$SESSION")
              # Diagnose (leakt den Token NICHT): welche Sonderzeichen-Klassen
              # enthaelt der Session-Token? Wenn rein alphanumerisch, ist ein
              # Encoding-Problem AUSGESCHLOSSEN und "Invalid session" ist ein
              # Account-/API-seitiges Thema, nicht das Query-Encoding.
              echo "[debug] Myfxbook session charclasses: $(node -e 'const s=process.argv[1];console.log((/[+]/.test(s)?"plus ":"")+(/[/]/.test(s)?"slash ":"")+(/=/.test(s)?"eq ":"")+(/[^A-Za-z0-9+/=]/.test(s)?"other":"")||"alnum-only")' "$SESSION" 2>/dev/null)"
              # VERIFIZIERT 2026-07-11: der Session-Token enthaelt Sonderzeichen
              # ("charclasses: other") und Myfxbook dekodiert den session-Query-
              # Param NICHT - er muss also ROH uebergeben werden. Mit
              # encodeURIComponent bzw. curl --data-urlencode kommt "Invalid
              # session", roh liefert die 186 Symbole. Reihenfolge daher:
              # (1) roh (der funktionierende Weg zuerst), (2) --data-urlencode,
              # (3) encodeURIComponent - als Fallbacks, falls Myfxbook das
              # Verhalten je aendert.
              for attempt in 1 2 3; do
                case "$attempt" in
                  1) curl -sL -A "$UA" -b mfx_cookies.txt -c mfx_cookies.txt "https://www.myfxbook.com/api/get-community-outlook.json?session=${SESSION}" -o sent_retail.json || true ;;
                  2) curl -sL -A "$UA" -b mfx_cookies.txt -c mfx_cookies.txt -G --data-urlencode "session=${SESSION}" "https://www.myfxbook.com/api/get-community-outlook.json" -o sent_retail.json || true ;;
                  *) curl -sL -A "$UA" -b mfx_cookies.txt -c mfx_cookies.txt "https://www.myfxbook.com/api/get-community-outlook.json?session=${SESS_ENC}" -o sent_retail.json || true ;;
                esac
                if node -e 'try{const j=JSON.parse(require("fs").readFileSync("sent_retail.json","utf8"));process.exit(j&&!j.error&&Array.isArray(j.symbols)&&j.symbols.length?0:1);}catch(e){process.exit(1);}'; then echo "[debug] Myfxbook outlook ok (attempt $attempt)"; break; fi
                echo "[debug] Myfxbook outlook attempt $attempt: $(head -c 120 sent_retail.json 2>/dev/null)"
                sleep 4
              done
              curl -sL -A "$UA" -b mfx_cookies.txt "https://www.myfxbook.com/api/logout.json?session=${SESS_ENC}" -o /dev/null || true
            else
              echo "[debug] Myfxbook login failed (check MYFXBOOK_EMAIL/PASSWORD)"; head -c 200 sent_mfxlogin.json 2>/dev/null; echo
            fi
          else
            echo "[debug] Myfxbook secrets not set - retail stays empty (see the workflow env comment to enable)"
          fi
          echo "=== crypto F&G (first 200) ==="; head -c 200 sent_cfng.json 2>/dev/null; echo
          echo "=== stock F&G (first 200) ==="; head -c 200 sent_sfng.json 2>/dev/null; echo
          echo "=== TV VIX/PC (first 300) ==="; head -c 300 sent_tv.json 2>/dev/null; echo
          echo "=== retail json (first 200) ==="; head -c 200 sent_retail.json 2>/dev/null; echo
          node -e '
            const fs=require("fs");
            const today=new Date().toISOString().slice(0,10);
            let out={};
            try{const d=JSON.parse(fs.readFileSync("sentiment_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            const appendSeries=(prev,val)=>{
              let s=Array.isArray(prev)?prev.filter(e=>e&&e[0]!==today):[];
              s.push([today,val]);s.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              return s.slice(-120);
            };
            const log=[];let gotPcTv=false;
            // 1. Crypto Fear & Greed (alternative.me) - liefert eigene Historie
            try{
              const j=JSON.parse(fs.readFileSync("sent_cfng.json","utf8"));
              const arr=j&&Array.isArray(j.data)?j.data:[];
              if(arr.length){
                const cur=arr[0];
                const series=arr.map(e=>[new Date(Number(e.timestamp)*1000).toISOString().slice(0,10),Number(e.value)]).filter(e=>isFinite(e[1])).reverse();
                out.cryptoFng={value:Number(cur.value),label:String(cur.value_classification||""),series:series.slice(-120)};
                log.push("cryptoFng="+cur.value);
              }else log.push("cryptoFng:no-data");
            }catch(e){log.push("cryptoFng ERR "+e.message);}
            // 2. Stock Fear & Greed (CNN) - kann per Bot-Schutz blocken
            try{
              const j=JSON.parse(fs.readFileSync("sent_sfng.json","utf8"));
              const fg=j&&j.fear_and_greed;
              if(fg&&isFinite(Number(fg.score))){
                const hist=j.fear_and_greed_historical&&Array.isArray(j.fear_and_greed_historical.data)?j.fear_and_greed_historical.data:[];
                const series=hist.map(e=>[new Date(Number(e.x)).toISOString().slice(0,10),Math.round(Number(e.y))]).filter(e=>isFinite(e[1]));
                out.stockFng={value:Math.round(Number(fg.score)),label:String(fg.rating||""),series:series.slice(-120)};
                log.push("stockFng="+Math.round(Number(fg.score)));
              }else log.push("stockFng:no-score(blocked?)");
            }catch(e){log.push("stockFng ERR "+e.message);}
            // 3. VIX + Put/Call (TradingView-Scanner) - nur Tagesschluss, Serie
            // per Carry-over fortgeschrieben (wie price_data).
            try{
              const j=JSON.parse(fs.readFileSync("sent_tv.json","utf8"));
              const rows=j&&Array.isArray(j.data)?j.data:[];
              const get=t=>{const r=rows.find(x=>x.s===t);return r&&r.d&&isFinite(Number(r.d[0]))?Number(r.d[0]):null;};
              const vix=get("CBOE:VIX");
              if(vix!=null){out.vix={value:vix,series:appendSeries(out.vix&&out.vix.series,vix)};log.push("vix="+vix);}else log.push("vix:no-value");
              let pc=get("USI:PC");if(pc==null)pc=get("USI:PCC");
              if(pc!=null){out.putCall={value:pc,series:appendSeries(out.putCall&&out.putCall.series,pc)};gotPcTv=true;log.push("putCall="+pc);}else log.push("putCall:tv-no-value");
            }catch(e){log.push("tv ERR "+e.message);}
            // 3b. Put/Call von der OCC (Options Clearing Corp.; der
            // TradingView-Scanner oben liefert USI:PC/PCC nachweislich nie -
            // der Versuch bleibt nur als Gratis-Chance drin). sent_occ.json =
            // {entity:{total_volume:[{exchange,calls,puts,ratio,...}]}} mit
            // einer Zeile je US-Optionsboerse; wir summieren Calls+Puts ueber
            // alle Boersen und teilen (marktbreite Total-Ratio, wie CBOEs
            // fruehere Total-P/C). Der Report-Tag steht in sent_occ_date.txt
            // (der Fetch sucht bis 5 Tage rueckwaerts den juengsten
            // Handelstag) - Serie haengt am REPORT-Datum, nicht an "heute".
            try{
              if(!gotPcTv){
                const j=JSON.parse(fs.readFileSync("sent_occ.json","utf8"));
                const rd=fs.readFileSync("sent_occ_date.txt","utf8").trim();
                const arr=j&&j.entity&&Array.isArray(j.entity.total_volume)?j.entity.total_volume:[];
                let calls=0,puts=0;
                arr.forEach(r=>{const c=Number(r.calls),p=Number(r.puts);if(isFinite(c)&&isFinite(p)){calls+=c;puts+=p;}});
                if(calls>0&&puts>0&&/^\d{4}-\d{2}-\d{2}$/.test(rd)){
                  const ratio=Math.round(puts/calls*100)/100;
                  let s=(out.putCall&&Array.isArray(out.putCall.series)?out.putCall.series:[]).filter(e=>e&&e[0]!==rd);
                  s.push([rd,ratio]);s.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
                  out.putCall={value:ratio,source:"https://www.theocc.com/market-data/market-data-reports/volume-and-open-interest/daily-volume-statistics",series:s.slice(-120)};
                  log.push("putCall="+ratio+" (occ "+rd+", "+arr.length+" exchanges, P "+puts+" / C "+calls+")");
                }else log.push("putCall:occ-no-usable-totals");
              }
            }catch(e){log.push("putCall:occ-no-file ("+e.message.slice(0,60)+")");}
            // 4. Retail-Positionierung (Myfxbook get-community-outlook.json).
            // JSON: {error, symbols:[{name, shortPercentage, longPercentage}]}.
            // NUR Assets speichern, die in der App auch gelistet sind
            // (Nutzer-Grundsatz 2026-07-11: keine ungenutzten Daten ziehen).
            // Myfxbook liefert ~186 Symbole (viele Exoten/Einzelaktien) - davon
            // behalten wir die FX-Paare aus den 8 Majors PLUS je ein
            // kanonisches Symbol fuer die gelisteten Non-FX-Assets (Gold,
            // Silber, BTC, S&P 500, Nasdaq, WTI-Oel). Ohne gesetzte Secrets
            // existiert die Datei nicht -> retail bleibt.
            try{
              const j=JSON.parse(fs.readFileSync("sent_retail.json","utf8"));
              if(j&&j.error){log.push("retail:api-error("+(j.message||"")+")");}
              else{
                const MAJ=new Set(["USD","EUR","GBP","CHF","JPY","CAD","AUD","NZD"]);
                // je Non-FX-Asset Kandidaten in Prioritaetsreihenfolge (Broker-
                // Namen variieren) - das erste vorhandene Symbol wird genommen.
                const NONFX=[["XAUUSD"],["XAGUSD"],["BTCUSD"],["US500","SP500","SPX500"],["NAS100","USTEC","NDX100","US100"],["USOIL","XTIUSD","WTIUSD","WTI"]];
                const bySym={};
                (Array.isArray(j.symbols)?j.symbols:[]).forEach(s=>{
                  const sym=String(s.name||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
                  const lo=parseFloat(s.longPercentage),sh=parseFloat(s.shortPercentage);
                  if(!sym||!isFinite(lo)||!isFinite(sh))return;
                  if(!bySym[sym])bySym[sym]={sym,long:Math.round(lo),short:Math.round(sh)};
                });
                const total=Object.keys(bySym).length;
                const retail=[];
                Object.keys(bySym).forEach(sym=>{if(sym.length===6&&MAJ.has(sym.slice(0,3))&&MAJ.has(sym.slice(3)))retail.push(bySym[sym]);});
                NONFX.forEach(cands=>{for(const c of cands){if(bySym[c]){retail.push(bySym[c]);break;}}});
                if(retail.length>=5){out.retail=retail;out.retailSource="https://www.myfxbook.com/community/outlook";log.push("retail="+retail.length+"/"+total+" kept (listed assets only)");}
                else log.push("retail:parsed-"+retail.length+"/"+total);
              }
            }catch(e){log.push("retail:no-file/secrets-unset");}
            // 4b. Retail-Positionierung: taeglicher Verlauf pro Symbol (Nutzer-
            // Wunsch 2026-07-26 - Historie vs. Preis). Ein Punkt/Tag (bei
            // mehrfachen Laeufen am selben Tag wird der heutige Eintrag
            // ueberschrieben), Cap ~3 Jahre wie scoreHist/chartHist. out.retail
            // ist per Carry-over auch an Tagen mit fehlgeschlagenem Live-Fetch
            // gefuellt (der try-Block oben laesst es dann unangetastet) - diese
            // Stufe haengt daher bewusst NICHT vom Erfolg des Fetches selbst ab.
            // Kein Backfill hier moeglich (Myfxbook liefert nur den aktuellen
            // Snapshot, keine historische Abfrage) - waechst ab jetzt organisch;
            // der einmalige Bestand aus der Git-Historie der Datei wurde separat
            // rekonstruiert (echte vergangene Snapshots, kein Schaetzen).
            if(out.retail&&out.retail.length){
              const rh=out.retailHistory&&typeof out.retailHistory==="object"?out.retailHistory:{};
              out.retail.forEach(r=>{
                if(!r||!r.sym||!isFinite(+r.long))return;
                let s=Array.isArray(rh[r.sym])?rh[r.sym].filter(e=>e&&e[0]!==today):[];
                s.push([today,+r.long,isFinite(+r.short)?+r.short:100-(+r.long)]);
                s.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
                rh[r.sym]=s.slice(-1100);
              });
              out.retailHistory=rh;
            }
            out.updated=new Date().toISOString();
            fs.writeFileSync("sentiment_data.json",JSON.stringify(out,null,1));
            console.log("sentiment_data.json: "+log.join(" | "));
          '
          rm -f sent_cfng.json sent_sfng.json sent_tv.json sent_occ.json sent_occ_date.txt sent_retail.json sent_mfxlogin.json mfx_cookies.txt

      # ── Pro-Asset-Put/Call ueber ETF-Optionsketten (Yahoo Finance) ─────
      # Nutzer-Wunsch 2026-07-11: Put/Call nicht nur markt-weit (OCC oben),
      # sondern pro gelistetem Asset. OCCs Daten sind nur nach Boerse
      # aufgeschluesselt, nicht nach Symbol. Liquide ETF-Proxys haben aber
      # eigene Optionsketten mit Call/Put-Volumen (Yahoo Finance, kein
      # API-Key - braucht seit 2023 aber einen Cookie+Crumb-Handshake gegen
      # den Anti-Bot-Schutz, siehe fc.yahoo.com/getcrumb unten). NZD hat
      # keinen etablierten Options-ETF und bleibt bewusst aussen vor.
      # WICHTIG: anders als die OCC-Historie ist das hier eine reine
      # Tages-Momentaufnahme (Yahoo liefert kein historisches Volumen) - die
      # Serie waechst wie bei allen anderen Feeds ab jetzt taeglich um einen
      # Punkt, kein Backfill moeglich.
      - name: Fetch per-asset put/call via ETF option chains -> sentiment_data.json
        continue-on-error: true
        run: |
          # EOD-Gate: Yahoos volume-Feld ist untertags nur ein kumulativer
          # Intraday-Zwischenstand - erst nach US-Boersenschluss (16:00 ET =
          # 20:00/21:00 UTC je nach DST) settelt das finale Tagesvolumen. Der
          # Gesamt-Workflow laeuft stuendlich (fuer Kalender/Indikatoren), aber
          # DIESER Schritt darf beim CRON nur nach Schluss schreiben, damit
          # genau EIN sauberer EOD-Punkt pro Handelstag entsteht (Nutzer-Wunsch
          # 2026-07-22), statt bei jedem Stundenlauf einen Intraday-Teilwert.
          # Ein manueller workflow_dispatch (Test/On-Demand) umgeht das Gate
          # bewusst, damit sich der Fetch jederzeit verifizieren laesst.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DOW=$(date -u +%u)   # 1=Mo .. 7=So
            if [ "$DOW" -ge 6 ]; then
              echo "[debug] per-asset put/call: weekend (DOW $DOW) - US markets closed, skipping (no new EOD volume)"
              exit 0
            fi
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 21 ]; then
              echo "[debug] per-asset put/call: UTC hour $HOUR < 21 - before US EOD volume settles, skipping to keep one clean EOD point/day"
              exit 0
            fi
          else
            echo "[debug] per-asset put/call: manual dispatch ($GITHUB_EVENT_NAME) - EOD gate bypassed for on-demand verification"
          fi
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL --max-time 15 -A "$UA" -c ycookies.txt "https://fc.yahoo.com" -o /dev/null || true
          CRUMB=$(curl -sL --max-time 15 -A "$UA" -b ycookies.txt -c ycookies.txt "https://query2.finance.yahoo.com/v1/test/getcrumb")
          echo "[debug] Yahoo crumb: len=${#CRUMB}"
          declare -A PROXY=( [USD]=UUP [EUR]=FXE [GBP]=FXB [JPY]=FXY [CHF]=FXF [CAD]=FXC [AUD]=FXA [GOLD]=GLD [SILVER]=SLV [OIL]=USO [BTC]=IBIT [SP500]=SPY [NAS]=QQQ )
          rm -f yopt_all.json
          echo "{" > yopt_all.json
          first=1
          for ASSET in "${!PROXY[@]}"; do
            SYM="${PROXY[$ASSET]}"
            # (a) Basis-Fetch: liefert die Liste ALLER Verfallstermine
            # (expirationDates) + die naechste Kette. Yahoo gibt pro Antwort
            # nur EINEN Verfall zurueck (options[0]) - fuer das Gesamtvolumen
            # ueber alle Verfaelle muss jeder Termin einzeln per ?date= geholt
            # werden (Nutzer-Wunsch 2026-07-22: nicht nur Frontmonat).
            curl -sL --max-time 20 -A "$UA" -b ycookies.txt -H "Accept: application/json" "https://query1.finance.yahoo.com/v7/finance/options/${SYM}?crumb=${CRUMB}" -o "yopt_base.json" || true
            EXPS=$(node -e '
              try{
                const j=JSON.parse(require("fs").readFileSync("yopt_base.json","utf8"));
                const r=j&&j.optionChain&&j.optionChain.result&&j.optionChain.result[0];
                const e=(r&&r.expirationDates)||[];
                console.log(e.filter(x=>Number(x)>0).join(" "));
              }catch(e){}
            ' 2>/dev/null)
            rm -f "yopt_base.json"
            CV=0; PV=0; NEXP=0
            for EXP in $EXPS; do
              # (b) jeden Verfall einzeln holen, Volumina aufsummieren
              curl -sL --max-time 20 -A "$UA" -b ycookies.txt -H "Accept: application/json" "https://query1.finance.yahoo.com/v7/finance/options/${SYM}?date=${EXP}&crumb=${CRUMB}" -o "yopt_exp.json" || true
              VALS=$(node -e '
                try{
                  const j=JSON.parse(require("fs").readFileSync("yopt_exp.json","utf8"));
                  const r=j&&j.optionChain&&j.optionChain.result&&j.optionChain.result[0];
                  const opt=r&&r.options&&r.options[0];
                  const calls=(opt&&opt.calls)||[],puts=(opt&&opt.puts)||[];
                  const cv=calls.reduce((s,c)=>s+(Number(c.volume)||0),0);
                  const pv=puts.reduce((s,c)=>s+(Number(c.volume)||0),0);
                  console.log(cv+" "+pv);
                }catch(e){console.log("0 0");}
              ' 2>/dev/null)
              rm -f "yopt_exp.json"
              [ -z "$VALS" ] && VALS="0 0"
              CV=$((CV + ${VALS%% *})); PV=$((PV + ${VALS##* })); NEXP=$((NEXP+1))
              sleep 0.25   # Yahoo nicht ueberrennen (jetzt ~alle Verfaelle)
            done
            echo "[debug] $ASSET <- $SYM: $NEXP expiries summed, callVol=$CV putVol=$PV"
            if [ "$CV" -gt 0 ] && [ "$PV" -gt 0 ]; then
              [ "$first" -eq 0 ] && echo "," >> yopt_all.json
              echo "\"$ASSET\": {\"asset\":\"$ASSET\",\"proxy\":\"$SYM\",\"callVol\":$CV,\"putVol\":$PV,\"nExp\":$NEXP}" >> yopt_all.json
              first=0
            fi
          done
          echo "}" >> yopt_all.json
          node -e '
            const fs=require("fs");
            const raw=JSON.parse(fs.readFileSync("yopt_all.json","utf8"));
            const today=new Date().toISOString().slice(0,10);
            const out=JSON.parse(fs.readFileSync("sentiment_data.json","utf8"));
            const byAsset=out.putCallByAsset||{};
            const VOL_CUTOFF=500; // Mindestvolumen (Calls+Puts) fuer einen neuen Punkt
            let n=0,skipped=0;
            Object.keys(raw).forEach(asset=>{
              const e=raw[asset];
              const total=(Number(e.callVol)||0)+(Number(e.putVol)||0);
              // Illiquider Tag -> keine neue PCR berechnen (Forward-Fill: den
              // letzten gueltigen Tag stehen lassen), damit duenne FX-Proxys
              // (UUP/FXB/FXE...) keine kuenstlichen Extrem-Spikes erzeugen.
              if(total<VOL_CUTOFF){
                console.log("[debug] "+asset+" total volume "+total+" < "+VOL_CUTOFF+" - skipping (forward-fill last valid day)");
                skipped++;return;
              }
              const ratio=Math.round(e.putVol/e.callVol*100)/100;
              let s=(byAsset[asset]&&Array.isArray(byAsset[asset].series)?byAsset[asset].series:[]).filter(x=>x&&x[0]!==today);
              s.push([today,ratio]);s.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              byAsset[asset]={value:ratio,proxy:e.proxy,callVol:e.callVol,putVol:e.putVol,series:s.slice(-400)};
              n++;
            });
            if(skipped)console.log("[debug] put/call cutoff: "+skipped+" asset(s) below "+VOL_CUTOFF+" contracts skipped");
            out.putCallByAsset=byAsset;
            fs.writeFileSync("sentiment_data.json",JSON.stringify(out,null,1));
            console.log("sentiment_data.json: putCallByAsset "+n+"/"+Object.keys(raw).length+" assets updated ("+Object.keys(byAsset).sort().join(",")+")");
          '
          rm -f yopt_all.json ycookies.txt

      # ── Historischer Backfill Put/Call pro Asset (Marketdata.app) ────────
      # Nutzer-Wunsch 2026-07-12: Yahoo (oben) liefert nur den TAGESAKTUELLEN
      # Snapshot, keine Historie. Marketdata.app liefert die komplette EOD-
      # Optionskette (inkl. Volumen + Call/Put) fuer ein HISTORISCHES Datum in
      # einem einzigen Request (columnar JSON: optionSymbol/side/volume als
      # parallele Arrays) - anders als Massive.com/Polygon.io (das gleiche
      # Prinzip, aber nur mit hunderten Einzel-Kontrakt-Requests pro Tag bei
      # 5 req/min, siehe CLAUDE.md). Fuellt NUR Luecken auf (Datumsangaben,
      # die die Yahoo-Serie oben noch nicht hat) - der taegliche Yahoo-Wert
      # bleibt die autoritative Quelle fuer HEUTE. Kein expiration-Parameter
      # -> die volle Kette ueber ALLE Verfaelle des jeweiligen Datums (die
      # Summierung unten iteriert d.side komplett), methodisch konsistent mit
      # dem Yahoo-Schritt oben, der seit 2026-07-22 ebenfalls ueber alle
      # Verfaelle summiert (nicht mehr nur den Frontmonat).
      # 100/10.000/100.000 Credits/Tag je nach Plan (Free Forever/Starter-
      # /Trader-Trial) reichen fuer den kompletten 1-Jahres-Backfill locker
      # (13 Assets x ~250 Handelstage = ~3250 Requests = ~3250 Credits) -
      # danach nur noch ~13 Credits/Tag fuer neu hinzukommende Luecken-Tage.
      - name: Backfill historical put/call by asset (Marketdata.app, fills gaps only) -> sentiment_data.json
        continue-on-error: true
        env:
          MDTOKEN: ${{ secrets.MARKETDATA_TOKEN }}
        run: |
          if [ -z "$MDTOKEN" ]; then
            echo "[debug] marketdata: MARKETDATA_TOKEN secret not set, skipping"
          else
            declare -A PROXY=( [USD]=UUP [EUR]=FXE [GBP]=FXB [JPY]=FXY [CHF]=FXF [CAD]=FXC [AUD]=FXA [GOLD]=GLD [SILVER]=SLV [OIL]=USO [BTC]=IBIT [SP500]=SPY [NAS]=QQQ )
            rm -f md_series_all.txt
            for ASSET in "${!PROXY[@]}"; do
              SYM="${PROXY[$ASSET]}"
              MISSING=$(node -e '
                const fs=require("fs");
                let out={};
                try{out=JSON.parse(fs.readFileSync("sentiment_data.json","utf8"));}catch(e){}
                const ex=out.putCallByAsset&&out.putCallByAsset["'"$ASSET"'"];
                const have=new Set(((ex&&ex.series)||[]).map(e=>e[0]));
                const days=[];
                const now=new Date();
                for(let i=1;i<=370;i++){
                  const dt=new Date(now);dt.setUTCDate(dt.getUTCDate()-i);
                  const iso=dt.toISOString().slice(0,10);
                  const dow=dt.getUTCDay();
                  if(dow===0||dow===6)continue;
                  if(!have.has(iso))days.push(iso);
                }
                console.log(days.join(" "));
              ')
              N=0; F=0
              for D in $MISSING; do
                curl -sL --max-time 15 "https://api.marketdata.app/v1/options/chain/${SYM}/?date=${D}&token=${MDTOKEN}" -o md_resp.json || true
                RATIO=$(node -e '
                  try{
                    const d=JSON.parse(require("fs").readFileSync("md_resp.json","utf8"));
                    if(d.s!=="ok"||!Array.isArray(d.side)){process.exit(0);}
                    let cv=0,pv=0;
                    for(let i=0;i<d.side.length;i++){
                      const v=Number(d.volume&&d.volume[i])||0;
                      if(d.side[i]==="call")cv+=v;else if(d.side[i]==="put")pv+=v;
                    }
                    // Volume-Cutoff wie beim taeglichen Yahoo-Schritt: unter
                    // 500 Kontrakten (Calls+Puts) keinen Punkt nachtragen
                    // (illiquide Tage erzeugen sonst Extrem-Spikes).
                    if(cv>0&&pv>0&&(cv+pv)>=500)console.log(Math.round(pv/cv*100)/100);
                  }catch(e){}
                ')
                rm -f md_resp.json
                if [ -n "$RATIO" ]; then echo "$ASSET $D $RATIO" >> md_series_all.txt; N=$((N+1)); else F=$((F+1)); fi
              done
              echo "[debug] marketdata $ASSET <- $SYM: $N days filled, $F no-data/skipped"
            done
            node -e '
              const fs=require("fs");
              const out=JSON.parse(fs.readFileSync("sentiment_data.json","utf8"));
              const byAsset=out.putCallByAsset||{};
              let lines=[];
              try{lines=fs.readFileSync("md_series_all.txt","utf8").trim().split("\n").filter(Boolean);}catch(e){}
              const byA={};
              lines.forEach(l=>{
                const p=l.split(" ");
                (byA[p[0]]=byA[p[0]]||[]).push([p[1],Number(p[2])]);
              });
              let totalNew=0;
              Object.keys(byA).forEach(a=>{
                const cur=byAsset[a]||{};
                const existing=Array.isArray(cur.series)?cur.series:[];
                const seen=new Set(existing.map(e=>e[0]));
                const add=byA[a].filter(e=>!seen.has(e[0]));
                const merged=existing.concat(add);
                merged.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
                cur.series=merged.slice(-400);
                byAsset[a]=cur;
                totalNew+=add.length;
              });
              out.putCallByAsset=byAsset;
              fs.writeFileSync("sentiment_data.json",JSON.stringify(out,null,1));
              console.log("marketdata backfill: "+totalNew+" new points merged across "+Object.keys(byA).length+" assets");
            '
            rm -f md_series_all.txt
          fi

      # ── Saisonalitaet (seasonality_data.json) ──────────────────────────
      # Nutzer-Wunsch 2026-07-12: historische Monats-Tendenz je gelistetem
      # Asset als eigene Analyse-Ebene. Berechnet wird je Kalendermonat ueber
      # die letzten 15 Jahre: durchschnittlicher Monats-Return in Prozent und
      # Trefferquote (Anteil positiver Jahre) - echte Statistik aus echten
      # Kursen, keine Schaetzung. Nur 1x pro Tag neu gezogen (Guard unten),
      # Saisonalitaet aendert sich nicht stuendlich.
      # Quelle: urspruenglich Stooqs CSV-Endpoint (kostenlos, kein Login) -
      # seit 2026-07-12 liefert der aber fuer JEDES Symbol identisch 796
      # Bytes einer Cloudflare-JS-Challenge-Seite ("requires JavaScript to
      # verify your browser") statt echter Daten, per Debug-Log bestaetigt
      # (HTTP 200, aber HTML statt CSV) - mit reinem curl nicht loesbar.
      # Ersetzt durch dieselben liquiden ETF-Proxys + denselben Yahoo-
      # Cookie+Crumb-Handshake wie beim Pro-Asset-Put/Call-Schritt oben
      # (fc.yahoo.com -> Cookie, query2.../getcrumb -> Crumb), diesmal gegen
      # den Chart-Endpoint (v8/finance/chart, interval=1mo, range=max) statt
      # der Optionskette. Vorteil gegenueber Stooq: CurrencyShares-ETFs
      # (FXE/FXB/FXF/FXY/FXC/FXA/UUP) sind bereits in der WAEHRUNGS-Richtung
      # notiert (FXY steigt, wenn JPY staerker wird) - die fruehere
      # USD-first-Invertierung (usdjpy usw.) entfaellt dadurch komplett,
      # "inv" bleibt nur als Schema-Feld (immer 0) fuer App-Kompatibilitaet.
      # NZD hat wie beim Put/Call-Schritt keinen etablierten ETF und bleibt
      # aussen vor.
      # ── 3-JAHRES-PREISHISTORIE (einmaliger Backfill, danach No-Op) ────
      # price_data.json waechst sonst nur einen Punkt pro Stunde/Tag mit. Fuer
      # Performance-Ranking ueber 1M/YTD, belastbare Korrelationen und vor
      # allem die Marktrelevanz-Gewichtung (durchschnittlicher Kursausschlag
      # an Release-Tagen eines Indikators) braucht es echte Jahre statt Wochen.
      # Quelle ist derselbe Yahoo-Chart-Endpunkt, der beim Seasonality-Schritt
      # schon laeuft (inkl. Cookie+Crumb-Auth) - nur mit range=3y&interval=1d.
      #
      # WICHTIG - Konventionstreue: die Yahoo-Symbole sind so gewaehlt, dass
      # sie DASSELBE Underlying und DIESELBE invert-Konvention wie der
      # TradingView-Schritt oben treffen (CHF/JPY/CAD sind USD/XXX-Notierungen
      # -> invert:true). Sonst wuerden alte und neue Punkte derselben Reihe in
      # entgegengesetzte Richtungen zeigen.
      #
      # Rein ADDITIV: bestehende Tage bleiben unangetastet, es werden nur
      # fehlende AELTERE Daten ergaenzt. Reicht eine Reihe schon >=700 Punkte
      # zurueck, wird sie uebersprungen - der Schritt ist damit nach dem ersten
      # erfolgreichen Lauf ein No-Op und kostet praktisch nichts.
      - name: Backfill 3y daily price history (Yahoo) -> price_data.json
        continue-on-error: true
        run: |
          NEED=$(node -e '
            try{
              const d=JSON.parse(require("fs").readFileSync("price_data.json","utf8"));
              const short=Object.keys(d).filter(k=>!(d[k]&&Array.isArray(d[k].series)&&d[k].series.length>=700));
              console.log(short.length?"yes":"no");
            }catch(e){console.log("yes");}
          ')
          if [ "$NEED" = "no" ]; then
            echo "[debug] price backfill: all series already >=700 points, skipping"
            exit 0
          fi
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL --max-time 15 -A "$UA" -c ypc.txt "https://fc.yahoo.com" -o /dev/null || true
          CRUMB=$(curl -sL --max-time 15 -A "$UA" -b ypc.txt -c ypc.txt "https://query2.finance.yahoo.com/v1/test/getcrumb")
          echo "[debug] price backfill crumb: len=${#CRUMB}"
          # Asset -> Yahoo-Symbol (Underlying identisch zum TradingView-Schritt)
          # AMZN/NVDA ergaenzt 2026-08-08 (Audit-Fund: in der App gelistet, aber
          # ohne jede Preisreihe - erschienen ueberall als "-").
          MAPS="USD:DX-Y.NYB EUR:EURUSD=X GBP:GBPUSD=X CHF:CHF=X JPY:JPY=X CAD:CAD=X AUD:AUDUSD=X NZD:NZDUSD=X GOLD:GC=F SILVER:SI=F OIL:CL=F BTC:BTC-USD SP500:^GSPC NAS:^NDX DAX:^GDAXI AMZN:AMZN NVDA:NVDA"
          rm -f pbf_meta.txt
          for PAIR in $MAPS; do
            ASSET="${PAIR%%:*}"; SYM="${PAIR#*:}"
            ENC=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$SYM")
            HCODE=$(curl -sL --max-time 30 -A "$UA" -b ypc.txt -H "Accept: application/json" -w "%{http_code}" \
              "https://query1.finance.yahoo.com/v8/finance/chart/${ENC}?range=3y&interval=1d&crumb=${CRUMB}" -o "pbf_${ASSET}.json" || echo "000")
            SZ=$(wc -c < "pbf_${ASSET}.json" 2>/dev/null || echo 0)
            echo "[debug] price backfill $ASSET <- $SYM: http=$HCODE $SZ bytes"
            if [ "$HCODE" = "200" ] && [ "$SZ" -gt 500 ]; then
              echo "$ASSET" >> pbf_meta.txt
            else
              echo "[debug] price backfill $ASSET body: $(head -c 200 "pbf_${ASSET}.json" 2>/dev/null | tr -d '\r')"
              rm -f "pbf_${ASSET}.json"
            fi
          done
          node -e '
            const fs=require("fs");
            const CAP=1100;
            let out={};
            try{const d=JSON.parse(fs.readFileSync("price_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            let ids=[];
            try{ids=fs.readFileSync("pbf_meta.txt","utf8").trim().split("\n").filter(Boolean);}catch(e){}
            let touched=0;
            ids.forEach(id=>{
              let j;try{j=JSON.parse(fs.readFileSync("pbf_"+id+".json","utf8"));}catch(e){console.log("[debug] "+id+": bad json");return;}
              const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
              const ts=r&&r.timestamp;
              const cl=r&&r.indicators&&r.indicators.quote&&r.indicators.quote[0]&&r.indicators.quote[0].close;
              if(!ts||!cl||!ts.length){console.log("[debug] "+id+": no bars");return;}
              const cur=out[id]||{};
              const have=new Set((Array.isArray(cur.series)?cur.series:[]).map(e=>e&&e[0]));
              // Nur FEHLENDE Tage ergaenzen - was der stuendliche
              // TradingView-Schritt geschrieben hat, bleibt massgeblich.
              const add=[];
              for(let i=0;i<ts.length;i++){
                const c=cl[i];
                if(c==null||!isFinite(c)||c<=0)continue;
                const d=new Date(ts[i]*1000).toISOString().slice(0,10);
                if(have.has(d))continue;
                have.add(d);
                add.push([d,Math.round(Number(c)*100000)/100000]);
              }
              if(!add.length){console.log("[debug] "+id+": nothing new");return;}
              const merged=(Array.isArray(cur.series)?cur.series:[]).concat(add)
                .sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).slice(-CAP);
              out[id]=Object.assign({},cur,{series:merged});
              touched++;
              console.log("[debug] "+id+": +"+add.length+" points -> "+merged.length+" total ("+merged[0][0]+" .. "+merged[merged.length-1][0]+")");
            });
            if(touched){
              fs.writeFileSync("price_data.json",JSON.stringify(out,null,1));
              console.log("price_data.json: backfilled "+touched+" series");
            }else{
              console.log("price_data: backfill added nothing, file unchanged");
            }
          '
          rm -f pbf_*.json pbf_meta.txt ypc.txt

      - name: Fetch seasonality (Yahoo ETF proxies, monthly bars) -> seasonality_data.json
        continue-on-error: true
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if node -e 'try{const d=JSON.parse(require("fs").readFileSync("seasonality_data.json","utf8"));process.exit(String(d.updated||"").slice(0,10)==="'"$TODAY"'"?0:1);}catch(e){process.exit(1);}'; then
            echo "[debug] seasonality: already fetched today, skipping"
            exit 0
          fi
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL --max-time 15 -A "$UA" -c yscookies.txt "https://fc.yahoo.com" -o /dev/null || true
          CRUMB=$(curl -sL --max-time 15 -A "$UA" -b yscookies.txt -c yscookies.txt "https://query2.finance.yahoo.com/v1/test/getcrumb")
          echo "[debug] seasonality Yahoo crumb: len=${#CRUMB}"
          declare -A PROXY=( [USD]=UUP [EUR]=FXE [GBP]=FXB [JPY]=FXY [CHF]=FXF [CAD]=FXC [AUD]=FXA [GOLD]=GLD [SILVER]=SLV [OIL]=USO [BTC]=IBIT [SP500]=SPY [NAS]=QQQ )
          rm -f seas_meta.txt
          for ASSET in "${!PROXY[@]}"; do
            SYM="${PROXY[$ASSET]}"
            HCODE=$(curl -sL --max-time 30 -A "$UA" -b yscookies.txt -H "Accept: application/json" -w "%{http_code}" "https://query1.finance.yahoo.com/v8/finance/chart/${SYM}?range=max&interval=1mo&crumb=${CRUMB}" -o "seas_${ASSET}.json" || echo "000")
              SZ=$(wc -c < "seas_${ASSET}.json" 2>/dev/null || echo 0)
              echo "[debug] seasonality $ASSET <- $SYM: http=$HCODE $SZ bytes"
              if [ "$HCODE" = "200" ] && [ "$SZ" -gt 500 ]; then
                echo "$ASSET $SYM" >> seas_meta.txt
              else
                echo "[debug] seasonality $ASSET body: $(head -c 300 "seas_${ASSET}.json" 2>/dev/null | tr -d '\r')"
                rm -f "seas_${ASSET}.json"
              fi
          done
          node -e '
            const fs=require("fs");
            const YEARS=15, MIN_YEARS=8;
            let meta=[];
            try{meta=fs.readFileSync("seas_meta.txt","utf8").trim().split("\n").filter(Boolean).map(l=>{const p=l.split(" ");return{id:p[0],sym:p[1]};});}catch(e){}
            const out={updated:new Date().toISOString(),assets:{}};
            const log=[];
            meta.forEach(m=>{
              let j;try{j=JSON.parse(fs.readFileSync("seas_"+m.id+".json","utf8"));}catch(e){log.push(m.id+":bad-json");return;}
              const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
              const ts=r&&r.timestamp,closes=r&&r.indicators&&r.indicators.quote&&r.indicators.quote[0]&&r.indicators.quote[0].close;
              const gran=r&&r.meta&&r.meta.dataGranularity;
              console.log("[debug] seasonality "+m.id+" granularity="+gran+" bars="+(ts?ts.length:0));
              if(!ts||!closes||!ts.length){log.push(m.id+":no-bars");return;}
              // Absicherung gegen zu junge Ticker (z.B. IBIT/BTC seit 01/2024):
              // Yahoo liefert fuer sehr kurze Historien manchmal feinere Bars
              // als angefordert statt eines Fehlers - echte Monats-Bars pruefen
              // (Median-Abstand >=25 Tage), sonst Asset ueberspringen statt
              // Tages-Rauschen faelschlich als "Monats-Saisonalitaet" zu zeigen.
              if(ts.length>=2){
                const gaps=[];for(let i=1;i<ts.length;i++)gaps.push((ts[i]-ts[i-1])/86400);
                gaps.sort((a,b)=>a-b);
                const medGap=gaps[Math.floor(gaps.length/2)];
                if(medGap<25){log.push(m.id+":bars-too-fine("+medGap.toFixed(1)+"d)");return;}
              }
              const cutoff=new Date();cutoff.setUTCFullYear(cutoff.getUTCFullYear()-YEARS);
              // Return je Bar ggue. dem VORHERIGEN Bar (chronologisch; prevClose
              // laeuft auch vor dem Cutoff schon mit, damit der erste Monat IM
              // Fenster einen echten Vormonats-Bezugswert hat statt verworfen
              // zu werden), gebucket nach Kalendermonat.
              const byMonth={};
              let prevClose=null;
              for(let i=0;i<ts.length;i++){
                const c=closes[i];
                if(c==null||!isFinite(c)||c<=0)continue;
                const d=new Date(ts[i]*1000);
                if(prevClose!=null&&d>=cutoff){
                  const ret=(c/prevClose-1)*100;
                  const mon=d.getUTCMonth()+1;
                  (byMonth[mon]=byMonth[mon]||[]).push(ret);
                }
                prevClose=c;
              }
              const months=[];
              for(let mon=1;mon<=12;mon++){
                const arr=byMonth[mon]||[];
                if(!arr.length)continue;
                const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
                const hit=arr.filter(v=>v>0).length/arr.length*100;
                months.push([mon,Math.round(avg*100)/100,Math.round(hit),arr.length]);
              }
              if(months.length===12&&months.every(e=>e[3]>=MIN_YEARS)){
                out.assets[m.id]={proxy:m.sym,inv:0,months};
                log.push(m.id+"("+m.sym+","+months[0][3]+"y)");
              }else log.push(m.id+":too-little-history("+months.length+"mo)");
            });
            if(Object.keys(out.assets).length>=5){
              fs.writeFileSync("seasonality_data.json",JSON.stringify(out,null,1));
              console.log("seasonality_data.json: "+log.join(" | "));
            }else{
              console.log("seasonality: only "+Object.keys(out.assets).length+" assets usable, keeping existing file ("+log.join(" | ")+")");
            }
          '
          rm -f seas_*.json seas_meta.txt yscookies.txt

      # ── COT / Commitments of Traders (cot_data.json) ──────────────────
      # CFTC "Legacy Futures-Only", Kategorie Non-Commercial (Grossspekulanten).
      # Erscheint woechentlich (Stand Dienstag, Veroeffentlichung Freitag). Es wird
      # nur geschrieben, wenn sich die Werte tatsaechlich geaendert haben - sonst
      # entsteht kein stuendlicher Commit-Churn.
      - name: Fetch CFTC COT (Legacy futures-only) -> cot_data.json
        run: |
          curl -sL --max-time 90 \
            'https://publicreporting.cftc.gov/resource/6dca-aqww.json?$select=market_and_exchange_names,report_date_as_yyyy_mm_dd,open_interest_all,noncomm_positions_long_all,noncomm_positions_short_all,change_in_noncomm_long_all,change_in_noncomm_short_all,change_in_open_interest_all&$order=report_date_as_yyyy_mm_dd%20DESC&$limit=12000' \
            -o cot_raw.json || true
          node -e '
            const fs=require("fs");
            let rows;
            try{rows=JSON.parse(fs.readFileSync("cot_raw.json","utf8"));}catch(e){console.log("cot: raw unreadable, keeping existing file");process.exit(0);}
            if(!Array.isArray(rows)||!rows.length){console.log("cot: empty/invalid raw, keeping existing file");process.exit(0);}
            const MARKETS=[
              {id:"EUR", inc:/EURO FX/, exc:/MICRO/},
              {id:"GBP", inc:/BRITISH POUND/, exc:/MICRO/},
              {id:"JPY", inc:/JAPANESE YEN/, exc:/MICRO/},
              {id:"CHF", inc:/SWISS FRANC/, exc:/MICRO/},
              {id:"CAD", inc:/CANADIAN DOLLAR/, exc:/MICRO/},
              {id:"AUD", inc:/AUSTRALIAN DOLLAR/, exc:/MICRO/},
              {id:"NZD", inc:/(NZ DOLLAR|NEW ZEALAND DOLLAR)/, exc:/MICRO/},
              {id:"USD", inc:/(U\.?S\.?\s*DOLLAR INDEX|USD INDEX)/, exc:/MICRO/},
              {id:"BTC", inc:/BITCOIN/, exc:/(MICRO|YIELD|ETHER|EVENT)/},
              {id:"GOLD", inc:/^GOLD - /, exc:/(MICRO|KILO)/},
              {id:"SILVER", inc:/^SILVER - /, exc:/MICRO/},
              {id:"OIL", inc:/CRUDE OIL, LIGHT SWEET/, exc:/(MICRO|CALENDAR|BULLET|FINANCIAL|NYMEX OTHER|MIDLAND|GULF|WTI AVERAGE)/},
              {id:"SP500", inc:/E-MINI S&P 500/, exc:/(MICRO|ESG|GROWTH|VALUE|DIVIDEND|ANNUAL|QUARTER|CONSU|FINANCIAL|HEALTH|TECH|UTIL|MATERIAL|INDUSTRIAL|ENERGY|REAL|COMMUNICATION)/},
              {id:"NAS", inc:/(NASDAQ-100|E-MINI NASDAQ)/, exc:/MICRO/}
            ];
            // Pro Markt bis zu HIST_LEN Wochen sammeln (Zeilen kommen bereits
            // global nach report_date DESC sortiert -> je Markt automatisch
            // neueste zuerst). out[id] bleibt der jeweils neueste Snapshot
            // (unveraendertes Schema fuer die Karten/Scoring), history[id]
            // wird zusaetzlich fuer das COT-Verlaufsdiagramm gesammelt.
            const HIST_LEN=26;
            const out={};let reportDate="";const matched=[];
            // Rohzeilen nach exaktem Kontraktnamen gruppieren. Ein Regex wie
            // /EURO FX/ trifft auch Cross-Rate-Kontrakte ("EURO FX/BRITISH
            // POUND CROSS RATE") und Nano-/Wochen-Varianten - mit voellig
            // anderen (winzigen) Positionszahlen. Frueher wurde je Markt teils
            // der Hauptkontrakt, teils ein Cross-Rate erwischt (abhaengig von
            // der Zeilenreihenfolge), wodurch Werte zwischen Symbolen
            // vertauscht wurden. Loesung: pro Markt den KANONISCHEN Kontrakt
            // waehlen = der mit dem groessten Open Interest im neuesten Report.
            // Der echte Hauptkontrakt ist um Groessenordnungen groesser als
            // jede Cross-Rate-/Nano-Variante.
            const byMarket={};
            for(const r of rows){
              const nm=(r.market_and_exchange_names||"").toUpperCase();
              (byMarket[nm]=byMarket[nm]||[]).push(r);
            }
            const descByDate=(a,b)=>String(b.report_date_as_yyyy_mm_dd||"").localeCompare(String(a.report_date_as_yyyy_mm_dd||""));
            for(const mk of MARKETS){
              const cands=Object.keys(byMarket).filter(nm=>mk.inc.test(nm)&&!(mk.exc&&mk.exc.test(nm))&&!/CROSS RATE/.test(nm));
              if(!cands.length)continue;
              let best=null,bestOi=-1;
              for(const nm of cands){
                const s=byMarket[nm].slice().sort(descByDate);
                const oi=Number(s[0].open_interest_all)||0;
                if(oi>bestOi){bestOi=oi;best=nm;}
              }
              const series=byMarket[best].slice().sort(descByDate);
              const newest=series[0];
              const L=Number(newest.noncomm_positions_long_all),S=Number(newest.noncomm_positions_short_all);
              if(!isFinite(L)||!isFinite(S))continue;
              const d=String(newest.report_date_as_yyyy_mm_dd||"").slice(0,10);
              out[mk.id]={
                long:L,short:S,
                dLong:Number(newest.change_in_noncomm_long_all)||0,
                dShort:Number(newest.change_in_noncomm_short_all)||0,
                oi:Number(newest.open_interest_all)||0,
                dOi:Number(newest.change_in_open_interest_all)||0
              };
              out[mk.id].history=series.slice(0,HIST_LEN).map(r=>({
                date:String(r.report_date_as_yyyy_mm_dd||"").slice(0,10),
                long:Number(r.noncomm_positions_long_all)||0,
                short:Number(r.noncomm_positions_short_all)||0,
                oi:Number(r.open_interest_all)||0
              })).sort((a,b)=>a.date.localeCompare(b.date));
              if(d>reportDate)reportDate=d;
              out[mk.id].contract=best; // fuer den 3y-Perzentil-Enrich-Schritt unten
              matched.push(mk.id+" <- "+best+" ("+d+", OI "+bestOi+")");
            }
            const got=Object.keys(out).length;
            if(got===0){
              console.log("cot: no markets matched - sample row keys: "+Object.keys(rows[0]||{}).join(","));
              console.log("cot: sample market names: "+rows.slice(0,6).map(r=>r.market_and_exchange_names).join(" | "));
              console.log("cot: keeping existing file");
              process.exit(0);
            }
            console.log("cot matched "+got+"/"+MARKETS.length+" markets:");
            matched.forEach(s=>console.log("  "+s));
            const missing=MARKETS.map(m=>m.id).filter(id=>!out[id]);
            if(missing.length)console.log("cot MISSING: "+missing.join(", "));
            let prev=null;try{prev=JSON.parse(fs.readFileSync("cot_data.json","utf8"));}catch(e){}
            if(prev&&JSON.stringify(prev.symbols)===JSON.stringify(out)){console.log("cot: unchanged, keeping existing file");process.exit(0);}
            const result={report_date:reportDate,updated:new Date().toISOString(),symbols:out};
            if(prev&&prev.pct3y)result.pct3y=prev.pct3y; // Enrich-Ergebnis nicht wegwerfen
            fs.writeFileSync("cot_data.json",JSON.stringify(result,null,1));
            console.log("cot_data.json written: "+got+" markets, report "+reportDate+", history up to "+HIST_LEN+" weeks");
          '
          rm -f cot_raw.json

      # ── COT-Anreicherung: 3-Jahres-Perzentil der Netto-Positionierung ──
      # Nutzer-Wunsch 2026-07-12: "crowded trade"-Warnung. Zweiter, gezielt
      # gefilterter CFTC-Fetch (nur die 14 kanonischen Kontrakte, 3,5 Jahre)
      # liefert die woechentliche Netto-%-Historie ((L-S)/(L+S)); daraus das
      # Perzentil des aktuellen Werts je Markt (0 = extremstes Netto-Short
      # der 3 Jahre, 100 = extremstes Netto-Long). Ergebnis wandert als
      # TOP-LEVEL-Block pct3y in cot_data.json (bewusst NICHT in symbols -
      # sonst wuerde der Unchanged-Vergleich im Hauptschritt nie mehr
      # greifen und jede Stunde neu fetchen). Laeuft nur, wenn zum
      # aktuellen report_date noch kein Perzentil berechnet wurde.
      - name: Enrich cot_data.json with 3y net-position percentile
        continue-on-error: true
        run: |
          if node -e 'try{const d=JSON.parse(require("fs").readFileSync("cot_data.json","utf8"));process.exit(d.pct3y&&d.pct3y.report_date===d.report_date?0:1);}catch(e){process.exit(1);}'; then
            echo "[debug] cot pct3y: current report already enriched, skipping"
            exit 0
          fi
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("cot_data.json","utf8"));
            const names=Object.values(d.symbols||{}).map(s=>s.contract).filter(Boolean);
            if(!names.length){console.log("cot pct3y: no contract names stored yet (main step must run once first)");process.exit(0);}
            const since=new Date(Date.now()-3.5*365.25*864e5).toISOString().slice(0,10);
            // Apostrophe NICHT literal schreiben (auch nicht in Kommentaren!):
            // dieses Skript steckt in einem einfach-gequoteten bash node -e
            // Block, ein literales Hochkomma wuerde ihn sofort beenden.
            const q=String.fromCharCode(39);
            const inList=names.map(n=>q+n.split(q).join(q+q)+q).join(",");
            const url="https://publicreporting.cftc.gov/resource/6dca-aqww.json?$select=market_and_exchange_names,report_date_as_yyyy_mm_dd,noncomm_positions_long_all,noncomm_positions_short_all&$where="+encodeURIComponent("market_and_exchange_names in("+inList+") AND report_date_as_yyyy_mm_dd>="+q+since+q)+"&$limit=15000";
            fs.writeFileSync("cot_pct_url.txt",url);
          '
          [ -f cot_pct_url.txt ] || exit 0
          curl -sL --max-time 90 "$(cat cot_pct_url.txt)" -o cot_pct_raw.json || true
          echo "[debug] cot pct3y raw: $(wc -c < cot_pct_raw.json 2>/dev/null || echo 0) bytes"
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("cot_data.json","utf8"));
            let rows;try{rows=JSON.parse(fs.readFileSync("cot_pct_raw.json","utf8"));}catch(e){console.log("cot pct3y: raw unreadable, skipping");process.exit(0);}
            if(!Array.isArray(rows)||rows.length<100){console.log("cot pct3y: too few rows ("+(rows&&rows.length)+"), skipping");process.exit(0);}
            const byName={};
            rows.forEach(r=>{
              const L=Number(r.noncomm_positions_long_all),S=Number(r.noncomm_positions_short_all);
              if(!isFinite(L)||!isFinite(S)||L+S<=0)return;
              (byName[r.market_and_exchange_names]=byName[r.market_and_exchange_names]||[]).push({d:String(r.report_date_as_yyyy_mm_dd||"").slice(0,10),v:(L-S)/(L+S)});
            });
            const data={};const log=[];
            Object.keys(d.symbols||{}).forEach(id=>{
              const s=d.symbols[id];
              const hist=byName[s.contract];
              if(!hist||hist.length<80){log.push(id+":thin("+((hist&&hist.length)||0)+"w)");return;}
              const cur=(s.long-s.short)/(s.long+s.short);
              const below=hist.filter(e=>e.v<=cur).length;
              data[id]={pct:Math.round(below/hist.length*100),n:hist.length};
              log.push(id+"="+data[id].pct+"%("+hist.length+"w)");
            });
            if(Object.keys(data).length>=5){
              d.pct3y={report_date:d.report_date,updated:new Date().toISOString(),data};
              fs.writeFileSync("cot_data.json",JSON.stringify(d,null,1));
              console.log("cot pct3y written: "+log.join(" | "));
            }else console.log("cot pct3y: too few markets ("+log.join(" | ")+"), skipping");
          '
          rm -f cot_pct_url.txt cot_pct_raw.json

      # Nutzer-Wunsch 2026-07-20 (Bugreport per Screenshot: iPad taeglich
      # offen zeigte trotzdem Luecken in der Trends-Historie, PC selten
      # offen nur einzelne Tage): scoreHist wird bisher AUSSCHLIESSLICH im
      # Browser berechnet und geschrieben (recordScoreHist()) - an einem Tag,
      # an dem KEIN Geraet die App oeffnet, kann rein client-seitig also NIE
      # ein Eintrag entstehen, egal wie gut der Cross-Device-Sync ist. Dieser
      # Schritt schliesst die Luecke: liest den zuletzt von IRGENDEINEM
      # Geraet in die Cloud gepushten scoreSnapshot (siehe cloudPush() in
      # index.html, dasselbe Feld das auch weekly-report.yml schon nutzt)
      # und schreibt/aktualisiert daraus taeglich EINEN Eintrag pro Asset in
      # score_hist.json - unabhaengig davon, ob heute ueberhaupt ein Geraet
      # geoeffnet wurde. Der Browser merged diese Datei beim Laden als BASIS
      # in sein eigenes scoreHist (mergeScoreHist(server,local),
      # applyScoreHistServerFeed() in index.html) - lokale, frisch im
      # Browser korrigierte Werte haben immer Vorrang. Nutzt dieselben
      # SUPABASE_*-Secrets, die weekly-report.yml/event-alerts.yml bereits
      # verwenden (keine neue Einrichtung noetig). Ohne Secrets/Cloud-Sync-
      # Konfiguration bleibt score_hist.json einfach leer/unveraendert (rein
      # additiv zum bisherigen, weiterhin funktionierenden Client-Recording).
      - name: Fetch score snapshot from cloud sync -> score_hist.json
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SYNC_ID: ${{ secrets.SUPABASE_SYNC_ID }}
        run: |
          node -e '
            const fs=require("fs");
            async function main(){
              const {SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SYNC_ID}=process.env;
              if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!SUPABASE_SYNC_ID){
                console.log("[debug] score_hist: SUPABASE_* secrets not set, skipping (client-side recording keeps working independently)");
                return;
              }
              const res=await fetch(SUPABASE_URL+"/rest/v1/fx_sync?id=eq."+encodeURIComponent(SUPABASE_SYNC_ID)+"&select=data,updated_at",{headers:{apikey:SUPABASE_ANON_KEY}});
              if(!res.ok){console.log("[debug] score_hist: cloud fetch HTTP "+res.status);return;}
              const rows=await res.json();
              const snap=rows[0]&&rows[0].data&&rows[0].data.scoreSnapshot;
              if(!Array.isArray(snap)||!snap.length){console.log("[debug] score_hist: no scoreSnapshot in cloud yet (no device has pushed)");return;}
              let d={};
              try{d=JSON.parse(fs.readFileSync("score_hist.json","utf8"))||{};}catch(e){}
              const today=new Date().toISOString().slice(0,10);
              let changedN=0;
              snap.forEach(s=>{
                if(!s||!s.id||typeof s.score!=="number")return;
                const arr=d[s.id]||(d[s.id]=[]);
                const last=arr[arr.length-1];
                const e=[today,s.score,s.infl||0,s.labour||0,s.growth||0,s.bias||"neu"];
                if(last&&last[0]===today){
                  if(last[1]!==e[1]||last[2]!==e[2]||last[3]!==e[3]||last[4]!==e[4]||last[5]!==e[5]){arr[arr.length-1]=e;changedN++;}
                }else{arr.push(e);changedN++;}
                if(arr.length>1100)arr.splice(0,arr.length-1100);
              });
              fs.writeFileSync("score_hist.json",JSON.stringify(d));
              console.log("[debug] score_hist: updated "+changedN+"/"+snap.length+" assets for "+today+" (cloud updated_at="+(rows[0]&&rows[0].updated_at)+")");
            }
            main().catch(e=>{console.log("[debug] score_hist: error "+e.message);});
          '

      # ── ZINS-WAHRSCHEINLICHKEITEN, 8 ZENTRALBANKEN (rate_probabilities.json) ─
      # Nutzer-Wunsch 2026-07-20: CME-FedWatch-aehnliche Anzeige ("Rate
      # Probabilities", Insights-Tab), aber das offizielle CME-Tool/API ist
      # kostenpflichtig (~25 $+/Monat) - nach dem Grundsatz oben ("ein
      # kostenloses Konto ist kein Abbruchgrund, eine BEZAHLTE Stufe schon")
      # daher eine freie Eigenberechnung nach CMEs eigener, oeffentlich
      # dokumentierter Methodik. Erweitert 2026-07-25 (Nutzer-Wunsch: "auch
      # fuer die anderen Waehrungen") auf 5, dann 2026-07-26 (Nutzer-Wunsch:
      # "fehlende Waehrungen ergaenzen, so praezise wie moeglich wie USD")
      # auf alle 8 FX-Major-Zentralbanken, nach einer mehrstufigen
      # Live-Recherche (workflow_dispatch-Probe-Laeufe + WebSearch, siehe
      # Session-Notizen), welche Futures/Referenzzins-Quellen frei verfuegbar
      # sind:
      #
      # PRAEZISE Methode (USD/AUD, ggf. EUR/GBP/CAD falls der 2026-07-26
      # Upgrade-Versuch anschlaegt) - identisch zur urspruenglichen ZQ-Logik:
      #   30-Day Fed Funds Futures (CBOT:ZQ) bzw. ASX 30-Day Interbank Cash
      #   Rate Futures (ASX24:IB) geben je KALENDERMONAT den durchschnittlichen
      #   Tages-Zinssatz an (100-Future-Preis) - ein direktes strukturelles
      #   Aequivalent. Faellt eine Sitzung MITTEN in einen Monat, laesst sich
      #   daraus tageszahl-gewichtet der Zins NACH der Sitzung herausrechnen
      #   (Kette Sitzung-zu-Sitzung, "sauberer Nachbarmonat ohne Sitzung"-Fix
      #   fuer die Verstaerkungs-Faelle - siehe Kommentare in preciseMethod()).
      #   2026-07-26: fuer EUR/GBP/CAD wird zusaetzlich versucht, auf diese
      #   Methode zu wechseln (ICEEUR:EMP "ECB Dated €STR" sitzungsdatiert /
      #   ICEEUR:EON "One-Month €STR" / ICEEUR:SOA "One-Month SONIA" /
      #   TMX:COA "One-Month CORRA" - alle strukturell wie ZQ/IB, siehe
      #   eurCfg/gbpCfg/cadCfg weiter unten). Liefert TradingView dafuer 0
      #   Kontrakte (wie beim ERSTEN Versuch 2026-07-25 mit 1-Monats-Tickern
      #   fuer genau diese 3 Waehrungen), bleibt automatisch die bisherige
      #   approx-Konfiguration aktiv - kein manueller Eingriff noetig.
      #
      # APPROXIMATIVE Methode (EUR/GBP/CAD als Fallback, plus CHF/JPY/NZD
      # strukturell dauerhaft, da fuer diese 3 Waehrungen KEIN 1-Monats-/
      # sitzungsdatiertes Futures-Kontrakt frei existiert):
      #   Fuer diese Waehrungen fuehrt TradingView frei NUR 3-MONATS-Futures
      #   (ICEEUR:I Euribor / ICEEUR:SO3 SONIA / TMX:CRA CORRA / EUREX:FSR3
      #   SARON / OSE:TOA3M TONA / ASX24:BB NZ-Bank-Bill). Ein 3-Monats-Future
      #   kann NICHT sauber einem einzelnen Meeting zugeordnet werden, wenn
      #   mehrere Sitzungen ins selbe Quartal fallen (der Regelfall ausser bei
      #   USD/AUD) - eine exakte Meeting-fuer-Meeting-Aufloesung wie bei
      #   USD/AUD ist mit frei verfuegbaren Futures-Daten allein NICHT
      #   moeglich (braeuchte optionen-implizite/OIS-Daten wie das bezahlte
      #   CME-Tool bzw. rateprobability.com). Stattdessen: die Kontrakt-Kurve
      #   wird als glatte, linear interpolierte FORWARD-KURVE gelesen
      #   (Ankerpunkte: heutiger Referenzzins + je ein Punkt pro Kontraktmonat
      #   in der Mitte des Monats) und pro Sitzung am Mittelpunkt ihrer
      #   "Kontrollperiode" (bis zur naechsten Sitzung) abgetastet - das ist
      #   eine ehrliche, aus echten Marktpreisen abgeleitete Naeherung (keine
      #   erfundene Zahl), aber strukturell ungenauer als USD/AUD. Der Client
      #   kennzeichnet das per method:"approx"-Feld sichtbar (≈-Badge).
      #   Cross-Benchmark-Fix (crossBenchmark:true, siehe approxMethod()):
      #   noetig, wenn das Futures-Kontrakt einen ANDEREN Zins misst als der
      #   Referenzzins selbst (EUR: Euribor-Future vs. €STR-Referenz; NZD:
      #   NZ-Bank-Bill-Future/BKBM vs. OCR-Referenz - beide haben einen
      #   Kredit-/Liquiditaetsspread zueinander). CHF/JPY brauchen den Fix
      #   NICHT (SARON-Future misst SARON, TONA-Future misst TONA - derselbe
      #   Zins wie der jeweilige Referenzzins).
      #
      # Referenzzinsen (alle frei, taeglich, kein API-Key):
      #   USD: NY Fed Markets Data API (EFFR) - primaere Quelle, FRED spiegelt
      #        nur (FRED blockte GitHub-Runner-IPs wiederholt, siehe unten).
      #   AUD: RBA Statistical Table F1.1 CSV (Cash Rate Target).
      #   EUR: ECB Data Portal SDMX csvdata (EST = Euro Short-Term Rate).
      #   GBP: Bank of England IADB CSV (Serie IUDSOIA = SONIA).
      #   CAD: Bank of Canada Valet API (Serie AVG.INTWO = CORRA).
      #   CHF: SNB Data Portal Cube "snbgwdzid" (Dimension SARON) - Format per
      #        workflow_dispatch-Testlauf 2026-07-26 verifiziert (semikolon-
      #        getrenntes, in Anfuehrungszeichen gequotetes CSV).
      #   JPY/NZD: KEIN eigener Fetch auf boj.or.jp/rbnz.govt.nz - der
      #        Testlauf 2026-07-26 zeigte, dass BoJs Seite ohne bekannte
      #        Tabellenstruktur nicht blind parsebar ist und RBNZs Seite die
      #        GitHub-Runner-IP per Cloudflare mit HTTP 403 blockt (dieselbe
      #        Blockade wie beim dokumentierten NZD-Bond-Yield-Backfill).
      #        Stattdessen wird der "Central Bank Rate"-Wert aus dem im
      #        selben Lauf bereits aktualisierten ind_data.json wiederverwendet
      #        (BoJ-Leitzins bzw. RBNZ OCR, ueber den bestehenden TradingView-
      #        Kalender-Feed) - siehe parseCbRateFromIndData().
      #
      # Historie: taeglich EIN Snapshot PRO WAEHRUNG ergaenzt (wie bond_data/
      # price_data/score_hist) - ein rueckwirkender Backfill war fuer KEINE
      # der 8 Waehrungen moeglich (bezahlte APIs/geblockte Einzelkontrakt-
      # Seiten/keine verlaesslichen historischen Settlement-Preise bei
      # TradingView) - waechst deshalb ab jetzt echt einen Punkt pro Tag.
      # CHF/JPY/NZD starten mit 0 Historientagen, sobald ihr Referenzzins-
      # Parser einmal erfolgreich durchlaeuft.
      - name: Fetch rate probabilities (Fed/RBA/ECB/BoE/BoC/SNB/BoJ/RBNZ) -> rate_probabilities.json
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          # USD EFFR: NY Fed Markets Data API (siehe aeltere Kommentar-Historie
          # im Git-Log dieser Datei fuer die vier Iterationsrunden, die zu
          # dieser Quelle fuehrten - FRED blockte GitHub-Runner-IPs dauerhaft).
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] NY Fed EFFR curl: http=%{http_code} size=%{size_download}\n" "https://markets.newyorkfed.org/api/rates/unsecured/effr/last/1.json" -o rate_usd_ref.json || echo "[debug] NY Fed EFFR curl: command failed (exit $?)"
          if [ ! -s rate_usd_ref.json ]; then sleep 5; curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] NY Fed EFFR retry: http=%{http_code} size=%{size_download}\n" "https://markets.newyorkfed.org/api/rates/unsecured/effr/last/1.json" -o rate_usd_ref.json || true; fi
          # AUD Cash Rate Target: RBA Statistical Table F1.1 (Money Market).
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] RBA F1.1 curl: http=%{http_code} size=%{size_download}\n" "https://www.rba.gov.au/statistics/tables/csv/f1.1-data.csv" -o rate_aud_ref.csv || echo "[debug] RBA F1.1 curl: command failed (exit $?)"
          # EUR Euro Short-Term Rate: ECB Data Portal SDMX csvdata.
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] ECB ESTR curl: http=%{http_code} size=%{size_download}\n" "https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT?lastNObservations=1&format=csvdata" -o rate_eur_ref.csv || echo "[debug] ECB ESTR curl: command failed (exit $?)"
          # GBP SONIA: Bank of England Interactive Database (Serie IUDSOIA).
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] BoE SONIA curl: http=%{http_code} size=%{size_download}\n" "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jun/2026&Dateto=now&SeriesCodes=IUDSOIA&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N" -o rate_gbp_ref.csv || echo "[debug] BoE SONIA curl: command failed (exit $?)"
          # CAD CORRA: Bank of Canada Valet API (Serie AVG.INTWO).
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] BoC CORRA curl: http=%{http_code} size=%{size_download}\n" "https://www.bankofcanada.ca/valet/observations/AVG.INTWO/json?recent=5" -o rate_cad_ref.json || echo "[debug] BoC CORRA curl: command failed (exit $?)"
          # CHF SARON: SNB Data Portal Cube "snbgwdzid" (Interest rates and
          # threshold factor), Dimension SARON, letzte ~10 Tage (neuester Wert
          # gewinnt). Live-verifiziert 2026-07-26 (workflow_dispatch-Testlauf):
          # liefert echtes semikolon-getrenntes CSV mit Anfuehrungszeichen um
          # jedes Feld ("Date";"D0";"Value") - siehe parseChfRef().
          FROM_D=$(date -u -d '10 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-10d +%Y-%m-%d)
          TO_D=$(date -u +%Y-%m-%d)
          curl -sL --connect-timeout 15 --max-time 30 -A "$UA" -w "[debug] SNB SARON curl: http=%{http_code} size=%{size_download}\n" "https://data.snb.ch/api/cube/snbgwdzid/data/csv/en?dimSel=D0(SARON)&fromDate=${FROM_D}&toDate=${TO_D}" -o rate_chf_ref.csv || echo "[debug] SNB SARON curl: command failed (exit $?)"
          # JPY/NZD Referenzzins: KEIN eigener Fetch auf boj.or.jp/rbnz.govt.nz -
          # der erste Live-Testlauf (2026-07-26) zeigte, dass (a) BoJs Seite
          # zwar antwortet, aber ohne bekannte Tabellenstruktur nicht blind
          # parsebar ist, und (b) RBNZs Statistik-Seite die GitHub-Runner-IP
          # per Cloudflare mit HTTP 403 blockt (dieselbe Blockade, die dieses
          # Projekt fuer RBNZ-Dateien beim NZD-Bond-Yield-Backfill bereits
          # dokumentiert hat, siehe CLAUDE.md). Stattdessen: der weiter oben in
          # diesem selben Workflow-Lauf bereits erzeugte ind_data.json-Eintrag
          # "Central Bank Rate" (BoJ-Leitzins bzw. RBNZ OCR, ueber den
          # bestehenden, zuverlaessigen TradingView-Kalender-Feed) wird
          # wiederverwendet (siehe parseJpyRef()/parseNzdRef() - lesen direkt
          # die lokale Datei, kein zusaetzlicher Netzwerk-Request noetig). Fuer
          # JPY/NZD ist der Leitzins strukturell fast identisch zum jeweiligen
          # Futures-Referenzzins (TONA folgt dem BoJ-Call-Rate-Ziel sehr eng,
          # NZ-OCR ist ohnehin schon der crossBenchmark-Ankerpunkt) - kein
          # Genauigkeitsverlust ggue. einem direkten SARON/TONA-Fetch.
          echo "=== ref-rate responses (first 200 chars each) ==="
          for f in rate_usd_ref.json rate_aud_ref.csv rate_eur_ref.csv rate_gbp_ref.csv rate_cad_ref.json rate_chf_ref.csv; do echo "--- $f ---"; head -c 200 "$f" 2>/dev/null || echo "(missing)"; echo; done

          # Futures-Kurven: EIN gemeinsamer TradingView-Scanner-Call fuer alle
          # Wurzeln (CBOT:ZQ/ASX24:IB praezise 1-Monats-Ketten 14 Monate
          # voraus; TMX:CRA/ICEEUR:SO3/ICEEUR:I bisherige approximative
          # 3-Monats-Ketten; EUREX:FSR3 neue 3-Monats-Kette fuer CHF).
          # OSE:TOA3M (JPY/TONA) und ASX24:BB (NZD/NZ-Bank-Bill) sind PER
          # workflow_dispatch-Testlauf 2026-07-26 BESTAETIGT ohne jede Daten
          # ueber diesen Scanner-Endpunkt (0 von 42 zurueckgelieferten
          # Symbolen, obwohl beide Ticker auf TradingViews Chart-Seiten
          # selbst existieren - OSE/ASX24-NZ-Produkte scheinen ueber
          # /global/scan schlicht nicht indexiert zu sein, anders als
          # ASX24:IB, das ueber denselben Endpunkt einwandfrei funktioniert).
          # Bleiben als dokumentierter Versuch stehen (kein Schaden, liefern
          # zuverlaessig 0 Kontrakte -> CHF/JPY/NZD-Skip-Pfad in CCY_CFG) -
          # nicht erneut blind testen, sondern zuerst eine andere Quelle fuer
          # eine JPY/NZD-Forward-Kurve recherchieren, falls das je wieder
          # versucht wird. ICEEUR:EMP/ICEEUR:EON/ICEEUR:SOA/TMX:COA sind
          # ebenfalls BESTAETIGT ohne Daten (EUR/GBP/CAD-Praezisions-Upgrade-
          # Versuch, 2026-07-26) - bleibt automatisch bei der bisherigen
          # approx-Konfiguration, siehe CCY_CFG weiter unten.
          node -e '
            const fs=require("fs");
            const CODE=["","F","G","H","J","K","M","N","Q","U","V","X","Z"];
            const today=new Date();
            const tickers=[];
            const push=(root,n)=>{for(let i=0;i<n;i++){const d=new Date(today.getFullYear(),today.getMonth()+i,1);tickers.push(root+CODE[d.getMonth()+1]+d.getFullYear());}};
            push("CBOT:ZQ",14);
            push("ASX24:IB",10);
            push("TMX:CRA",8);
            push("ICEEUR:SO3",8);
            push("ICEEUR:I",8);
            push("EUREX:FSR3",14);
            push("OSE:TOA3M",14);
            push("ASX24:BB",14);
            push("ICEEUR:EMP",12);
            push("ICEEUR:EON",8);
            push("ICEEUR:SOA",8);
            push("TMX:COA",8);
            fs.writeFileSync("rate_tv_tickers.json",JSON.stringify(tickers));
          '
          TICKERS=$(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("rate_tv_tickers.json","utf8"))))')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data "{\"symbols\":{\"tickers\":${TICKERS},\"query\":{\"types\":[]}},\"columns\":[\"close\"]}" \
            -w "[debug] scanner curl: http=%{http_code} size=%{size_download}\n" \
            "https://scanner.tradingview.com/global/scan" -o rate_tv.json || true
          echo "=== TradingView scanner response (first 500 chars) ==="
          head -c 500 rate_tv.json 2>/dev/null || echo "(missing)"
          echo
          # Diagnose (Nutzer-Wunsch 2026-07-26, 3. Iteration): JPY/NZD lieferten
          # trotz jetzt korrektem Referenzzins (ind_data.json) 0 Kontrakte fuer
          # OSE:TOA3M/ASX24:BB - unklar, ob die Wurzel falsch ist oder nur die
          # angefragten Monate keine gelisteten Kontrakte treffen. Listet ALLE
          # zurueckgelieferten Ticker-Symbole (nicht nur die ersten 500 Zeichen),
          # damit der naechste Job-Log das zweifelsfrei zeigt statt zu raten.
          echo "=== TradingView scanner: all returned symbols ==="
          node -e 'try{const d=JSON.parse(require("fs").readFileSync("rate_tv.json","utf8"));(d.data||[]).forEach(r=>console.log(r.s+" = "+(r.d&&r.d[0])));}catch(e){console.log("parse failed: "+e.message);}'

          node -e '
            const fs=require("fs");
            const today=new Date().toISOString().slice(0,10);
            const round2=v=>Math.round(v*100)/100;
            const CODE=["F","G","H","J","K","M","N","Q","U","V","X","Z"];

            // ── Referenzzinsen parsen (je Waehrung eigenes Format) ──────────
            function parseUsdRef(){
              try{const d=JSON.parse(fs.readFileSync("rate_usd_ref.json","utf8"));const r=d&&Array.isArray(d.refRates)&&d.refRates[0];const v=r&&Number(r.percentRate);return isFinite(v)?v:null;}catch(e){return null;}
            }
            function parseAudRef(){
              // RBA F1.1-CSV (Live-Probe 2026-07-25 bestaetigt das echte Format,
              // erster Anlauf scheiterte daran): ~9998 Zeilen zurueck bis 1969,
              // MONATLICHE Datenzeilen im Format "DD/MM/YYYY,<Cash Rate Target>,
              // ...". new Date("DD/MM/YYYY") ist eine FALLE - JS interpretiert
              // Schraegstrich-Daten als US-Format MM/DD/YYYY, Tage >12 (die
              // meisten) werden dadurch als ungueltiger Monat verworfen (bei
              // Tagen <=12 waere es sogar STILL falsch geparst, nicht nur
              // verworfen) - deshalb explizites DD/MM/YYYY-Regex statt new Date().
              // Spalte 2 (Index 1) ist "Cash Rate Target". Letzte Zeile mit
              // gueltigem Datum+Wert gewinnt (monatliche Reihe, der Zielsatz
              // aendert sich zwischen den ~8 RBA-Sitzungen/Jahr nicht, daher ist
              // der juengste Monatswert praktisch immer der aktuell gueltige -
              // ausser genau zwischen einer Sitzung und der naechsten Monats-
              // Veroeffentlichung, was strukturell nicht vermeidbar ist).
              try{
                const lines=fs.readFileSync("rate_aud_ref.csv","utf8").split(/\r?\n/);
                const re=/^(\d{2})\/(\d{2})\/(\d{4}),([^,]*)/;
                let last=null;
                lines.forEach(line=>{
                  const m=re.exec(line);
                  if(!m)return;
                  const v=Number(m[4]);
                  if(isFinite(v)&&m[4].trim()!=="")last=v;
                });
                return last;
              }catch(e){return null;}
            }
            function parseEurRef(){
              // ECB SDMX csvdata: Header-Zeile + eine Datenzeile, OBS_VALUE-Spalte.
              try{
                const lines=fs.readFileSync("rate_eur_ref.csv","utf8").split(/\r?\n/).filter(l=>l.trim());
                if(lines.length<2)return null;
                const hdr=lines[0].split(",");
                const idx=hdr.indexOf("OBS_VALUE");
                if(idx<0)return null;
                const v=Number(lines[lines.length-1].split(",")[idx]);
                return isFinite(v)?v:null;
              }catch(e){return null;}
            }
            function parseGbpRef(){
              // BoE-CSV: "DATE,IUDSOIA\n01 Jun 2026,3.7291\n...", letzte Zeile.
              try{
                const lines=fs.readFileSync("rate_gbp_ref.csv","utf8").split(/\r?\n/).filter(l=>l.trim());
                if(lines.length<2)return null;
                const v=Number(lines[lines.length-1].split(",")[1]);
                return isFinite(v)?v:null;
              }catch(e){return null;}
            }
            function parseCadRef(){
              try{
                const d=JSON.parse(fs.readFileSync("rate_cad_ref.json","utf8"));
                const obs=d&&Array.isArray(d.observations)?d.observations:[];
                for(let i=obs.length-1;i>=0;i--){
                  const v=obs[i]&&obs[i]["AVG.INTWO"]&&Number(obs[i]["AVG.INTWO"].v);
                  if(isFinite(v))return v;
                }
                return null;
              }catch(e){return null;}
            }
            function parseChfRef(){
              // SNB-Cube-CSV (Cube "snbgwdzid", Dimension SARON) - Live-Format
              // 2026-07-26 bestaetigt: Semikolon-getrennt, JEDES Feld in
              // Anfuehrungszeichen, z.B. Zeile 4 = "Date";"D0";"Value", danach
              // Datenzeilen wie "2026-07-16";"SARON";"-0.04". Anfuehrungszeichen
              // muessen vor dem Number()-Parse entfernt werden (sonst NaN durch
              // die eingeschlossenen "-Zeichen).
              try{
                const raw=fs.readFileSync("rate_chf_ref.csv","utf8");
                const lines=raw.split(/\r?\n/).filter(l=>l.trim());
                for(let i=lines.length-1;i>=0;i--){
                  const cols=lines[i].split(";").map(c=>c.trim().replace(/^"|"$/g,""));
                  if(cols.length<2)continue;
                  const v=Number(cols[cols.length-1]);
                  if(isFinite(v)&&/\d{4}/.test(cols[0]))return v;
                }
                return null;
              }catch(e){return null;}
            }
            // JPY/NZD: kein eigener Netzwerk-Request auf boj.or.jp/rbnz.govt.nz
            // (siehe Kommentar bei den curl-Fetches oben) - liest stattdessen
            // den bereits im selben Workflow-Lauf aktualisierten "Central Bank
            // Rate"-Eintrag aus ind_data.json (derselbe TradingView-Kalender-
            // Feed, der auch die Indikator-Karte in der App speist). Match ueber
            // den KANONISCHEN Indikator-Namen "Central Bank Rate" (nicht den
            // waehrungsspezifischen Anzeigenamen), exakt wie IND_DATA_FEED das
            // in index.html selbst erwartet.
            function parseCbRateFromIndData(ccy){
              try{
                const d=JSON.parse(fs.readFileSync("ind_data.json","utf8"));
                const actual=d&&d[ccy]&&d[ccy]["Central Bank Rate"]&&d[ccy]["Central Bank Rate"].actual;
                if(actual==null)return null;
                const m=String(actual).match(/-?\d+(\.\d+)?/);
                return m?Number(m[0]):null;
              }catch(e){return null;}
            }
            function parseJpyRef(){return parseCbRateFromIndData("JPY");}
            function parseNzdRef(){return parseCbRateFromIndData("NZD");}

            // ── Futures-Kurve parsen: Ticker-Root -> {monthKey:"YYYY-MM"->rate} ──
            let tvResp;try{tvResp=JSON.parse(fs.readFileSync("rate_tv.json","utf8"));}catch(e){tvResp=null;}
            const tvRows=(tvResp&&Array.isArray(tvResp.data))?tvResp.data:[];
            function curveFor(rootEsc){
              const re=new RegExp("^"+rootEsc+"([A-Z])(\\d{4})$");
              const out={};let n=0;
              tvRows.forEach(r=>{
                const m=re.exec(r.s);
                const v=r.d&&r.d[0];
                if(!m||v==null||!isFinite(Number(v)))return;
                const mo=CODE.indexOf(m[1])+1;if(mo<1)return;
                out[m[2]+"-"+String(mo).padStart(2,"0")]=100-Number(v);
                n++;
              });
              return{rates:out,n};
            }
            const zqCurve=curveFor("CBOT\\:ZQ");
            const ibCurve=curveFor("ASX24\\:IB");
            const craCurve=curveFor("TMX\\:CRA");
            const so3Curve=curveFor("ICEEUR\\:SO3");
            const ieCurve=curveFor("ICEEUR\\:I");
            const fsr3Curve=curveFor("EUREX\\:FSR3");
            const toa3mCurve=curveFor("OSE\\:TOA3M");
            const bbCurve=curveFor("ASX24\\:BB");
            // Experimentelle 1-Monats-/sitzungsdatierte Kandidaten fuer den
            // EUR/GBP/CAD-Praezisions-Upgrade (siehe CCY_CFG weiter unten -
            // wird nur genutzt, wenn n>0, sonst faellt die bisherige
            // approx-Konfiguration automatisch zurueck).
            const empCurve=curveFor("ICEEUR\\:EMP");
            const eonCurve=curveFor("ICEEUR\\:EON");
            const soaCurve=curveFor("ICEEUR\\:SOA");
            const coaCurve=curveFor("TMX\\:COA");

            // ── PRAEZISE Methode (USD/AUD): identisch zur urspruenglichen
            //    ZQ-Verkettungslogik, nur parametrisiert (siehe Blockkommentar
            //    oben im YAML fuer die Herleitung/Bugfix-Historie).
            function preciseMethod(Rcurrent,monthlyRate,MEETINGS){
              let Rprev=Rcurrent;
              const meetings=[];
              MEETINGS.filter(([d])=>d>=today).forEach(([date,label])=>{
                const [y,mo,day]=date.split("-").map(Number);
                const monthKey=y+"-"+String(mo).padStart(2,"0");
                const contractRate=monthlyRate[monthKey];
                if(contractRate==null){meetings.push({date,label,rateBefore:round2(Rprev),rateAfter:null,deltaBp:null});return;}
                const prevMonthDate=new Date(y,mo-2,1);
                const prevMonthKey=prevMonthDate.getFullYear()+"-"+String(prevMonthDate.getMonth()+1).padStart(2,"0");
                const prevMeetingInThatMonth=MEETINGS.some(([d2])=>d2.slice(0,7)===prevMonthKey);
                if(!prevMeetingInThatMonth&&monthlyRate[prevMonthKey]!=null)Rprev=monthlyRate[prevMonthKey];
                const daysInMonth=new Date(y,mo,0).getDate();
                const before=day,after=daysInMonth-before;
                const nextMonthDate=new Date(y,mo,1);
                const nextMonthKey=nextMonthDate.getFullYear()+"-"+String(nextMonthDate.getMonth()+1).padStart(2,"0");
                const nextMeetingInThatMonth=MEETINGS.some(([d2])=>d2.slice(0,7)===nextMonthKey);
                const cleanNext=(!nextMeetingInThatMonth&&monthlyRate[nextMonthKey]!=null)?monthlyRate[nextMonthKey]:null;
                const Rafter=cleanNext!=null?cleanNext:(after<=0?contractRate:(contractRate*daysInMonth-before*Rprev)/after);
                const deltaBp=Math.round((Rafter-Rprev)*100);
                meetings.push({date,label,rateBefore:round2(Rprev),rateAfter:round2(Rafter),deltaBp});
                Rprev=Rafter;
              });
              return meetings;
            }

            // ── APPROXIMATIVE Methode (EUR/GBP/CAD): 3-Monats-Kontrakte als
            //    glatte, linear interpolierte Forward-Kurve gelesen (Ankerpunkte:
            //    je ein Punkt am 15. jedes Kontraktmonats). Pro Sitzung wird die
            //    Kurve am MITTELPUNKT ihrer "Kontrollperiode" (bis zur naechsten
            //    Sitzung, letzte +45 Tage) abgetastet - liefert die vom Markt
            //    ueber diesen Zeitraum im Schnitt erwartete Zins-Stufe. Kein
            //    Raten: jede Zahl stammt direkt aus echten, gerade abgerufenen
            //    Kontraktpreisen, aber die Meeting-Zuordnung ist eine
            //    dokumentierte Naeherung (siehe method:"approx" im Output +
            //    Info-Text im Client).
            //
            //    crossBenchmark-Parameter (Live-Test-Fund 2026-07-25): GBP/CAD
            //    nutzen SONIA-3M/CORRA-3M-Futures, die WOERTLICH denselben
            //    Referenzzins (SONIA/CORRA) verketten wie der Spot-Wert - dort
            //    ist der heutige Spot-Referenzzins ein GUELTIGER Kurven-Ankerpunkt.
            //    EUR nutzt dagegen Euribor-3M-Futures (kein €STR-Future frei
            //    verfuegbar) - Euribor ist ein ANDERER Zins als €STR (unbesicherter
            //    Termingeldsatz mit Kredit-/Liquiditaetsspread, historisch grob
            //    +10-40bp ueber €STR, aber nicht exakt bekannt/live abrufbar).
            //    Wuerde man €STR direkt als ersten Kurvenpunkt einsetzen, entstuende
            //    ein kuenstlicher Sprung beim ersten Meeting (Spread verwechselt mit
            //    einer erwarteten Zinsaenderung) - im Test mit echten Kontraktdaten
            //    reproduziert (+43bp Phantom-Sprung). Fix: bei crossBenchmark=true
            //    wird der "heute"-Ankerpunkt stattdessen RUECKWAERTS aus den beiden
            //    naechsten Kurvenpunkten EXTRAPOLIERT (bleibt innerhalb derselben
            //    Euribor-Serie, keine Quellen-Vermischung) - der Spot-€STR-Wert wird
            //    weiterhin fuer die "Current rate"-Anzeige verwendet, nur nicht als
            //    Kettenstart der Meeting-Deltas.
            function approxMethod(Rcurrent,monthlyRate,MEETINGS,crossBenchmark){
              const curvePts=Object.keys(monthlyRate).sort().map(k=>{
                const[y,m]=k.split("-").map(Number);
                return{t:new Date(y,m-1,15).getTime(),r:monthlyRate[k]};
              });
              const todayMs=new Date(today+"T00:00:00").getTime();
              let Rtoday=Rcurrent;
              if(crossBenchmark&&curvePts.length>=2&&curvePts[0].t>todayMs){
                const slope=(curvePts[1].r-curvePts[0].r)/(curvePts[1].t-curvePts[0].t);
                Rtoday=curvePts[0].r+slope*(todayMs-curvePts[0].t);
              }
              const anchors=[{t:todayMs,r:Rtoday},...curvePts].sort((a,b)=>a.t-b.t);
              function curveAt(t){
                if(anchors.length===0)return null;
                if(t<=anchors[0].t)return anchors[0].r;
                if(t>=anchors[anchors.length-1].t)return anchors[anchors.length-1].r;
                for(let i=0;i<anchors.length-1;i++){
                  if(t>=anchors[i].t&&t<=anchors[i+1].t){
                    const frac=(t-anchors[i].t)/(anchors[i+1].t-anchors[i].t);
                    return anchors[i].r+frac*(anchors[i+1].r-anchors[i].r);
                  }
                }
                return anchors[anchors.length-1].r;
              }
              const upcoming=MEETINGS.filter(([d])=>d>=today);
              let Rprev=Rtoday;
              const meetings=[];
              upcoming.forEach(([date,label],idx)=>{
                const periodEndMs=idx+1<upcoming.length?new Date(upcoming[idx+1][0]+"T00:00:00").getTime():new Date(date+"T00:00:00").getTime()+45*86400000;
                const midMs=(new Date(date+"T00:00:00").getTime()+periodEndMs)/2;
                const Rafter=curveAt(midMs);
                if(Rafter==null){meetings.push({date,label,rateBefore:round2(Rprev),rateAfter:null,deltaBp:null,approx:true});return;}
                const deltaBp=Math.round((Rafter-Rprev)*100);
                meetings.push({date,label,rateBefore:round2(Rprev),rateAfter:round2(Rafter),deltaBp,approx:true});
                Rprev=Rafter;
              });
              return meetings;
            }

            // ── Offizielle Sitzungstermine je Zentralbank (Entscheidungstag,
            //    aus federalreserve.gov/rba.gov.au/ecb.europa.eu/bankofengland.co.uk/
            //    bankofcanada.ca recherchiert). 2027-Termine folgen, sobald
            //    veroeffentlicht - dann hier ergaenzen (wie bisher bei FOMC).
            const MEETINGS_BY_CCY={
              USD:[
                ["2025-01-29","Jan 28-29, 2025"],["2025-03-19","Mar 18-19, 2025"],
                ["2025-05-07","May 6-7, 2025"],["2025-06-18","Jun 17-18, 2025"],
                ["2025-07-30","Jul 29-30, 2025"],["2025-09-17","Sep 16-17, 2025"],
                ["2025-10-29","Oct 28-29, 2025"],["2025-12-10","Dec 9-10, 2025"],
                ["2026-01-28","Jan 27-28, 2026"],["2026-03-18","Mar 17-18, 2026"],
                ["2026-04-29","Apr 28-29, 2026"],["2026-06-17","Jun 16-17, 2026"],
                ["2026-07-29","Jul 28-29, 2026"],["2026-09-16","Sep 15-16, 2026"],
                ["2026-10-28","Oct 27-28, 2026"],["2026-12-09","Dec 8-9, 2026"]
              ],
              AUD:[
                ["2026-02-03","Feb 2-3, 2026"],["2026-03-17","Mar 16-17, 2026"],
                ["2026-05-05","May 4-5, 2026"],["2026-06-16","Jun 15-16, 2026"],
                ["2026-08-11","Aug 10-11, 2026"],["2026-09-29","Sep 28-29, 2026"],
                ["2026-11-03","Nov 2-3, 2026"],["2026-12-08","Dec 7-8, 2026"]
              ],
              EUR:[
                ["2026-01-25","Jan 25, 2026"],["2026-03-19","Mar 19, 2026"],
                ["2026-04-30","Apr 30, 2026"],["2026-06-11","Jun 11, 2026"],
                ["2026-07-23","Jul 23, 2026"],["2026-09-10","Sep 10, 2026"],
                ["2026-10-29","Oct 29, 2026"],["2026-12-17","Dec 17, 2026"]
              ],
              GBP:[
                ["2026-02-05","Feb 5, 2026"],["2026-03-19","Mar 19, 2026"],
                ["2026-04-30","Apr 30, 2026"],["2026-06-18","Jun 18, 2026"],
                ["2026-07-30","Jul 30, 2026"],["2026-09-17","Sep 17, 2026"],
                ["2026-11-05","Nov 5, 2026"],["2026-12-17","Dec 17, 2026"]
              ],
              // BoC: nur Termine ab Juli 2026 recherchiert/bestaetigt (fruehere
              // 2026-Termine liegen ohnehin in der Vergangenheit und werden nie
              // angezeigt - Jul 15 dient als letztes VERGANGENES Meeting fuer
              // die pastMeeting-Kennzeichnung, siehe unten).
              CAD:[
                ["2026-07-15","Jul 15, 2026"],["2026-09-02","Sep 2, 2026"],
                ["2026-10-28","Oct 28, 2026"],["2026-12-09","Dec 9, 2026"]
              ],
              // SNB: nur quartalsweise (Maerz/Jun/Sep/Dez). Maerz+Jun 2026
              // per snb.ch-Pressemitteilung bestaetigt. Sep/Dez 2026 (24.
              // September/10. Dezember) per Recherche gefunden (neho.ch,
              // 2026-07-27) und gegen das bekannte SNB-Muster verifiziert
              // (Entscheide fallen immer auf einen Donnerstag 09:30 - beide
              // Daten sind rechnerisch bestaetigt Donnerstage) - snb.ch
              // selbst blieb per direktem Fetch/WebFetch aus dieser Sandbox
              // durchgehend 403/blockiert, daher keine Primaerquelle direkt
              // einsehbar, aber die Donnerstag-Probe deckt sich mit allen
              // bisher bestaetigten SNB-Terminen in dieser Datei.
              CHF:[
                ["2026-03-19","Mar 17-18, 2026"],["2026-06-18","Jun 16-17, 2026"],
                ["2026-09-24","Sep 24, 2026"],["2026-12-10","Dec 10, 2026"]
              ],
              // BoJ: vollstaendiger 2026-Kalender (boj.or.jp bestaetigt).
              JPY:[
                ["2026-01-23","Jan 22-23, 2026"],["2026-03-19","Mar 18-19, 2026"],
                ["2026-04-28","Apr 27-28, 2026"],["2026-06-16","Jun 15-16, 2026"],
                ["2026-07-31","Jul 30-31, 2026"],["2026-09-18","Sep 17-18, 2026"],
                ["2026-10-30","Oct 29-30, 2026"],["2026-12-18","Dec 17-18, 2026"]
              ],
              // RBNZ: 7 Entscheidungen/Jahr, hier nur die ab Jul 2026
              // bestaetigten (rbnz.govt.nz) - fruehere 2026-Termine (Feb/Apr/Mai)
              // liegen ohnehin in der Vergangenheit und wuerden nie angezeigt,
              // exakt das bereits bei BoC etablierte Muster.
              NZD:[
                ["2026-07-08","Jul 8, 2026"],["2026-09-02","Sep 2, 2026"],
                ["2026-10-28","Oct 28, 2026"],["2026-12-09","Dec 9, 2026"]
              ]
            };

            // method-Funktionen einheitlich als (Rcurrent,rates,meetings)=>meetings[]
            // gewrappt, damit der Aufruf unten fuer alle Waehrungen gleich bleibt
            // (crossBenchmark=true nur, wenn Futures-Benchmark != Referenzzins-
            // Benchmark, siehe approxMethod-Kommentar).
            //
            // EUR/GBP/CAD versuchen zuerst ein 1-Monats-/sitzungsdatiertes
            // Kandidaten-Kontrakt (siehe empCurve/eonCurve/soaCurve/coaCurve
            // oben) - liefert TradingView dafuer 0 Kontrakte (wie beim letzten
            // Live-Test dieser 3 Waehrungen), faellt automatisch auf die
            // bisherige, bewaehrte 3-Monats-Approx-Konfiguration zurueck. Kein
            // manueller Eingriff noetig, einfach das naechste workflow_dispatch-
            // Job-Log pruefen (siehe CCY-Zusammenfassungszeile ganz unten).
            const eurCfg=empCurve.n>0
              ?{curve:empCurve,isPrecise:true,method:preciseMethod,refSource:"ECB (€STR) + ECB Dated €STR futures"}
              :eonCurve.n>0
                ?{curve:eonCurve,isPrecise:true,method:preciseMethod,refSource:"ECB (€STR) + One-Month €STR futures"}
                :{curve:ieCurve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,true),refSource:"ECB (€STR) + Euribor 3M curve"};
            const gbpCfg=soaCurve.n>0
              ?{curve:soaCurve,isPrecise:true,method:preciseMethod,refSource:"BoE (SONIA) + One-Month SONIA futures"}
              :{curve:so3Curve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,false),refSource:"BoE (SONIA) + SONIA 3M curve"};
            const cadCfg=coaCurve.n>0
              ?{curve:coaCurve,isPrecise:true,method:preciseMethod,refSource:"BoC (CORRA) + One-Month CORRA futures"}
              :{curve:craCurve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,false),refSource:"BoC (CORRA) + CORRA 3M curve"};
            const CCY_CFG={
              USD:{ref:parseUsdRef,curve:zqCurve,isPrecise:true,method:preciseMethod,refSource:"NY Fed (EFFR)"},
              AUD:{ref:parseAudRef,curve:ibCurve,isPrecise:true,method:preciseMethod,refSource:"RBA (Cash Rate Target)"},
              EUR:{ref:parseEurRef,...eurCfg},
              GBP:{ref:parseGbpRef,...gbpCfg},
              CAD:{ref:parseCadRef,...cadCfg},
              // CHF/JPY: Futures-Benchmark = Referenzzins-Benchmark (SARON-Future
              // misst SARON, TONA-Future misst TONA) - kein Cross-Benchmark-Spread
              // wie bei EURs Euribor-vs-€STR-Fall, daher crossBenchmark:false trotz
              // approx-Methode. Nur 3-Monats-Kontrakte frei verfuegbar (kein
              // 1-Monats-/sitzungsdatiertes Pendant existiert), daher strukturell
              // kein precise moeglich (siehe Plan-Notiz/CLAUDE.md).
              CHF:{ref:parseChfRef,curve:fsr3Curve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,false),refSource:"SNB (SARON) + SARON 3M futures"},
              JPY:{ref:parseJpyRef,curve:toa3mCurve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,false),refSource:"BoJ (policy rate, via ind_data.json) + TONA 3M futures"},
              // NZD: einziges frei verfuegbare Kontrakt ist der 90-Tage-NZ-Bank-
              // Bill-Future (BKBM-Satz) - das ist NICHT der OCR-Referenzzins
              // selbst (Bank-Bill traegt einen Kreditspread ueber dem OCR, exakt
              // wie Euribor vs. €STR) - deshalb crossBenchmark:true wie bei EUR.
              NZD:{ref:parseNzdRef,curve:bbCurve,isPrecise:false,method:(r,c,m)=>approxMethod(r,c,m,true),refSource:"RBNZ (OCR, via ind_data.json) + NZ 90-Day Bank Bill 3M curve"}
            };

            // ── Bestehende Datei laden (Multi-Waehrungs-Struktur; migriert
            //    automatisch aus dem alten Flat-USD-Format falls noch vorhanden).
            let full={};
            try{
              const d=JSON.parse(fs.readFileSync("rate_probabilities.json","utf8"));
              if(d&&typeof d==="object"){
                if(d.USD||d.AUD||d.EUR||d.GBP||d.CAD)full=d;
                else if(d.currentRate!=null)full={USD:d}; // Alt-Format-Migration
              }
            }catch(e){}

            const summary=[];
            Object.keys(CCY_CFG).forEach(ccy=>{
              const cfg=CCY_CFG[ccy];
              const Rcurrent=cfg.ref();
              if(Rcurrent==null){summary.push(ccy+": ref-rate unreadable, skipped (kept existing)");return;}
              if(cfg.curve.n===0){summary.push(ccy+": 0 futures contracts, skipped (kept existing)");return;}
              const meetings=cfg.method(Rcurrent,cfg.curve.rates,MEETINGS_BY_CCY[ccy]);

              let out=full[ccy]&&typeof full[ccy]==="object"?full[ccy]:{history:[]};
              out.asOf=today;
              out.currentRate=round2(Rcurrent);
              out.meetings=meetings;
              out.method=cfg.isPrecise?"precise":"approx";
              out.refSource=cfg.refSource;
              out.history=Array.isArray(out.history)?out.history.filter(e=>e&&e[0]!==today):[];
              out.history.push([today,round2(Rcurrent),meetings.filter(m=>m.deltaBp!=null).map(m=>[m.date,m.deltaBp])]);
              out.history.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              if(out.history.length>400)out.history.splice(0,out.history.length-400);

              // Zuletzt VERGANGENER Termin (echtes Ergebnis, ausschliesslich aus
              // der taeglich akkumulierten Referenzzins-Historie abgeleitet -
              // siehe Blockkommentar oben im YAML, identisches Prinzip fuer
              // alle 5 Waehrungen).
              const pastCandidates=MEETINGS_BY_CCY[ccy].filter(([d])=>d<today).slice(-1);
              let pastMeeting=null;
              if(pastCandidates.length){
                const[pd,plabel]=pastCandidates[0];
                const before=out.history.filter(h=>h[0]<pd).slice(-1)[0];
                const after=out.history.filter(h=>h[0]>pd).slice(0,1)[0];
                if(before&&after){
                  const deltaBp=Math.round((after[1]-before[1])*100);
                  const bucket=Math.round(deltaBp/25)*25;
                  pastMeeting={date:pd,label:plabel,realizedDeltaBp:deltaBp,realizedBucket:bucket,rateBefore:before[1],rateAfter:after[1]};
                }
              }
              out.pastMeeting=pastMeeting;

              full[ccy]=out;
              summary.push(ccy+": ref="+Rcurrent+"%, "+cfg.curve.n+" contracts, "+meetings.length+" upcoming, method="+out.method+", history="+out.history.length+"d"+(pastMeeting?", past="+pastMeeting.realizedDeltaBp+"bp":""));
            });

            fs.writeFileSync("rate_probabilities.json",JSON.stringify(full,null,1));
            console.log("rate_probabilities.json:\n  "+summary.join("\n  "));
          '
          rm -f rate_usd_ref.json rate_aud_ref.csv rate_eur_ref.csv rate_gbp_ref.csv rate_cad_ref.json rate_chf_ref.csv rate_tv.json rate_tv_tickers.json

      # Nutzer-Wunsch 2026-08-06: Dashboard-Karte ganz rechts mit den neusten
      # Finanz-Schlagzeilen (Fed-Reden, Geopolitik/Oel, Index-Ausblick, ...).
      # Quelle: Marketaux (aggregiert ~5.000 Nachrichtenquellen, spezialisiert
      # auf Finanz-/Marktnews, Free-Tier 100 Requests/Tag - bei 1 Request/
      # stuendlichem Lauf = 24/Tag reichlich Puffer). Optional wie Myfxbook:
      # Repo -> Settings -> Secrets and variables -> Actions -> New repository
      # secret: MARKETAUX_API_KEY (kostenloser Account auf marketaux.com).
      # Ohne den Secret bleibt news_data.json leer - die Dashboard-Karte zeigt
      # dann ehrlich "No headlines yet" statt erfundener Schlagzeilen.
      # Suchbegriffe bewusst auf die in der App gelisteten Assets/Makro-Themen
      # zugeschnitten (Grundsatz "nur nuetzliche Daten ziehen"), nicht auf
      # allgemeine Nachrichten. ⚠️ Der genaue Marketaux-Query-Syntax (Boolean-
      # Operatoren fuer den search-Parameter) ist HIER NOCH UNGETESTET, da
      # diese Sandbox keinen Netzwerkzugriff auf marketaux.com hat - wie bei
      # jeder neuen Quelle in diesem Projekt (Bond-Yields, Rate Probabilities,
      # ...) muss der erste echte workflow_dispatch-Lauf per Job-Log
      # verifiziert werden, danach ggf. den Query iterativ anpassen.
      - name: Fetch financial news headlines -> news_data.json
        continue-on-error: true
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: |
          rm -f news_marketaux.json
          if [ -n "$MARKETAUX_API_KEY" ]; then
            Q='(Fed OR "Federal Reserve" OR Powell OR ECB OR "Bank of England" OR "Bank of Japan" OR "Reserve Bank" OR "interest rate" OR inflation OR "central bank" OR Hormuz OR OPEC OR oil OR gold OR silver OR bitcoin OR crypto OR "S&P 500" OR Nasdaq OR "stock market")'
            Q_ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$Q")
            curl -sL --max-time 20 "https://api.marketaux.com/v1/news/all?api_token=${MARKETAUX_API_KEY}&language=en&limit=20&sort=published_desc&search=${Q_ENC}" -o news_marketaux.json || true
            echo "[debug] marketaux response: $(wc -c < news_marketaux.json 2>/dev/null || echo 0) bytes"
            head -c 300 news_marketaux.json 2>/dev/null; echo
          else
            echo "[debug] MARKETAUX_API_KEY not set - news_data.json stays empty (see workflow comment to enable)"
          fi
          node -e '
            const fs=require("fs");
            let heads=[];
            try{
              const j=JSON.parse(fs.readFileSync("news_marketaux.json","utf8"));
              const arr=Array.isArray(j&&j.data)?j.data:[];
              heads=arr.map(a=>({
                title:String(a.title||"").trim(),
                url:String(a.url||""),
                source:String(a.source||""),
                publishedAt:String(a.published_at||""),
              })).filter(h=>h.title&&h.url);
            }catch(e){console.log("[debug] news parse: "+e.message);}
            fs.writeFileSync("news_data.json",JSON.stringify({updated:new Date().toISOString(),headlines:heads},null,1));
            console.log("news_data.json: "+heads.length+" headlines");
          '
          rm -f news_marketaux.json

      - name: Cleanup temp files
        run: rm -f thisweek.json nextweek.json fxstreet.json te.json te_pages.json tepage_*.html invcal.json tv.json tv_wide.json tv_recent.json tv_hist_*.json alt_actuals.json ffhtml_*.html cot_raw.json cot_pct_url.txt cot_pct_raw.json stooq_*.csv stooq_meta.txt news_marketaux.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ff_calendar.json ind_data.json
          [ -f bond_data.json ] && git add bond_data.json
          [ -f cot_data.json ] && git add cot_data.json
          [ -f price_data.json ] && git add price_data.json
          [ -f seasonality_data.json ] && git add seasonality_data.json
          [ -f sentiment_data.json ] && git add sentiment_data.json
          [ -f score_hist.json ] && git add score_hist.json
          [ -f rate_probabilities.json ] && git add rate_probabilities.json
          [ -f news_data.json ] && git add news_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update FF calendar + indicator data"
            # Retry mit Rebase bei Push-Kollision (Nutzer-Wunsch 2026-07-13:
            # keine Fehler-E-Mails mehr) - vorher fuehrte ein zeitgleicher
            # manueller Push auf main (z.B. ein Code-Commit waehrend dieser
            # Lauf noch lief) zu "! [rejected] ... fetch first" und einer
            # GitHub-Fehlermail, obwohl alle Datenabrufe erfolgreich waren.
            # Die JSON-Dateien hier sind reine Workflow-Outputs, ein Rebase
            # auf den aktuellen origin/main-Stand ist daher immer konfliktfrei.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "[debug] push rejected (attempt $i/5) - rebasing onto origin/main and retrying"
              git pull --rebase origin main
              sleep 3
            done
          fi
