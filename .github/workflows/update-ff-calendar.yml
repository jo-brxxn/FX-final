name: Update FF Calendar

on:
  schedule:
    # Stuendlich, damit Actual-Werte (z.B. GDP, CPI), die fruehmorgens
    # europaeischer/asiatischer Zeit veroeffentlicht werden, noch am selben
    # Tag in ff_calendar.json landen (nicht erst beim naechsten 12h-Lauf).
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Forex Factory calendar (this + next week)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o thisweek.json || true
          curl -sL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o nextweek.json || true

      - name: Merge into ff_calendar.json
        run: |
          node -e '
            const fs=require("fs");
            function safeParse(file){
              try{
                const d=JSON.parse(fs.readFileSync(file,"utf8"));
                return Array.isArray(d)?d:null;
              }catch(e){return null;}
            }
            const a=safeParse("thisweek.json");
            const b=safeParse("nextweek.json");
            const existing=safeParse("ff_calendar.json")||[];
            if(a===null&&b===null){
              console.log("Both fetches failed/invalid, keeping existing ff_calendar.json");
              process.exit(0);
            }
            const fetched=[...(a||[]),...(b||[])];
            if(fetched.length===0){
              console.log("Empty result, keeping existing ff_calendar.json");
              process.exit(0);
            }
            console.log("Fetched: thisweek="+((a||[]).length)+" nextweek="+((b||[]).length));
            // Key auf Land|Titel|UTC-Kalendertag, damit derselbe Release nicht
            // doppelt landet. Frisch geholte Events haben Vorrang; danach werden
            // ZUKUENFTIGE Events aus der bisherigen Datei ergaenzt, die diesmal
            // nicht (mit)geholt wurden - so verschwindet die Folgewoche nicht,
            // wenn der nextweek-Abruf einmal blockiert wird/leer ist.
            function key(ev){
              const t=new Date(ev.date);
              if(isNaN(t))return null;
              return (ev.country||"")+"|"+(ev.title||"")+"|"+t.toISOString().slice(0,10);
            }
            const map=new Map();
            fetched.forEach(ev=>{const k=key(ev);if(k&&!map.has(k))map.set(k,ev);});
            const now=Date.now();
            let kept=0;
            existing.forEach(ev=>{
              const k=key(ev);if(!k)return;
              const t=new Date(ev.date).getTime();
              if(t>=now-86400000 && !map.has(k)){map.set(k,ev);kept++;}
            });
            const combined=[...map.values()].sort((x,y)=>new Date(x.date)-new Date(y.date));
            fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
            console.log("Wrote "+combined.length+" events ("+kept+" future events preserved from previous file)");
          '

      # Der freie Forex-Factory-Feed (nfs.faireconomy.media) liefert auf den
      # GitHub-Runnern haeufig NUR die laufende Woche (nextweek wird von
      # Cloudflare/Akamai blockiert), weshalb die naechsten 10 Tage komplett
      # fehlten. TradingViews Wirtschaftskalender ist von hier aus zuverlaessig
      # erreichbar und liefert title/country/date/importance/forecast/previous/
      # actual fuer ein frei waehlbares Fenster - er dient daher als Quelle
      # sowohl fuer ZUKUENFTIGE Events als auch fuer Actual-Werte.
      - name: Fetch TradingView economic calendar (today-3d .. today+11d)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          TV_FROM=$(node -e 'console.log(new Date(Date.now()-3*86400e3).toISOString())')
          TV_TO=$(node -e 'console.log(new Date(Date.now()+11*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_FROM}&to=${TV_TO}&countries=US,EU,DE,FR,IT,ES,GB,JP,CA,AU,NZ,CH,CN" -o tv.json || true

      # Zukuenftige High/Medium-Events (naechste 10 Tage) aus TradingView in
      # ff_calendar.json ergaenzen, falls der FF-Feed sie nicht (mehr) enthaelt.
      # Deduplizierung gegen vorhandene FF-Events ueber Waehrung + kanonischen
      # Event-Namen + ET-Kalendertag, damit KEINE Dopplungen entstehen. FF-Namen
      # haben Vorrang (TV fuellt nur Luecken).
      - name: Add upcoming events from TradingView
        run: |
          node -e '
            const fs=require("fs");
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",FR:"EUR",IT:"EUR",ES:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF",CN:"CNY"};
            function fmtVal(v,unit,scale){
              if(v==null||v==="")return "";
              let s=String(v);
              if(unit==="%")s+="%";
              else if(scale)s+=String(scale).toUpperCase();
              return s;
            }
            // Kanonischer Schluessel (identisch zur Enrichment-Logik unten), damit
            // FF "Core CPI m/m" und TV "Core Inflation Rate MoM" als dasselbe
            // Event erkannt werden.
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              // TradingView haengt an viele Titel "Growth Rate" an (z.B. "GDP
              // Growth Rate QoQ"), waehrend der FF-Feed nur "GDP q/q" nutzt -
              // das Wort entfernen, sonst werden beide als verschiedene Events
              // erkannt und es entstehen Dopplungen im Kalender.
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            // ET-Kalendertag (FF-Feed-Tage sind in US-Eastern; Juni = EDT = UTC-4)
            function etDay(iso){const t=new Date(iso).getTime();if(isNaN(t))return null;return new Date(t-4*3600e3).toISOString().slice(0,10);}

            let combined;
            try{combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){combined=[];}
            if(!Array.isArray(combined))combined=[];

            let tv;
            try{tv=JSON.parse(fs.readFileSync("tv.json","utf8"));}catch(e){tv=null;}
            const evts=Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
            if(!evts){console.log("TradingView future events unavailable, keeping ff_calendar.json as is");process.exit(0);}

            // Vorhandene Events indexieren (Waehrung|canonKey|ET-Tag) -> Dedup.
            const have=new Set();
            combined.forEach(ev=>{
              have.add((ev.country||"")+"|"+canonKey(ev.title)+"|"+String(ev.date).slice(0,10));
            });

            const now=Date.now();
            const lo=now-2*86400e3, hi=now+10*86400e3;
            let added=0;
            evts.forEach(ev=>{
              const ccy=TV2CCY[ev.country]||ev.currency;
              if(!ccy||!TV2CCY[ev.country])return;
              const imp=ev.importance;
              const impact=(imp===1||imp==="1")?"High":(imp===0||imp==="0")?"Medium":null;
              if(!impact)return;
              const t=new Date(ev.date).getTime();
              if(isNaN(t)||t<lo||t>hi)return;
              const title=String(ev.title||ev.indicator||"").trim();
              if(!title)return;
              const k=ccy+"|"+canonKey(title)+"|"+etDay(ev.date);
              if(have.has(k))return;
              have.add(k);
              combined.push({
                title:title,country:ccy,date:ev.date,impact:impact,
                forecast:fmtVal(ev.forecast,ev.unit,ev.scale),
                previous:fmtVal(ev.previous,ev.unit,ev.scale),
                actual:ev.actual!=null?fmtVal(ev.actual,ev.unit,ev.scale):"",
                src:"tv"
              });
              added++;
            });
            if(added){
              combined.sort((x,y)=>new Date(x.date)-new Date(y.date));
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
            }
            console.log("TradingView upcoming: added "+added+" future High/Medium event(s)");
          '

      # FXStreet's economic calendar API (calendar-api.fxstreet.com) returns
      # "actual" values that the free FF feed never provides. We fetch a
      # window covering the FF events and merge in any verified actuals.
      - name: Fetch FXStreet actual values
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          RANGE=$(node -e '
            const fs=require("fs");
            try{
              const d=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));
              let minT=Infinity,maxT=-Infinity;
              d.forEach(ev=>{
                const t=new Date(ev.date).getTime();
                if(!isNaN(t)){minT=Math.min(minT,t);maxT=Math.max(maxT,t);}
              });
              if(!isFinite(minT))process.exit(0);
              console.log(new Date(minT-86400000).toISOString()+" "+new Date(maxT+86400000).toISOString());
            }catch(e){process.exit(0);}
          ')
          if [ -n "$RANGE" ]; then
            START=$(echo "$RANGE" | cut -d" " -f1)
            END=$(echo "$RANGE" | cut -d" " -f2)
            curl -sL -A "$UA" -H "Referer: https://www.fxstreet.com/economic-calendar" \
              "https://calendar-api.fxstreet.com/en/api/v1/eventDates/${START}/${END}?volatilities=NONE,LOW,MEDIUM,HIGH&countries=&categories=" -o fxstreet.json || echo '[]' > fxstreet.json
          else
            echo '[]' > fxstreet.json
          fi

      # Fallback-Quellen fuer Actual-Werte, falls FXStreet eine Zahl (noch)
      # nicht fuehrt:
      # 1) Die Forex-Factory-Webseite selbst - dort stehen die Actuals und
      #    die Event-Namen passen 1:1 zum Feed (kein Alias-Mapping noetig).
      # 2) Trading Economics Kalender-API (guest-Zugang).
      - name: Fetch alternative actual sources (FF website + Trading Economics)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          for d in $(node -e '
            const M=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
            const nowET=new Date(Date.now()-4*3600e3);
            for(let i=2;i>=0;i--){
              const x=new Date(nowET.getTime()-i*86400e3);
              console.log(M[x.getUTCMonth()]+x.getUTCDate()+"."+x.getUTCFullYear());
            }
          '); do
            curl -sL -A "$UA" "https://www.forexfactory.com/calendar?day=$d" -o "ffhtml_$d.html" || true
          done
          curl -sL -A "$UA" "https://api.tradingeconomics.com/calendar?c=guest:guest&f=json" -o te.json || true
          # tv.json wurde bereits im Schritt "Fetch TradingView economic calendar"
          # geholt (breiteres Fenster) und wird hier nur noch ausgewertet.
          node -e '
            const fs=require("fs");
            const out=[];
            // ── Forex-Factory-HTML parsen ──────────────────────────────
            const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
            fs.readdirSync(".").filter(f=>/^ffhtml_.*\.html$/.test(f)).forEach(f=>{
              const m=f.match(/^ffhtml_([a-z]{3})(\d+)\.(\d{4})\.html$/);
              if(!m)return;
              const day=m[3]+"-"+String(M[m[1]]+1).padStart(2,"0")+"-"+String(Number(m[2])).padStart(2,"0");
              let html;
              try{html=fs.readFileSync(f,"utf8");}catch(e){return;}
              const rows=html.split(/<tr[^>]*calendar__row/).slice(1);
              let found=0;
              const cell=(row,cls)=>{
                const m=row.match(new RegExp("calendar__"+cls+"[^>]*>(?:\\s*<span[^>]*>)?([^<>]*?)(?:<\\/span>)?\\s*<\\/td>"));
                return m?m[1].trim():"";
              };
              rows.forEach(row=>{
                const cur=row.match(/calendar__currency[^>]*>\s*([A-Z]{3})\b/);
                const title=row.match(/calendar__event-title[^>]*>([^<]+)</);
                if(!cur||!title)return;
                const actual=cell(row,"actual");
                const previous=cell(row,"previous");
                const forecast=cell(row,"forecast");
                // Die Forex-Factory-Webseite ist die Referenz fuer revidierte
                // Previous-Werte (z.B. Core PPI 1.0% -> 0.7%) und nachgetragene
                // Actuals - daher auch dann uebernehmen, wenn (noch) kein Actual
                // vorliegt, solange wenigstens Previous oder Forecast dasteht.
                if(actual||previous||forecast){
                  out.push({source:"ffhtml",title:title[1].trim(),country:cur[1],day:day,actual:actual,previous:previous,forecast:forecast});
                  if(actual)found++;
                }
              });
              const diag=found?"":" [len="+html.length+" rows="+rows.length+(/just a moment|challenge|cf-/i.test(html)?" CLOUDFLARE-BLOCK":"")+"]";
              console.log("FF website "+day+": "+found+" actual(s) parsed"+diag);
            });
            // ── TradingView-Wirtschaftskalender ────────────────────────
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",FR:"EUR",IT:"EUR",ES:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF",CN:"CNY"};
            try{
              const tv=JSON.parse(fs.readFileSync("tv.json","utf8"));
              const evts=Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
              if(evts){
                let n=0;
                const fmt=(v,unit,scale)=>{
                  if(v==null||v==="")return "";
                  let s=String(v);
                  if(unit==="%")s+="%";
                  else if(scale)s+=String(scale).toUpperCase();
                  return s;
                };
                evts.forEach(ev=>{
                  const ccy=TV2CCY[ev.country];
                  if(!ccy)return;
                  // Auch ohne Actual uebernehmen: previous/forecast dienen zur
                  // Revisions-Erkennung (z.B. Core PPI previous 1.0% -> 0.7%).
                  const actual=ev.actual!=null?fmt(ev.actual,ev.unit,ev.scale):"";
                  const previous=fmt(ev.previous,ev.unit,ev.scale);
                  const forecast=fmt(ev.forecast,ev.unit,ev.scale);
                  if(!actual&&!previous&&!forecast)return;
                  out.push({source:"tv",name:ev.title||ev.indicator||"",country:ccy,dateUtc:ev.date,actual:actual,previous:previous,forecast:forecast});
                  if(actual)n++;
                });
                console.log("TradingView: "+n+" actual(s) loaded");
              }else{
                console.log("TradingView: unexpected response shape");
              }
            }catch(e){console.log("TradingView unavailable: "+e.message);}
            // ── Trading Economics normalisieren ────────────────────────
            const C2CCY={"united states":"USD","euro area":"EUR","germany":"EUR","france":"EUR","italy":"EUR","spain":"EUR","united kingdom":"GBP","japan":"JPY","canada":"CAD","australia":"AUD","new zealand":"NZD","switzerland":"CHF","china":"CNY"};
            try{
              const te=JSON.parse(fs.readFileSync("te.json","utf8"));
              if(Array.isArray(te)){
                let n=0;
                te.forEach(ev=>{
                  const ccy=C2CCY[String(ev.Country||"").toLowerCase()];
                  if(!ccy)return;
                  const actual=(ev.Actual==null||ev.Actual==="")?"":String(ev.Actual);
                  const previous=(ev.Previous==null||ev.Previous==="")?"":String(ev.Previous);
                  const forecast=(ev.Forecast==null||ev.Forecast==="")?"":String(ev.Forecast);
                  if(!actual&&!previous&&!forecast)return;
                  out.push({source:"te",name:ev.Event||"",country:ccy,dateUtc:ev.Date,actual:actual,previous:previous,forecast:forecast});
                  if(actual)n++;
                });
                console.log("Trading Economics: "+n+" actual(s) loaded");
              }
            }catch(e){console.log("Trading Economics unavailable: "+e.message);}
            fs.writeFileSync("alt_actuals.json",JSON.stringify(out));
            console.log("alt_actuals.json: "+out.length+" total entries");
          '

      - name: Enrich ff_calendar.json with FXStreet actuals
        run: |
          node -e '
            const fs=require("fs");

            // Maps Forex Factory event titles (lowercased) to the equivalent
            // FXStreet event name(s) (lowercased), since the two providers use
            // different naming conventions for the same release. A value may
            // be a string or an array of candidate names.
            const NAME_ALIASES={
              "cpi m/m":"consumer price index (mom)",
              "cpi y/y":"consumer price index (yoy)",
              "core cpi m/m":"consumer price index ex food & energy (mom)",
              "core cpi y/y":"consumer price index ex food & energy (yoy)",
              "national cpi y/y":"consumer price index (yoy)",
              "ppi m/m":["producer price index (mom)","producer price index, final demand (mom)"],
              "ppi y/y":["producer price index (yoy)","producer price index, final demand (yoy)"],
              "core ppi m/m":["producer price index ex food & energy (mom)","core producer price index (mom)"],
              "core ppi y/y":["producer price index ex food & energy (yoy)","core producer price index (yoy)"],
              "core pce price index m/m":"core personal consumption expenditures - price index (mom)",
              "core pce price index y/y":"core personal consumption expenditures - price index (yoy)",
              "main refinancing rate":["ecb main refinancing operations rate","ecb interest rate decision","ecb rate decision","interest rate decision"],
              "overnight rate":["boc interest rate decision","boc rate decision","interest rate decision"],
              "official bank rate":["boe interest rate decision","interest rate decision"],
              "federal funds rate":["fed interest rate decision","fomc rate decision","interest rate decision"],
              "official cash rate":["rbnz interest rate decision","rba interest rate decision","interest rate decision"],
              "cash rate":["rba interest rate decision","interest rate decision"],
              "policy rate":["interest rate decision"],
              "gdp q/q":"gross domestic product annualized (qoq)",
              "prelim gdp q/q":"gross domestic product annualized (qoq)",
              "final gdp q/q":"gross domestic product annualized (qoq)",
              "advance gdp q/q":"gross domestic product annualized (qoq)",
              "gdp m/m":"gross domestic product (mom)",
              "unemployment rate":"unemployment rate",
              "retail sales m/m":"retail sales (mom)",
              "core retail sales m/m":"retail sales ex autos (mom)",
              "ism manufacturing pmi":"ism manufacturing pmi",
              "ism services pmi":"ism non-manufacturing pmi",
              "ism non-manufacturing pmi":"ism non-manufacturing pmi",
              "flash manufacturing pmi":["s&p global manufacturing pmi","hcob manufacturing pmi"],
              "flash services pmi":["s&p global services pmi","hcob services pmi"],
              "final manufacturing pmi":["s&p global manufacturing pmi","hcob manufacturing pmi"],
              "final services pmi":["s&p global services pmi","hcob services pmi"],
              "prelim uom consumer sentiment":"michigan consumer sentiment index",
              "revised uom consumer sentiment":"michigan consumer sentiment index",
              "prelim uom inflation expectations":"michigan inflation expectations",
              "cb consumer confidence":"consumer confidence",
              "consumer confidence":"consumer confidence",
              "industrial production m/m":"industrial production (mom)",
              "industrial production y/y":"industrial production (yoy)",
              "manufacturing production m/m":"manufacturing production (mom)",
              "durable goods orders m/m":"durable goods orders (mom)",
              "core durable goods orders m/m":"durable goods orders ex transportation (mom)",
              "philly fed manufacturing index":"philadelphia fed manufacturing survey",
              "empire state manufacturing index":"empire state manufacturing index",
              "zew economic sentiment":"zew survey - economic sentiment",
              "german zew economic sentiment":"zew survey - economic sentiment",
              "ifo business climate":"ifo - business climate",
              "gfk consumer confidence":"gfk consumer confidence survey"
            };

            function normName(s){return String(s||"").toLowerCase().trim().replace(/\s+/g," ");}

            function trimNum(n){
              let s=Number(n).toFixed(3);
              s=s.replace(/0+$/,"").replace(/\.$/,"");
              return s;
            }

            // Only merge "actual" when we can format it the same way FF
            // does (plain number or percentage). K/M/B/T-scaled values
            // (Trade Balance, Jobless Claims, NFP, ...) are skipped to avoid
            // guessing the wrong magnitude/suffix.
            function fmtActual(fx){
              if(fx.actual==null)return null;
              if(fx.unit==="%")return trimNum(fx.actual)+"%";
              if((fx.unit==null||fx.unit==="")&&(fx.potency==null||fx.potency==="ZERO"))return trimNum(fx.actual);
              return null;
            }

            // Kanonischer Schluessel, damit Quellen mit anderer Namens-
            // Konvention (Trading Economics etc.) ohne Alias-Pflege matchen:
            // mom/yoy vereinheitlichen, "ex food & energy" -> core,
            // Langnamen kuerzen, Tokens sortieren.
            function canonKey(s){
              s=normName(s);
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }

            let combined;
            try{
              combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));
            }catch(e){
              console.log("No ff_calendar.json, skipping FXStreet enrichment");
              process.exit(0);
            }
            if(!Array.isArray(combined)||!combined.length)process.exit(0);

            let altActuals=[];
            try{
              altActuals=JSON.parse(fs.readFileSync("alt_actuals.json","utf8"));
              if(!Array.isArray(altActuals))altActuals=[];
            }catch(e){}

            // ── Revidierte Previous-/Forecast-Werte von der Forex-Factory-
            // Webseite uebernehmen (unabhaengig von FXStreet, da die Webseite
            // die Referenz ist, die der Nutzer sieht). Die FF-Webseite nutzt
            // exakt dieselben Event-Namen wie der Feed, daher reicht
            // Titel+Waehrung+ET-Kalendertag als Schluessel. Wird auch dann
            // angewandt, wenn der Wert bereits gesetzt ist (Revision).
            // Felder, die hier gesetzt werden, markieren wir (_ffAct/_ffPrev/
            // _ffFc), damit der nachfolgende TradingView-Overlay sie NICHT
            // mehr ueberschreibt - die FF-Webseite hat Vorrang.
            let revPrev=0,revFc=0,actFromWeb=0;
            combined.forEach(ev=>{
              const evDayET=String(ev.date).slice(0,10);
              const w=altActuals.find(a=>a.source==="ffhtml"&&a.title===ev.title&&a.country===ev.country&&a.day===evDayET);
              if(!w)return;
              if(w.actual&&w.actual!==ev.actual){ev.actual=w.actual;ev._ffAct=true;actFromWeb++;}
              if(w.previous&&w.previous!==ev.previous){ev.previous=w.previous;ev._ffPrev=true;revPrev++;}
              if(w.forecast&&w.forecast!==ev.forecast){ev.forecast=w.forecast;ev._ffFc=true;revFc++;}
            });
            if(revPrev||revFc||actFromWeb){
              // _ffAct/_ffPrev/_ffFc sind nur fuer den nachfolgenden TradingView-
              // Overlay-Schritt (im selben Prozess, gleiches `combined`-Array)
              // gedacht und duerfen nicht in die Datei geschrieben werden.
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined,(k,v)=>k==="_ffAct"||k==="_ffPrev"||k==="_ffFc"?undefined:v));
              console.log("FF website overlay: "+actFromWeb+" actual, "+revPrev+" previous, "+revFc+" forecast updated");
            }

            // ── Revidierte Previous-/Forecast-Werte aus TradingView/Trading
            // Economics uebernehmen (FF-Webseite ist auf den Runnern fast immer
            // von Cloudflare blockiert). Matcht ueber kanonischen Namen +
            // Waehrung + Zeit (+/-2h). Laeuft UNABHAENGIG von FXStreet, damit
            // Revisionen auch dann ankommen, wenn FXStreet ausfaellt. Felder,
            // die bereits von der FF-Webseite gesetzt wurden, bleiben
            // unangetastet (FF-Webseite hat Vorrang vor TradingView).
            const TV_TOL=2*60*60*1000;
            let tvPrev=0,tvFc=0,tvAct=0;
            combined.forEach(ev=>{
              const t=new Date(ev.date).getTime();
              if(isNaN(t))return;
              const evKey=canonKey(ev.title);
              const hits=altActuals.filter(a=>
                (a.source==="tv"||a.source==="te")&&a.country===ev.country&&
                a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TV_TOL&&
                canonKey(a.name)===evKey
              ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(!hits.length)return;
              const h=hits[0];
              if(!ev._ffPrev&&h.previous&&h.previous!==ev.previous){ev.previous=h.previous;tvPrev++;}
              if(!ev._ffFc&&h.forecast&&h.forecast!==ev.forecast){ev.forecast=h.forecast;tvFc++;}
              // Actual nur fuellen, nicht ueberschreiben: vermeidet, dass ein
              // korrekter FF-Actual durch eine abweichend formatierte TV-Zahl
              // ersetzt wird (und faelschlich als Revision gefaerbt wird).
              if(!ev._ffAct&&h.actual&&!ev.actual){ev.actual=h.actual;tvAct++;}
            });
            // Temporaere FF-Vorrang-Markierungen wieder entfernen, bevor in
            // die Datei geschrieben wird.
            combined.forEach(ev=>{delete ev._ffAct;delete ev._ffPrev;delete ev._ffFc;});
            if(tvPrev||tvFc||tvAct){
              fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
              console.log("TradingView/TE overlay: "+tvAct+" actual, "+tvPrev+" previous, "+tvFc+" forecast updated");
            }

            let fxEvents;
            try{
              fxEvents=JSON.parse(fs.readFileSync("fxstreet.json","utf8"));
              if(!Array.isArray(fxEvents))throw new Error("not an array");
            }catch(e){
              console.log("FXStreet data unavailable/invalid, skipping FXStreet enrichment (FF website overlay already applied)");
              process.exit(0);
            }

            // Zeit-Toleranz: Provider veröffentlichen denselben Release teils
            // mit leicht abweichendem Zeitstempel - Name+Währung müssen exakt
            // passen, der Zeitpunkt nur auf +/-2h genau (nächster gewinnt).
            const TIME_TOL=2*60*60*1000;
            let matched=0,matchedFFW=0,matchedTE=0;
            const unmatched=[];
            combined.forEach(ev=>{
              if(ev.actual)return;
              const t=new Date(ev.date).getTime();
              if(isNaN(t))return;
              const ffName=normName(ev.title);
              let aliases=NAME_ALIASES[ffName]||[];
              if(typeof aliases==="string")aliases=[aliases];
              // 1) FXStreet (verifizierte, einheitlich formatierte Werte).
              // Neben der expliziten Alias-Liste auch ueber den kanonischen
              // Namen (canonKey) matchen, der Land-Adjektive normalisiert und
              // "Flash" entfernt - faengt Eurozone-Einzelstaaten-Releases
              // (French/German Flash PMI) ab, fuer die keine Alias-Zeile
              // gepflegt ist, ohne dass dafuer jede Sprachvariante einzeln
              // eingetragen werden muss.
              const ffCanon=canonKey(ev.title);
              let candidates=fxEvents.filter(fx=>
                fx.currencyCode===ev.country &&
                Math.abs(new Date(fx.dateUtc).getTime()-t)<=TIME_TOL &&
                fx.actual!=null &&
                (normName(fx.name)===ffName || aliases.includes(normName(fx.name)) || canonKey(fx.name)===ffCanon)
              ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(!candidates.length){
                // FXStreet benennt French/German/Eurozone Flash-PMI-Releases
                // teils alle identisch nach dem Indexanbieter ("HCOB
                // Manufacturing PMI") OHNE das Land im Namen - der obige
                // Laendervergleich (canonKey enthaelt "france"/"germany")
                // kann das nie matchen. Fallback: Land aus dem Vergleich
                // herausnehmen und stattdessen ueber eine enge Zeit-Toleranz
                // disambiguieren, da France/Germany/Eurozone-Flash-PMI
                // ueblicherweise nur 15 Min. auseinander liegen.
                const STRICT_TOL=12*60*1000;
                const ffCanonNoCountry=ffCanon.split(" ").filter(w=>!["france","germany","spain","italy","netherlands"].includes(w)).join(" ");
                candidates=fxEvents.filter(fx=>
                  fx.currencyCode===ev.country &&
                  Math.abs(new Date(fx.dateUtc).getTime()-t)<=STRICT_TOL &&
                  fx.actual!=null &&
                  canonKey(fx.name)===ffCanonNoCountry
                ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              }
              if(candidates.length){
                const f=fmtActual(candidates[0]);
                if(f!==null){ev.actual=f;matched++;return;}
              }
              // 2) Forex-Factory-Webseite: Namen identisch zum Feed, daher
              // reicht Titel+Waehrung+ET-Kalendertag (Feed-Datum traegt -04:00)
              const evDayET=String(ev.date).slice(0,10);
              const ffw=altActuals.find(a=>a.source==="ffhtml"&&a.title===ev.title&&a.country===ev.country&&a.day===evDayET&&a.actual);
              if(ffw){ev.actual=ffw.actual;matchedFFW++;return;}
              // 3) TradingView/Trading Economics: kanonischer Name + Zeit-Toleranz
              const evKey=canonKey(ev.title);
              const te=altActuals.filter(a=>
                (a.source==="te"||a.source==="tv")&&a.country===ev.country&&a.actual&&
                Math.abs(new Date(a.dateUtc).getTime()-t)<=TIME_TOL&&
                canonKey(a.name)===evKey
              ).sort((a,b)=>Math.abs(new Date(a.dateUtc).getTime()-t)-Math.abs(new Date(b.dateUtc).getTime()-t));
              if(te.length){ev.actual=te[0].actual;matchedTE++;return;}
              // Diagnose fuer kuerzlich faellige High/Medium-Events ohne Treffer
              if((ev.impact==="High"||ev.impact==="Medium")&&t<=Date.now()&&Date.now()-t<=48*60*60*1000){
                const near=fxEvents.filter(fx=>fx.currencyCode===ev.country&&Math.abs(new Date(fx.dateUtc).getTime()-t)<=TIME_TOL)
                  .map(fx=>fx.name+" [actual="+fx.actual+" unit="+fx.unit+" potency="+fx.potency+"]");
                const nearAlt=altActuals.filter(a=>a.country===ev.country&&(a.day===evDayET||(a.dateUtc&&Math.abs(new Date(a.dateUtc).getTime()-t)<=TIME_TOL)))
                  .map(a=>a.source+":"+(a.title||a.name)+" ["+a.actual+"]");
                unmatched.push(ev.title+" ("+ev.country+", "+ev.date+") -> FXStreet: "+(near.length?near.join(" | "):"NONE")+" || Alt: "+(nearAlt.length?nearAlt.join(" | "):"NONE"));
              }
            });
            console.log("Matched: "+matched+" from FXStreet, "+matchedFFW+" from FF website, "+matchedTE+" from TradingView/TradingEconomics");
            if(unmatched.length){
              console.log("Unmatched due/recent High+Medium events:");
              unmatched.forEach(u=>console.log("  - "+u));
            }
            if(matched+matchedFFW+matchedTE>0)fs.writeFileSync("ff_calendar.json", JSON.stringify(combined));
          '

      # Schutznetz gegen Dopplungen im Kalender (z.B. "GDP q/q" vom FF-Feed
      # UND "GDP Growth Rate QoQ" von TradingView fuer denselben Release):
      # unabhaengig davon, wie eine Dopplung entstanden ist (Namens-
      # Mismatch beim Hinzufuegen, mehrfacher Lauf, ...), werden hier ALLE
      # Events mit gleicher Waehrung + kanonischem Namen + ET-Kalendertag
      # zu einem Eintrag zusammengefuehrt (der vollstaendigere/FF-Eintrag
      # gewinnt, fehlende Felder werden aus dem Duplikat ergaenzt).
      - name: Deduplicate ff_calendar.json
        run: |
          node -e '
            const fs=require("fs");
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            function etDay(iso){const t=new Date(iso).getTime();if(isNaN(t))return null;return new Date(t-4*3600e3).toISOString().slice(0,10);}
            let combined;
            try{combined=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){process.exit(0);}
            if(!Array.isArray(combined))process.exit(0);
            const groups=new Map();
            combined.forEach(ev=>{
              const k=ev.country+"|"+canonKey(ev.title)+"|"+etDay(ev.date);
              if(!groups.has(k))groups.set(k,[]);
              groups.get(k).push(ev);
            });
            let removed=0;
            const out=[];
            groups.forEach(list=>{
              if(list.length===1){out.push(list[0]);return;}
              // FF-natives Event (kein src-Tag) zuerst, sonst das mit den
              // meisten gefuellten Feldern.
              list.sort((a,b)=>{
                const as=a.src?1:0,bs=b.src?1:0;
                if(as!==bs)return as-bs;
                const af=["actual","forecast","previous"].filter(k=>a[k]).length;
                const bf=["actual","forecast","previous"].filter(k=>b[k]).length;
                return bf-af;
              });
              const base=list[0];
              for(let i=1;i<list.length;i++){
                ["actual","forecast","previous"].forEach(k=>{if(!base[k]&&list[i][k])base[k]=list[i][k];});
              }
              out.push(base);
              removed+=list.length-1;
            });
            if(removed){
              out.sort((x,y)=>new Date(x.date)-new Date(y.date));
              fs.writeFileSync("ff_calendar.json", JSON.stringify(out));
              console.log("Dedup: removed "+removed+" duplicate calendar event(s)");
            } else {
              console.log("Dedup: no duplicates found");
            }
          '

      # ── INDIKATOR-WERTE (ind_data.json) ───────────────────────────────
      # Zieht ein BREITES Zeitfenster (letzte ~95 Tage) von TradingViews
      # Wirtschaftskalender (auf den Runnern zuverlaessig erreichbar) und
      # extrahiert pro getracktem Indikator den ZULETZT veroeffentlichten Wert
      # (actual/forecast/previous). So stammen die Werte der Indikator-Karten
      # aus derselben echten Quelle wie der Kalender - nur mit laengerem
      # Rueckblick, damit auch Releases sichtbar bleiben, die schon Wochen
      # zurueckliegen. Periodengenaue Zuordnung (q/q != m/m != y/y) verhindert
      # Verwechslungen wie monatliches vs. quartalsweises GDP.
      - name: Fetch TradingView wide window for indicator values
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          TV_FROM=$(node -e 'console.log(new Date(Date.now()-95*86400e3).toISOString())')
          TV_TO=$(node -e 'console.log(new Date(Date.now()+2*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_FROM}&to=${TV_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o tv_wide.json || true
          # Die 95-Tage-Abfrage liefert pro Aufruf maximal ~2000 Events
          # (API-Limit) - bei 9 Laendern reicht das Limit oft nicht bis zum
          # aktuellen Tag, wodurch die juengsten Veroeffentlichungen fehlen.
          # Zusaetzlich ein enges, garantiert unter dem Limit liegendes
          # Fenster um "jetzt" abfragen, damit die neuesten Actuals nicht
          # durch das Limit abgeschnitten werden.
          TV_RFROM=$(node -e 'console.log(new Date(Date.now()-45*86400e3).toISOString())')
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" \
            "https://economic-calendar.tradingview.com/events?from=${TV_RFROM}&to=${TV_TO}&countries=US,EU,DE,GB,JP,CA,AU,NZ,CH" -o tv_recent.json || true
          node -e '
            const fs=require("fs");
            // TradingView-Laendercode -> unsere Symbol-Waehrung. DE wird als
            // Fallback fuer die Eurozone genutzt, falls EU fehlt.
            const TV2CCY={US:"USD",EU:"EUR",DE:"EUR",GB:"GBP",JP:"JPY",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF"};
            const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
            const fmt=(v,unit,scale)=>{
              if(v==null||v==="")return null;
              let s=String(v);
              if(unit==="%")s+="%";else if(scale)s+=String(scale).toUpperCase();
              return s;
            };
            const period=t=>{
              t=norm(t);
              if(/\bq\/?o\/?q\b|\bqoq\b|quarter/.test(t))return "q/q";
              if(/\by\/?o\/?y\b|\byoy\b|year/.test(t))return "y/y";
              if(/\bm\/?o\/?m\b|\bmom\b|month/.test(t))return "m/m";
              return null;
            };
            // Praezise, periodengenaue Zuordnung TV-Titel -> unser Indikator.
            // test(t,ccy)=>true, plus erwartete Periode (oder null = egal).
            // Nur EINDEUTIGE Standard-Releases; laenderspezifische Sondermasse
            // (Negotiated Wages, WPI, Labour Cost Index, CSPI, Anleiherenditen,
            // Swaps, Spreads) bleiben bewusst aussen vor und landen im Report.
            // Schliesst Kern-/Spezial-Varianten aus, damit ein "Headline"-Wert
            // nicht faelschlich eine Ex-/Input-/Weekly-Reihe erwischt.
            const EXCORE=/core|\bex[\s-]|ex food|ex-food|excluding|trimmed|median|weighted|super/;
            const RULES=[
              {ind:"Central Bank Rate",period:null,test:t=>/interest rate decision|rate decision/.test(t)},
              {ind:"CPI (Headline)",period:"y/y",test:t=>/\binflation rate\b/.test(t)&&!EXCORE.test(t)&&!/wage|expectation|harmoni/.test(t)},
              {ind:"CPI",period:"m/m",test:t=>/\binflation rate\b/.test(t)&&!EXCORE.test(t)&&!/wage|expectation|harmoni/.test(t)},
              {ind:"Core CPI",period:"y/y",test:t=>/core inflation rate/.test(t)},
              {ind:"PPI",period:"y/y",test:t=>(/producer pric/.test(t)||/\bppi\b/.test(t))&&!EXCORE.test(t)&&!/input|import|\btrade\b/.test(t)},
              {ind:"Core PPI",period:"y/y",test:t=>/core producer pric|core ppi/.test(t)},
              {ind:"PCE",period:"y/y",test:(t,c)=>c==="USD"&&/\bpce price index\b/.test(t)&&!EXCORE.test(t)},
              {ind:"Core PCE",period:"y/y",test:(t,c)=>c==="USD"&&/core pce price index/.test(t)},
              {ind:"Unemployment Rate",period:null,test:t=>/unemployment rate/.test(t)&&!/ex|youth|\bu-?\d/.test(t)},
              {ind:"NFP / Employment Change",period:null,test:(t,c)=>c==="USD"?/non.?farm payrolls/.test(t)&&!/private/.test(t):/employment change/.test(t)&&!/adp/.test(t)},
              {ind:"ADP Employment",period:null,test:(t,c)=>c==="USD"&&/adp employment/.test(t)&&!/weekly/.test(t)},
              {ind:"JOLTS Job Openings",period:null,test:(t,c)=>c==="USD"&&/job openings/.test(t)},
              {ind:"Unemployment Claims",period:null,test:(t,c)=>c==="USD"&&/initial jobless claims/.test(t)},
              {ind:"Unemployment Claims",period:null,test:(t,c)=>c==="GBP"&&/claimant count/.test(t)},
              {ind:"Avg Hourly Earnings",period:"y/y",test:(t,c)=>c==="USD"&&/average hourly earnings/.test(t)},
              {ind:"GDP Growth QoQ",period:"q/q",test:t=>/\bgdp growth rate\b/.test(t)&&!/year/.test(t)},
              {ind:"Manufacturing PMI",period:null,test:t=>/manufacturing pmi/.test(t)&&!/non.?manufacturing/.test(t)},
              {ind:"Services PMI",period:null,test:t=>/services pmi|non.?manufacturing pmi/.test(t)},
              {ind:"Retail Sales",period:"m/m",test:t=>/retail sales/.test(t)&&!/core|year|\bex[\s-]|ex fuel/.test(t)},
              // USD: ausdruecklich die Conference-Board-Reihe ("Consumer
              // Confidence") - NICHT die University-of-Michigan-"Consumer
              // Sentiment"-Reihe (anderer Indikator!).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c==="USD"&&/consumer confidence/.test(t)&&!/sentiment|michigan|expectation|change/.test(t)},
              // NZD: ausdruecklich die Westpac-Reihe (nicht ANZ-Roy Morgan).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c==="NZD"&&/westpac/.test(t)&&/consumer/.test(t)},
              // Uebrige Waehrungen: jeweils ihr landesuebliches Stimmungsmass
              // (EU-Kommission, GfK, SECO Climate, Cabinet Office, Westpac ...).
              {ind:"Consumer Confidence",period:null,test:(t,c)=>c!=="USD"&&c!=="NZD"&&/consumer confidence|consumer sentiment|consumer climate/.test(t)&&!/change|expectation/.test(t)},
            ];
            const readEvts=f=>{
              let tv;
              try{tv=JSON.parse(fs.readFileSync(f,"utf8"));}catch(e){return null;}
              return Array.isArray(tv)?tv:(tv&&Array.isArray(tv.result)?tv.result:null);
            };
            const wide=readEvts("tv_wide.json");
            const recent=readEvts("tv_recent.json");
            if(!wide&&!recent){console.log("ind_data: TradingView windows unavailable, keeping existing ind_data.json");process.exit(0);}
            // Enges Fenster zuerst -> bei gleichem Datum gewinnt trotzdem das
            // spaetere Event (s.u.), aber so sind die juengsten Actuals nicht
            // vom 2000er-Limit der 95-Tage-Abfrage betroffen.
            const evts=[...(recent||[]),...(wide||[])];
            console.log("ind_data: "+(wide?wide.length:0)+" TV events in 95d window, "+(recent?recent.length:0)+" in 45d window");
            // Pro (ccy|ind) ALLE Events mit Actual sammeln (nicht nur das
            // spaeteste) - das vorletzte Event liefert den verlaesslichsten
            // "Previous"-Wert (s.u.).
            const hist={};
            evts.forEach(ev=>{
              const ccy=TV2CCY[ev.country];
              if(!ccy)return;
              const title=norm(ev.title||ev.indicator||"");
              if(!title)return;
              const actual=fmt(ev.actual,ev.unit,ev.scale);
              if(actual==null)return; // nur veroeffentlichte Werte
              const per=period(ev.title||ev.indicator||"");
              RULES.forEach(r=>{
                if(!r.test(title,ccy))return;
                if(r.period&&per&&r.period!==per)return; // Periode muss passen
                if(r.period&&!per)return; // Periode gefordert, aber keine erkannt -> ueberspringen
                const k=ccy+"|"+r.ind;
                const t=new Date(ev.date).getTime();
                if(isNaN(t))return;
                (hist[k]=hist[k]||[]).push({
                  actual:actual,
                  forecast:fmt(ev.forecast,ev.unit,ev.scale),
                  previous:fmt(ev.previous,ev.unit,ev.scale),
                  date:new Date(ev.date).toISOString().slice(0,10),
                  event:(ev.title||ev.indicator||""),
                  period:r.period,
                  _t:t
                });
              });
            });
            // In nach Waehrung gruppiertes Objekt umwandeln. "Previous" wird,
            // wenn moeglich, durch den ACTUAL-Wert des vorhergehenden Release
            // ERSETZT statt dem von TradingView selbst gemeldeten previous-Feld
            // zu vertrauen. Das ist aber nur der FALLBACK: wo der Forex-Factory-
            // Kalender (unten) einen passenden Eintrag hat, gewinnen dessen
            // Werte (siehe FF-Overlay).
            const out={};
            Object.keys(hist).forEach(k=>{
              const [ccy,ind]=k.split("|");
              const list=hist[k].sort((a,b)=>b._t-a._t);
              const v={...list[0]};delete v._t;
              if(list[1])v.previous=list[1].actual;
              (out[ccy]=out[ccy]||{})[ind]=v;
            });

            // ── Forex-Factory-Kalenderwerte haben VORRANG (Nutzerwunsch) ──────
            // Die Indikator-Karten sollen exakt die Werte des Forex-Factory-
            // Kalenders (ff_calendar.json) zeigen, damit Karte und Kalender
            // IMMER identisch sind (kein Auseinanderlaufen mehr wie bei NZD GDP:
            // Karte 0.5% vs. Kalender 0.2%). Pro Indikator wird der passende
            // FF-Eintrag (gleiche Waehrung + kanonischer Name, naechstgelegenes
            // Datum) gesucht und dessen actual/forecast/previous uebernommen.
            // Nur wo der Kalender (noch) keinen Eintrag hat (Release liegt
            // ausserhalb des ~13-Tage-Fensters), bleiben die oben aus
            // TradingView abgeleiteten Werte als Fallback bestehen.
            function canonKey(s){
              s=String(s||"").toLowerCase().trim().replace(/\s+/g," ");
              s=s.replace(/\(mom\)|\bmom\b/g,"m/m").replace(/\(yoy\)|\byoy\b/g,"y/y").replace(/\(qoq\)|\bqoq\b/g,"q/q");
              s=s.replace(/growth rate/g,"");
              s=s.replace(/ex food (?:&|and) energy/g,"core");
              s=s.replace(/producer price index|producer prices/g,"ppi");
              s=s.replace(/consumer price index|inflation rate/g,"cpi");
              s=s.replace(/, final demand|final demand/g,"");
              s=s.replace(/initial jobless claims/g,"unemployment claims");
              s=s.replace(/non.?farm (?:payrolls|employment change)/g,"nfp");
              // Land-Adjektive (FF: "French Flash Manufacturing PMI", "German
              // Flash Services PMI" fuer Eurozone-Einzelstaaten) auf das
              // Substantiv normalisieren und das Fuellwort "Flash" entfernen,
              // sonst matcht das kanonische CPI dieser Releases nie gegen die
              // landesspezifischen Namen von TradingView/FXStreet/Trading
              // Economics ("France Manufacturing PMI" etc.) und das "actual"
              // bleibt trotz vorhandenem Forecast/Previous dauerhaft leer.
              s=s.replace(/\bflash\b/g,"");
              s=s.replace(/\bfrench\b/g,"france").replace(/\bgerman\b/g,"germany").replace(/\bspanish\b/g,"spain").replace(/\bitalian\b/g,"italy").replace(/\bdutch\b/g,"netherlands");
              // PMI-Anbieter-Marke ("S&P Global"/"HCOB"/"Markit") entfernen -
              // verschiedene Quellen nennen denselben Release mit/ohne Marke.
              s=s.replace(/\bs ?& ?p global\b|\bhcob\b|\bihs markit\b|\bmarkit\b/g,"");
              s=s.replace(/[^a-z0-9\/ ]/g," ").replace(/\s+/g," ").trim();
              return s.split(" ").sort().join(" ");
            }
            let cal;
            try{cal=JSON.parse(fs.readFileSync("ff_calendar.json","utf8"));}catch(e){cal=null;}
            let ffOverlaid=0;
            if(Array.isArray(cal)){
              Object.keys(out).forEach(ccy=>{
                Object.keys(out[ccy]).forEach(ind=>{
                  const v=out[ccy][ind];
                  if(!v.event)return;
                  const evKey=ccy+"|"+canonKey(v.event);
                  const t=new Date(v.date).getTime();
                  // Passenden FF-Eintrag mit dem naechstgelegenen Datum suchen.
                  let best=null,bestDt=Infinity;
                  cal.forEach(ev=>{
                    if(ev.country+"|"+canonKey(ev.title)!==evKey)return;
                    const et=new Date(ev.date).getTime();
                    if(isNaN(et))return;
                    const dt=Math.abs(et-t);
                    if(dt<bestDt){bestDt=dt;best=ev;}
                  });
                  if(!best||bestDt>4*86400e3)return;
                  let changed=false;
                  if(best.actual&&v.actual!==best.actual){v.actual=best.actual;changed=true;}
                  if(best.forecast&&v.forecast!==best.forecast){v.forecast=best.forecast;changed=true;}
                  if(best.previous&&v.previous!==best.previous){v.previous=best.previous;changed=true;}
                  if(changed)ffOverlaid++;
                });
              });
            }
            fs.writeFileSync("ind_data.json",JSON.stringify(out,null,1));
            // Report: welche (ccy|ind) der RULES KEINEN Wert bekamen.
            const ALLCCY=["USD","EUR","GBP","CHF","JPY","CAD","AUD","NZD"];
            const missing=[];
            ALLCCY.forEach(c=>RULES.forEach(r=>{ if(!out[c]||!out[c][r.ind])missing.push(c+" "+r.ind); }));
            console.log("ind_data.json: "+Object.values(out).reduce((n,o)=>n+Object.keys(o).length,0)+" indicator values written");
            console.log("ind_data MISSING ("+missing.length+"): "+missing.join(", "));
            console.log("ind_data <- FF calendar overlay: "+ffOverlaid+" indicator value(s) taken from Forex-Factory");
          '

      # ── BOND-HISTORIE BACKFILL (offizielle Gratis-Quellen, ohne Key) ──
      # Fuellt die Zeitreihe fuer Waehrungen, deren Tageshistorie frei und ohne
      # API-Key verfuegbar ist, sofort mit echten Werten (statt ~10 Tage zu
      # "warmlaufen"): USD via US-Treasury-CSV, CAD via Bank of Canada (Valet).
      # Gleiche Messgroesse wie TradingView (Treasury/Benchmark-Rendite), daher
      # keine Methoden-Bruchstelle. Laeuft vor dem TradingView-Schritt; die
      # historischen Tage bleiben erhalten, TradingView ergaenzt nur "heute".
      - name: Backfill bond history (US Treasury + BoC + ECB, no key)
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          YEAR=$(node -e 'console.log(new Date().getUTCFullYear())')
          curl -sL -A "$UA" "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${YEAR}/all?type=daily_treasury_yield_curve&field_tdr_date_value=${YEAR}&page&_format=csv" -o ust.csv || true
          curl -sL -A "$UA" "https://www.bankofcanada.ca/valet/observations/BD.CDN.2YR.DQ.YLD,BD.CDN.10YR.DQ.YLD/json?recent=30" -o boc.json || true
          # EZB-Zinsstrukturkurve (Euroraum AAA), Spot-Rate 2J/10J, taeglich.
          curl -sL -A "$UA" "https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y?format=csvdata&lastNObservations=30" -o ecb2.csv || true
          curl -sL -A "$UA" "https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y?format=csvdata&lastNObservations=30" -o ecb10.csv || true
          node -e '
            const fs=require("fs");
            ["ust.csv","boc.json","ecb2.csv","ecb10.csv"].forEach(f=>{try{const s=fs.readFileSync(f,"utf8");console.log("[debug] "+f+": "+s.length+" bytes, first line: "+JSON.stringify(s.split(/\r?\n/)[0]).slice(0,160));}catch(e){console.log("[debug] "+f+": MISSING");}});
            const SRC={
              "USD|10Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-10-year-bond-yield",
              "USD|2Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-2-year-bond-yield",
              "CAD|10Y Bond Yield":"https://www.investing.com/rates-bonds/canada-10-year-bond-yield",
              "CAD|2Y Bond Yield":"https://www.investing.com/rates-bonds/canada-2-year-bond-yield",
              "EUR|10Y Bond Yield":"https://www.investing.com/rates-bonds/germany-10-year-bond-yield",
              "EUR|2Y Bond Yield":"https://www.investing.com/rates-bonds/germany-2-year-bond-yield"
            };
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            function merge(ccy,ind,points){
              if(!points.length)return 0;
              const cur=(out[ccy]&&out[ccy][ind])||{};
              const m=new Map();
              (Array.isArray(cur.series)?cur.series:[]).forEach(e=>{if(e&&e[0])m.set(e[0],String(e[1]));});
              points.forEach(p=>{if(p&&p[0]&&isFinite(Number(p[1])))m.set(p[0],String(Math.round(Number(p[1])*1000)/1000));});
              const series=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-35).map(e=>[e[0],e[1]]);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[ccy+"|"+ind]||cur.source||"",series:series};
              return points.length;
            }
            // US-Treasury-Tages-CSV: Spalten "Date","1 Mo",...,"2 Yr",...,"10 Yr",...
            // Datum als MM/DD/YYYY. Liefert "2 Yr"/"10 Yr"-Par-Renditen.
            function parseTreasury(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return {p2:[],p10:[]};}
              const lines=csv.split(/\r?\n/).filter(Boolean);
              if(!lines.length)return {p2:[],p10:[]};
              const hdr=lines[0].split(",").map(s=>s.replace(/^"|"$/g,"").trim());
              const di=hdr.indexOf("Date"),i2=hdr.indexOf("2 Yr"),i10=hdr.indexOf("10 Yr");
              const p2=[],p10=[];
              if(di<0||i2<0||i10<0)return {p2:[],p10:[]};
              for(let i=1;i<lines.length;i++){
                const c=lines[i].split(",").map(s=>s.replace(/^"|"$/g,"").trim());
                const m=c[di]&&c[di].match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if(!m)continue;
                const date=m[3]+"-"+m[1]+"-"+m[2];
                const v2=parseFloat(c[i2]),v10=parseFloat(c[i10]);
                if(isFinite(v2))p2.push([date,v2]);
                if(isFinite(v10))p10.push([date,v10]);
              }
              return {p2,p10};
            }
            // EZB-CSV (csvdata): Spalten u.a. TIME_PERIOD (YYYY-MM-DD), OBS_VALUE.
            function parseEcb(file){
              let csv;try{csv=fs.readFileSync(file,"utf8");}catch(e){return [];}
              const lines=csv.split(/\r?\n/).filter(Boolean);
              if(lines.length<2)return [];
              const hdr=lines[0].split(",");
              const ti=hdr.indexOf("TIME_PERIOD"),vi=hdr.indexOf("OBS_VALUE");
              if(ti<0||vi<0)return [];
              const pts=[];
              for(let i=1;i<lines.length;i++){
                const c=lines[i].split(",");
                const d=c[ti],v=parseFloat(c[vi]);
                if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isFinite(v))pts.push([d,v]);
              }
              return pts;
            }
            const ust=parseTreasury("ust.csv");
            let usd2=merge("USD","2Y Bond Yield",ust.p2),usd10=merge("USD","10Y Bond Yield",ust.p10);
            let boc=null;try{boc=JSON.parse(fs.readFileSync("boc.json","utf8"));}catch(e){}
            let cad2=0,cad10=0;
            if(boc&&Array.isArray(boc.observations)){
              const k2="BD.CDN.2YR.DQ.YLD",k10="BD.CDN.10YR.DQ.YLD";
              const p2=[],p10=[];
              boc.observations.forEach(o=>{
                if(o[k2]&&o[k2].v!=null&&o[k2].v!=="")p2.push([o.d,parseFloat(o[k2].v)]);
                if(o[k10]&&o[k10].v!=null&&o[k10].v!=="")p10.push([o.d,parseFloat(o[k10].v)]);
              });
              cad2=merge("CAD","2Y Bond Yield",p2);cad10=merge("CAD","10Y Bond Yield",p10);
            }
            let eur2=merge("EUR","2Y Bond Yield",parseEcb("ecb2.csv")),eur10=merge("EUR","10Y Bond Yield",parseEcb("ecb10.csv"));
            if(usd2||usd10||cad2||cad10||eur2||eur10){
              fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
              console.log("bond backfill: USD 2Y="+usd2+"/10Y="+usd10+", CAD 2Y="+cad2+"/10Y="+cad10+", EUR 2Y="+eur2+"/10Y="+eur10+" pts");
            }else{
              console.log("bond backfill: no data from official sources, keeping existing file");
            }
          '
          rm -f ust.csv boc.json ecb2.csv ecb10.csv

      # ── ANLEIHERENDITEN (bond_data.json) ──────────────────────────────
      # 2J-/10J-Staatsanleiherenditen je Waehrung von TradingViews Scanner-API
      # (auf den Runnern erreichbar; Stooq/investing.com liefern Cloud-IPs nur
      # eine JS-Challenge bzw. 403). Pro Lauf wird der aktuelle Wert je Reihe
      # mit dem heutigen UTC-Datum in eine rollierende Zeitreihe (letzte ~35
      # Eintraege) geschrieben (gleiches Datum wird ueberschrieben). Daraus
      # baut der Browser Actual (letzter Wert <= gestern) und Previous (letzter
      # Wert <= Actual-Datum minus 10 Tage) samt Faerbung. Schlaegt der Abruf
      # fehl, bleibt die bestehende Reihe erhalten.
      - name: Fetch government bond yields (TradingView) -> bond_data.json
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" -H "Origin: https://www.tradingview.com" -H "Content-Type: application/json" \
            --data '{"symbols":{"tickers":["TVC:US10Y","TVC:US02Y","TVC:DE10Y","TVC:DE02Y","TVC:GB10Y","TVC:GB02Y","TVC:CH10Y","TVC:CH02Y","TVC:JP10Y","TVC:JP02Y","TVC:CA10Y","TVC:CA02Y","TVC:AU10Y","TVC:AU02Y","TVC:NZ10Y","TVC:NZ02Y"],"query":{"types":[]}},"columns":["close"]}' \
            "https://scanner.tradingview.com/global/scan" -o bond_tv.json || true
          echo "=== TradingView scanner response (first 500 chars) ==="
          head -c 500 bond_tv.json 2>/dev/null || echo "(missing)"
          echo
          node -e '
            const fs=require("fs");
            // TVC-Ticker -> "CCY|Laufzeit" (Indikatorname in der App).
            const MAP={
              "TVC:US10Y":"USD|10Y Bond Yield","TVC:US02Y":"USD|2Y Bond Yield",
              "TVC:DE10Y":"EUR|10Y Bond Yield","TVC:DE02Y":"EUR|2Y Bond Yield",
              "TVC:GB10Y":"GBP|10Y Bond Yield","TVC:GB02Y":"GBP|2Y Bond Yield",
              "TVC:CH10Y":"CHF|10Y Bond Yield","TVC:CH02Y":"CHF|2Y Bond Yield",
              "TVC:JP10Y":"JPY|10Y Bond Yield","TVC:JP02Y":"JPY|2Y Bond Yield",
              "TVC:CA10Y":"CAD|10Y Bond Yield","TVC:CA02Y":"CAD|2Y Bond Yield",
              "TVC:AU10Y":"AUD|10Y Bond Yield","TVC:AU02Y":"AUD|2Y Bond Yield",
              "TVC:NZ10Y":"NZD|10Y Bond Yield","TVC:NZ02Y":"NZD|2Y Bond Yield"
            };
            // Investing.com-Quelle je Reihe (Fallback; die App bevorzugt ihren
            // kuratierten Link).
            const SRC={
              "USD|10Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-10-year-bond-yield",
              "USD|2Y Bond Yield":"https://www.investing.com/rates-bonds/u.s.-2-year-bond-yield",
              "EUR|10Y Bond Yield":"https://www.investing.com/rates-bonds/germany-10-year-bond-yield",
              "EUR|2Y Bond Yield":"https://www.investing.com/rates-bonds/germany-2-year-bond-yield",
              "GBP|10Y Bond Yield":"https://www.investing.com/rates-bonds/uk-10-year-bond-yield",
              "GBP|2Y Bond Yield":"https://www.investing.com/rates-bonds/uk-2-year-bond-yield",
              "CHF|10Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-10-year-bond-yield",
              "CHF|2Y Bond Yield":"https://www.investing.com/rates-bonds/switzerland-2-year-bond-yield",
              "JPY|10Y Bond Yield":"https://www.investing.com/rates-bonds/japan-10-year-bond-yield",
              "JPY|2Y Bond Yield":"https://www.investing.com/rates-bonds/japan-2-year-bond-yield",
              "CAD|10Y Bond Yield":"https://www.investing.com/rates-bonds/canada-10-year-bond-yield",
              "CAD|2Y Bond Yield":"https://www.investing.com/rates-bonds/canada-2-year-bond-yield",
              "AUD|10Y Bond Yield":"https://www.investing.com/rates-bonds/australia-10-year-bond-yield",
              "AUD|2Y Bond Yield":"https://www.investing.com/rates-bonds/australia-2-year-bond-yield",
              "NZD|10Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-10-years-bond-yield",
              "NZD|2Y Bond Yield":"https://www.investing.com/rates-bonds/new-zealand-2-years-bond-yield"
            };
            const today=new Date().toISOString().slice(0,10);
            let resp;
            try{resp=JSON.parse(fs.readFileSync("bond_tv.json","utf8"));}catch(e){console.log("bond_data: TradingView response unreadable, keeping existing file ("+e.message+")");process.exit(0);}
            const rows=resp&&Array.isArray(resp.data)?resp.data:null;
            if(!rows){console.log("bond_data: unexpected TradingView shape, keeping existing file");process.exit(0);}
            let out={};
            try{const d=JSON.parse(fs.readFileSync("bond_data.json","utf8"));if(d&&typeof d==="object"&&!Array.isArray(d))out=d;}catch(e){}
            let okN=0;const miss=[];
            rows.forEach(r=>{
              const key=MAP[r.s];if(!key)return;
              const v=r.d&&r.d[0];
              if(v==null||!isFinite(Number(v))){miss.push(r.s);return;}
              const val=String(Math.round(Number(v)*1000)/1000);
              const [ccy,ind]=key.split("|");
              const cur=(out[ccy]&&out[ccy][ind])||{};
              let series=Array.isArray(cur.series)?cur.series.filter(e=>e&&e[0]!==today):[];
              series.push([today,val]);
              series.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
              series=series.slice(-35);
              (out[ccy]=out[ccy]||{})[ind]={source:SRC[key]||cur.source||"",series:series};
              okN++;
            });
            // Reihen, die diesmal fehlten, aber bereits existieren, bleiben erhalten.
            const wantMiss=Object.keys(MAP).map(k=>MAP[k]).filter(key=>{const[c,i]=key.split("|");return !(out[c]&&out[c][i]);});
            if(okN>0){
              fs.writeFileSync("bond_data.json",JSON.stringify(out,null,1));
              console.log("bond_data.json: "+okN+"/16 series appended for "+today+(miss.length?" [no value: "+miss.join(", ")+"]":"")+(wantMiss.length?" [never seen: "+wantMiss.join(", ")+"]":""));
            }else{
              console.log("bond_data: no usable values from TradingView, keeping existing file"+(miss.length?" [no value: "+miss.join(", ")+"]":""));
            }
          '
          rm -f bond_tv.json

      # ── COT / Commitments of Traders (cot_data.json) ──────────────────
      # CFTC "Legacy Futures-Only", Kategorie Non-Commercial (Grossspekulanten).
      # Erscheint woechentlich (Stand Dienstag, Veroeffentlichung Freitag). Es wird
      # nur geschrieben, wenn sich die Werte tatsaechlich geaendert haben - sonst
      # entsteht kein stuendlicher Commit-Churn.
      - name: Fetch CFTC COT (Legacy futures-only) -> cot_data.json
        run: |
          curl -sL --max-time 90 \
            'https://publicreporting.cftc.gov/resource/6dca-aqww.json?$select=market_and_exchange_names,report_date_as_yyyy_mm_dd,open_interest_all,noncomm_positions_long_all,noncomm_positions_short_all,change_in_noncomm_long_all,change_in_noncomm_short_all,change_in_open_interest_all&$order=report_date_as_yyyy_mm_dd%20DESC&$limit=12000' \
            -o cot_raw.json || true
          node -e '
            const fs=require("fs");
            let rows;
            try{rows=JSON.parse(fs.readFileSync("cot_raw.json","utf8"));}catch(e){console.log("cot: raw unreadable, keeping existing file");process.exit(0);}
            if(!Array.isArray(rows)||!rows.length){console.log("cot: empty/invalid raw, keeping existing file");process.exit(0);}
            const MARKETS=[
              {id:"EUR", inc:/EURO FX/, exc:/MICRO/},
              {id:"GBP", inc:/BRITISH POUND/, exc:/MICRO/},
              {id:"JPY", inc:/JAPANESE YEN/, exc:/MICRO/},
              {id:"CHF", inc:/SWISS FRANC/, exc:/MICRO/},
              {id:"CAD", inc:/CANADIAN DOLLAR/, exc:/MICRO/},
              {id:"AUD", inc:/AUSTRALIAN DOLLAR/, exc:/MICRO/},
              {id:"NZD", inc:/(NZ DOLLAR|NEW ZEALAND DOLLAR)/, exc:/MICRO/},
              {id:"USD", inc:/(U\.?S\.?\s*DOLLAR INDEX|USD INDEX)/, exc:/MICRO/},
              {id:"BTC", inc:/BITCOIN/, exc:/(MICRO|YIELD|ETHER|EVENT)/},
              {id:"GOLD", inc:/^GOLD - /, exc:/(MICRO|KILO)/},
              {id:"SILVER", inc:/^SILVER - /, exc:/MICRO/},
              {id:"OIL", inc:/CRUDE OIL, LIGHT SWEET/, exc:/(MICRO|CALENDAR|BULLET|FINANCIAL|NYMEX OTHER|MIDLAND|GULF|WTI AVERAGE)/},
              {id:"SP500", inc:/E-MINI S&P 500/, exc:/(MICRO|ESG|GROWTH|VALUE|DIVIDEND|ANNUAL|QUARTER|CONSU|FINANCIAL|HEALTH|TECH|UTIL|MATERIAL|INDUSTRIAL|ENERGY|REAL|COMMUNICATION)/},
              {id:"NAS", inc:/(NASDAQ-100|E-MINI NASDAQ)/, exc:/MICRO/}
            ];
            // Pro Markt bis zu HIST_LEN Wochen sammeln (Zeilen kommen bereits
            // global nach report_date DESC sortiert -> je Markt automatisch
            // neueste zuerst). out[id] bleibt der jeweils neueste Snapshot
            // (unveraendertes Schema fuer die Karten/Scoring), history[id]
            // wird zusaetzlich fuer das COT-Verlaufsdiagramm gesammelt.
            const HIST_LEN=26;
            const out={};let reportDate="";const matched=[];const hist={};
            for(const r of rows){
              const nm=(r.market_and_exchange_names||"").toUpperCase();
              for(const mk of MARKETS){
                if(hist[mk.id]&&hist[mk.id].length>=HIST_LEN)continue;
                if(mk.inc.test(nm)&&!(mk.exc&&mk.exc.test(nm))){
                  const L=Number(r.noncomm_positions_long_all),S=Number(r.noncomm_positions_short_all);
                  if(!isFinite(L)||!isFinite(S))continue;
                  const d=String(r.report_date_as_yyyy_mm_dd||"").slice(0,10);
                  (hist[mk.id]=hist[mk.id]||[]).push({date:d,long:L,short:S,oi:Number(r.open_interest_all)||0});
                  if(!out[mk.id]){
                    out[mk.id]={
                      long:L,short:S,
                      dLong:Number(r.change_in_noncomm_long_all)||0,
                      dShort:Number(r.change_in_noncomm_short_all)||0,
                      oi:Number(r.open_interest_all)||0,
                      dOi:Number(r.change_in_open_interest_all)||0
                    };
                    if(d>reportDate)reportDate=d;
                    matched.push(mk.id+" <- "+r.market_and_exchange_names+" ("+d+")");
                  }
                }
              }
            }
            Object.keys(out).forEach(id=>{
              if(hist[id])out[id].history=hist[id].slice().sort((a,b)=>a.date.localeCompare(b.date));
            });
            const got=Object.keys(out).length;
            if(got===0){
              console.log("cot: no markets matched - sample row keys: "+Object.keys(rows[0]||{}).join(","));
              console.log("cot: sample market names: "+rows.slice(0,6).map(r=>r.market_and_exchange_names).join(" | "));
              console.log("cot: keeping existing file");
              process.exit(0);
            }
            console.log("cot matched "+got+"/"+MARKETS.length+" markets:");
            matched.forEach(s=>console.log("  "+s));
            const missing=MARKETS.map(m=>m.id).filter(id=>!out[id]);
            if(missing.length)console.log("cot MISSING: "+missing.join(", "));
            let prev=null;try{prev=JSON.parse(fs.readFileSync("cot_data.json","utf8"));}catch(e){}
            if(prev&&JSON.stringify(prev.symbols)===JSON.stringify(out)){console.log("cot: unchanged, keeping existing file");process.exit(0);}
            const result={report_date:reportDate,updated:new Date().toISOString(),symbols:out};
            fs.writeFileSync("cot_data.json",JSON.stringify(result,null,1));
            console.log("cot_data.json written: "+got+" markets, report "+reportDate+", history up to "+HIST_LEN+" weeks");
          '
          rm -f cot_raw.json

      - name: Cleanup temp files
        run: rm -f thisweek.json nextweek.json fxstreet.json te.json tv.json tv_wide.json tv_recent.json alt_actuals.json ffhtml_*.html cot_raw.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ff_calendar.json ind_data.json
          [ -f bond_data.json ] && git add bond_data.json
          [ -f cot_data.json ] && git add cot_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update FF calendar + indicator data"
            git push
          fi
